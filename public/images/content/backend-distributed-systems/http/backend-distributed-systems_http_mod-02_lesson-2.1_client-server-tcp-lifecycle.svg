<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3e5199" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 1.5 L 1 5 L 10 8.5 z" fill="#167e6c" />
    </marker>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1b2d70" />
    </marker>
  </defs>

  <style>
    /* Default: Light Mode (Clean White Canvas) */
    :root {
      --diag-canvas: #ffffff;
      --diag-header-tag: #111a4a;
      --diag-header-sub: #1b2d70;
      --diag-text-main: #111a4a;
      --diag-text-sub: #1b2d70;
      --diag-text-desc: #1b2d70;

      --diag-client-card: #f8fafc;
      --diag-client-border: #111a4a;
      --diag-client-badge-bg: #111a4a;
      --diag-client-badge-text: #ffffff;

      --diag-server-card: #f8fafc;
      --diag-server-border: #167e6c;
      --diag-server-badge-bg: #167e6c;
      --diag-server-badge-text: #ffffff;

      --diag-handshake-stroke: #3e5199;
      --diag-proc-card-bg: #ffffff;
      --diag-proc-card-border: #3e5199;
      --diag-line-dim: #3e5199;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #12161e;
      --diag-header-tag: #3e5199;
      --diag-header-sub: #5568ad;
      --diag-text-main: #ffffff;
      --diag-text-sub: #cbd5e1;
      --diag-text-desc: #cbd5e1;

      --diag-client-card: #111a4a15;
      --diag-client-border: #111a4a;
      --diag-client-badge-bg: #111a4a;
      --diag-client-badge-text: #ffffff;

      --diag-server-card: #167e6c15;
      --diag-server-border: #167e6c;
      --diag-server-badge-bg: #167e6c;
      --diag-server-badge-text: #ffffff;

      --diag-handshake-stroke: #3e5199;
      --diag-proc-card-bg: #0c1017;
      --diag-proc-card-border: #3e5199;
      --diag-line-dim: #3e5199;
    }

    /* Standalone SVG Viewer */
    @media (prefers-color-scheme: dark) {
      :root:not(html) {
        --diag-canvas: #12161e;
        --diag-header-tag: #3e5199;
        --diag-header-sub: #5568ad;
        --diag-text-main: #ffffff;
        --diag-text-sub: #cbd5e1;
        --diag-text-desc: #cbd5e1;

        --diag-client-card: #111a4a15;
        --diag-client-border: #111a4a;
        --diag-client-badge-bg: #111a4a;
        --diag-client-badge-text: #ffffff;

        --diag-server-card: #167e6c15;
        --diag-server-border: #167e6c;
        --diag-server-badge-bg: #167e6c;
        --diag-server-badge-text: #ffffff;

        --diag-handshake-stroke: #3e5199;
        --diag-proc-card-bg: #0c1017;
        --diag-proc-card-border: #3e5199;
        --diag-line-dim: #3e5199;
      }
    }

    .header-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: var(--diag-header-tag); letter-spacing: 1.5px; text-transform: uppercase; }
    .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: var(--diag-header-sub); }
    .node-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14.5px; font-weight: 700; fill: var(--diag-text-main); text-anchor: middle; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: var(--diag-text-sub); text-anchor: middle; }
    .node-badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-anchor: middle; }
    .step-num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; fill: var(--diag-text-main); }
    .step-desc { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; fill: var(--diag-text-desc); }
    .line-dim { stroke: var(--diag-line-dim); stroke-width: 1.5; stroke-dasharray: 4,4; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="920" height="360" fill="var(--diag-canvas)" />

  <!-- Diagram Title Header -->
  <text x="35" y="32" class="header-tag">HTTP PROTOCOL ARCHITECTURE</text>
  <text x="35" y="48" class="header-sub">Client-Server Connection Lifecycle: Socket Handshake, Request Framing, and Processing</text>

  <!-- ========================================================================= -->
  <!-- LEFT NODE: HTTP CLIENT -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 70)" filter="url(#shadow)">
    <rect width="190" height="260" rx="10" fill="var(--diag-client-card)" stroke="var(--diag-client-border)" stroke-width="1.5" />
    <rect x="55" y="20" width="80" height="22" rx="4" fill="var(--diag-client-badge-bg)" stroke="var(--diag-client-border)" stroke-width="1" />
    <text x="95" y="35" class="node-badge" fill="var(--diag-client-badge-text)">CLIENT</text>
    <text x="95" y="115" class="node-title">HTTP Client</text>
    <text x="95" y="145" class="node-sub">(cURL / Browser /</text>
    <text x="95" y="165" class="node-sub">Microservice)</text>
    <rect x="25" y="210" width="140" height="28" rx="6" fill="#111a4a" stroke="#111a4a" stroke-width="0.8" />
    <text x="95" y="228" class="node-badge" fill="#ffffff">TCP Sockets &amp; TLS</text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT NODE: WEB SERVER -->
  <!-- ========================================================================= -->
  <g transform="translate(695, 70)" filter="url(#shadow)">
    <rect width="190" height="260" rx="10" fill="var(--diag-server-card)" stroke="var(--diag-server-border)" stroke-width="1.5" />
    <rect x="55" y="20" width="80" height="22" rx="4" fill="var(--diag-server-badge-bg)" stroke="var(--diag-server-border)" stroke-width="1" />
    <text x="95" y="35" class="node-badge" fill="var(--diag-server-badge-text)">SERVER</text>
    <text x="95" y="115" class="node-title">Web Server</text>
    <text x="95" y="145" class="node-sub">(Tomcat in</text>
    <text x="95" y="165" class="node-sub">Spring Boot)</text>
    <rect x="25" y="210" width="140" height="28" rx="6" fill="#167e6c" stroke="#167e6c" stroke-width="0.8" />
    <text x="95" y="228" class="node-badge" fill="#ffffff">Port :8080 / :443</text>
  </g>

  <!-- ========================================================================= -->
  <!-- INTERMEDIATE FLOWS & ARROWS -->
  <!-- ========================================================================= -->

  <!-- Flow 1: TCP Handshake -->
  <g transform="translate(245, 95)">
    <text x="215" y="-6" text-anchor="middle" class="step-desc">1. Establish TCP Connection (SYN, SYN-ACK, ACK)</text>
    <path d="M 0 5 L 430 5" stroke="var(--diag-handshake-stroke)" stroke-width="1.5" marker-end="url(#arrowNavy)" />
  </g>

  <!-- Flow 2: Plain-Text Request -->
  <g transform="translate(245, 145)">
    <text x="215" y="-6" text-anchor="middle" class="step-desc" fill="#3e5199">2. Send Plain-Text HTTP Request Over TCP Socket</text>
    <path d="M 0 5 L 430 5" stroke="#3e5199" stroke-width="2" marker-end="url(#arrowBlue)" />
  </g>

  <!-- Flow 3: Server Processing Card -->
  <g transform="translate(265, 185)">
    <rect width="390" height="32" rx="8" fill="var(--diag-proc-card-bg)" stroke="var(--diag-proc-card-border)" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#111a4a" />
    <text x="35" y="21" class="step-num">3.</text>
    <text x="55" y="21" class="step-desc">Server Processes Request in Worker Thread</text>
    <text x="365" y="21" class="node-badge" fill="#111a4a">IOC</text>
  </g>

  <!-- Flow 4: Transmit HTTP Response -->
  <g transform="translate(245, 255)">
    <text x="215" y="-6" text-anchor="middle" class="step-desc" fill="#167e6c">4. Transmit HTTP Response Over Socket</text>
    <path d="M 430 5 L 0 5" stroke="#167e6c" stroke-width="2" marker-start="url(#arrowGreen)" />
  </g>

  <!-- Flow 5: Connection State Annotation -->
  <g transform="translate(245, 305)">
    <text x="215" y="0" text-anchor="middle" class="step-desc" fill="var(--diag-text-sub)">5. Connection Closed or Kept Alive (Keep-Alive)</text>
    <path d="M 30 10 L 400 10" class="line-dim" />
  </g>
</svg>