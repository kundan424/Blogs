<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3e5199" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#167e6c" />
    </marker>
  </defs>

  <style>
    /* Default: Light Mode (Clean White Canvas) */
    :root {
      --diag-canvas: #ffffff;
      --diag-header-tag: #111a4a;
      --diag-header-sub: #1b2d70;

      --diag-step-bg: #f8fafc;
      --diag-step-border: #3e5199;
      --diag-step-title: #111a4a;
      --diag-step-desc: #1b2d70;
      --diag-step-pill: #3e5199;

      --diag-badge-bg: #111a4a;
      --diag-badge-border: #111a4a;
      --diag-badge-text: #ffffff;

      --diag-badge2-bg: #1b2d70;
      --diag-badge2-border: #1b2d70;
      --diag-badge2-text: #ffffff;

      --diag-box-inner: #ffffff;
      --diag-box-inner-border: #3e5199;
      --diag-code: #1b2d70;

      --diag-exec-bg: #f8fafc;
      --diag-exec-border: #167e6c;
      --diag-exec-title: #111a4a;
      --diag-exec-desc: #167e6c;
      --diag-exec-badge-bg: #167e6c;
      --diag-exec-badge-text: #ffffff;

      --diag-arrow: #3e5199;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #12161e;
      --diag-header-tag: #3e5199;
      --diag-header-sub: #5568ad;

      --diag-step-bg: #111a4a15;
      --diag-step-border: #3e5199;
      --diag-step-title: #ffffff;
      --diag-step-desc: #cbd5e1;
      --diag-step-pill: #5568ad;

      --diag-badge-bg: #111a4a;
      --diag-badge-border: #111a4a;
      --diag-badge-text: #ffffff;

      --diag-badge2-bg: #1b2d70;
      --diag-badge2-border: #1b2d70;
      --diag-badge2-text: #ffffff;

      --diag-box-inner: #0c1017;
      --diag-box-inner-border: #3e5199;
      --diag-code: #5568ad;

      --diag-exec-bg: #167e6c15;
      --diag-exec-border: #167e6c;
      --diag-exec-title: #ffffff;
      --diag-exec-desc: #167e6c;
      --diag-exec-badge-bg: #167e6c;
      --diag-exec-badge-text: #ffffff;

      --diag-arrow: #3e5199;
    }

    /* Standalone SVG Viewer */
    @media (prefers-color-scheme: dark) {
      :root:not(html) {
        --diag-canvas: #12161e;
        --diag-header-tag: #3e5199;
        --diag-header-sub: #5568ad;

        --diag-step-bg: #111a4a15;
        --diag-step-border: #3e5199;
        --diag-step-title: #ffffff;
        --diag-step-desc: #cbd5e1;
        --diag-step-pill: #5568ad;

        --diag-badge-bg: #111a4a;
        --diag-badge-border: #111a4a;
        --diag-badge-text: #ffffff;

        --diag-badge2-bg: #1b2d70;
        --diag-badge2-border: #1b2d70;
        --diag-badge2-text: #ffffff;

        --diag-box-inner: #0c1017;
        --diag-box-inner-border: #3e5199;
        --diag-code: #5568ad;

        --diag-exec-bg: #167e6c15;
        --diag-exec-border: #167e6c;
        --diag-exec-title: #ffffff;
        --diag-exec-desc: #167e6c;
        --diag-exec-badge-bg: #167e6c;
        --diag-exec-badge-text: #ffffff;

        --diag-arrow: #3e5199;
      }
    }

    .header-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: var(--diag-header-tag); letter-spacing: 1.5px; text-transform: uppercase; }
    .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: var(--diag-header-sub); }
    .step-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; font-weight: 700; fill: var(--diag-step-title); }
    .step-meta { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
    .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: var(--diag-step-desc); }
    .code-snippet { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; fill: var(--diag-code); }
  </style>

  <!-- Background Base Canvas -->
  <rect width="960" height="480" fill="var(--diag-canvas)" />

  <!-- Diagram Title Header -->
  <text x="35" y="32" class="header-tag">INVERSION OF CONTROL (IOC) CONTAINER ASSEMBLY LIFECYCLE</text>
  <text x="35" y="48" class="header-sub">Separation of Concerns: Component Scanning, DAG Topological Dependency Resolution, and Runtime Request Execution</text>

  <!-- ========================================================================= -->
  <!-- STEP 1: COMPONENT SCANNING -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 75)" filter="url(#shadow)">
    <rect width="265" height="375" rx="8" fill="var(--diag-step-bg)" stroke="var(--diag-step-border)" stroke-width="1.5" />
    
    <rect x="16" y="16" width="140" height="22" rx="4" fill="var(--diag-badge-bg)" stroke="var(--diag-badge-border)" stroke-width="1" />
    <text x="86" y="31" text-anchor="middle" class="step-meta" fill="var(--diag-badge-text)">1. DISCOVERY PHASE</text>

    <text x="16" y="60" class="step-title">Component Scanning</text>
    <text x="16" y="78" class="step-desc">Spring inspects classpath annotations:</text>

    <!-- Scanned annotations box -->
    <g transform="translate(16, 96)">
      <rect width="233" height="135" rx="6" fill="var(--diag-box-inner)" stroke="var(--diag-box-inner-border)" stroke-width="1" />
      <text x="12" y="24" class="code-snippet" font-weight="700" fill="#111a4a">@Component</text>
      <text x="12" y="46" class="code-snippet">@Service  OrderService</text>
      <text x="12" y="68" class="code-snippet">@Repository PostgresOrderRepo</text>
      <text x="12" y="90" class="code-snippet">@Component  StripeGateway</text>
      <text x="12" y="112" class="code-snippet">@RestController OrderController</text>
    </g>

    <g transform="translate(16, 245)">
      <rect width="233" height="110" rx="6" fill="var(--diag-box-inner)" stroke="var(--diag-box-inner-border)" stroke-width="1" />
      <text x="12" y="22" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="var(--diag-step-title)">BeanDefinition Creation:</text>
      <text x="12" y="42" class="step-desc">• Records class metadata</text>
      <text x="12" y="62" class="step-desc">• Discovers constructor parameters</text>
      <text x="12" y="82" class="step-desc">• Configures scope (Singleton)</text>
      <text x="12" y="100" class="step-desc">• Zero reflection invocation yet!</text>
    </g>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 300 262 L 345 262" stroke="var(--diag-arrow)" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- ========================================================================= -->
  <!-- STEP 2: DEPENDENCY DAG & WIRING -->
  <!-- ========================================================================= -->
  <g transform="translate(347, 75)" filter="url(#shadow)">
    <rect width="265" height="375" rx="8" fill="var(--diag-step-bg)" stroke="var(--diag-step-border)" stroke-width="1.5" />

    <rect x="16" y="16" width="140" height="22" rx="4" fill="var(--diag-badge2-bg)" stroke="var(--diag-badge2-border)" stroke-width="1" />
    <text x="86" y="31" text-anchor="middle" class="step-meta" fill="var(--diag-badge2-text)">2. WIRING PHASE</text>

    <text x="16" y="60" class="step-title">DAG Graph &amp; Injection</text>
    <text x="16" y="78" class="step-desc">Resolves dependency topology:</text>

    <!-- Graph visualization box -->
    <g transform="translate(16, 96)">
      <rect width="233" height="135" rx="6" fill="var(--diag-box-inner)" stroke="var(--diag-box-inner-border)" stroke-width="1" />
      <!-- Node: Leaf repos -->
      <rect x="12" y="12" width="98" height="26" rx="4" fill="var(--diag-step-bg)" stroke="var(--diag-step-border)" />
      <text x="61" y="29" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="var(--diag-step-title)">PostgresRepo</text>

      <rect x="122" y="12" width="98" height="26" rx="4" fill="var(--diag-step-bg)" stroke="var(--diag-step-border)" />
      <text x="171" y="29" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="var(--diag-step-title)">StripeGateway</text>

      <path d="M 61 40 L 61 58 L 116 58" stroke="var(--diag-arrow)" stroke-width="1.5" />
      <path d="M 171 40 L 171 58 L 116 58" stroke="var(--diag-arrow)" stroke-width="1.5" />

      <!-- Node: OrderService -->
      <rect x="52" y="62" width="130" height="26" rx="4" fill="#1b2d70" stroke="#1b2d70" />
      <text x="117" y="79" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ffffff">OrderService</text>

      <path d="M 117 90 L 117 100" stroke="var(--diag-arrow)" stroke-width="1.5" marker-end="url(#arrowBlue)" />

      <!-- Node: OrderController -->
      <rect x="42" y="102" width="150" height="24" rx="4" fill="var(--diag-step-bg)" stroke="var(--diag-step-border)" />
      <text x="117" y="118" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="var(--diag-step-title)">OrderController</text>
    </g>

    <g transform="translate(16, 245)">
      <rect width="233" height="110" rx="6" fill="var(--diag-box-inner)" stroke="var(--diag-box-inner-border)" stroke-width="1" />
      <text x="12" y="22" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="var(--diag-step-title)">Constructor Resolution:</text>
      <text x="12" y="42" class="step-desc">• Instantiates leaves first (Postgres)</text>
      <text x="12" y="62" class="step-desc">• Injects dependencies upwards</text>
      <text x="12" y="82" class="step-desc">• Detects circular loops at startup</text>
      <text x="12" y="100" class="step-desc">• Stores ready singletons in cache</text>
    </g>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 612 262 L 657 262" stroke="#167e6c" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- ========================================================================= -->
  <!-- STEP 3: RUNTIME BUSINESS EXECUTION -->
  <!-- ========================================================================= -->
  <g transform="translate(660, 75)" filter="url(#shadow)">
    <rect width="265" height="375" rx="8" fill="var(--diag-exec-bg)" stroke="var(--diag-exec-border)" stroke-width="1.5" />

    <rect x="16" y="16" width="140" height="22" rx="4" fill="var(--diag-exec-badge-bg)" stroke="var(--diag-exec-border)" stroke-width="1" />
    <text x="86" y="31" text-anchor="middle" class="step-meta" fill="var(--diag-exec-badge-text)">3. EXECUTION PHASE</text>

    <text x="16" y="60" class="step-title" fill="var(--diag-exec-title)">Runtime Request Flow</text>
    <text x="16" y="78" class="step-desc" fill="var(--diag-exec-desc)">Pure zero-overhead business calls:</text>

    <!-- Request flow box -->
    <g transform="translate(16, 96)">
      <rect width="233" height="135" rx="6" fill="var(--diag-box-inner)" stroke="var(--diag-exec-border)" stroke-width="1" />
      <text x="12" y="24" class="code-snippet" font-weight="700" fill="#167e6c">POST /api/v1/orders</text>
      <text x="12" y="44" class="step-desc">• DispatcherServlet receives HTTP</text>
      <text x="12" y="64" class="step-desc">• Routes to cached Controller</text>
      <text x="12" y="84" class="step-desc">• Controller calls Service</text>
      <text x="12" y="104" class="step-desc">• Zero "new" calls during execution</text>
      <text x="12" y="122" class="step-desc">• Sub-millisecond latency</text>
    </g>

    <g transform="translate(16, 245)">
      <rect width="233" height="110" rx="6" fill="var(--diag-box-inner)" stroke="var(--diag-exec-border)" stroke-width="1" />
      <text x="12" y="22" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="var(--diag-exec-title)">Architectural Separation:</text>
      <text x="12" y="42" class="step-desc" fill="var(--diag-exec-desc)">Creation: Handled once at startup</text>
      <text x="12" y="62" class="step-desc" fill="var(--diag-exec-desc)">Execution: Scalable stateless requests</text>
      <text x="12" y="82" class="step-desc" fill="var(--diag-exec-desc)">Garbage Collection: Near-zero churn</text>
      <text x="12" y="100" class="step-desc" fill="var(--diag-exec-desc)">Complete separation of concerns!</text>
    </g>
  </g>
</svg>