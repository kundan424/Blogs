<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1b2d70" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#167e6c" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3e5199" />
    </marker>
  </defs>

  <style>
    /* Default: Light Mode (Clean White Canvas) */
    :root {
      --diag-canvas: #ffffff;
      --diag-header-tag: #111a4a;
      --diag-header-sub: #1b2d70;

      --diag-tight-card-bg: #f8fafc;
      --diag-tight-card-border: #1b2d70;
      --diag-tight-badge-bg: #1b2d70;
      --diag-tight-badge-text: #ffffff;
      --diag-tight-title: #111a4a;
      --diag-tight-box-bg: #ffffff;
      --diag-tight-box-border: #3e5199;
      --diag-tight-code: #1b2d70;

      --diag-di-card-bg: #f8fafc;
      --diag-di-card-border: #167e6c;
      --diag-di-badge-bg: #167e6c;
      --diag-di-badge-text: #ffffff;
      --diag-di-title: #111a4a;
      --diag-di-box-bg: #ffffff;
      --diag-di-box-border: #167e6c;
      --diag-di-code: #167e6c;

      --diag-ioc-bg: #3e5199;
      --diag-ioc-border: #111a4a;
      --diag-ioc-text: #ffffff;

      --diag-text-main: #111a4a;
      --diag-text-sub: #1b2d70;
      --diag-text-meta: #3e5199;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #12161e;
      --diag-header-tag: #3e5199;
      --diag-header-sub: #5568ad;

      --diag-tight-card-bg: #111a4a15;
      --diag-tight-card-border: #1b2d70;
      --diag-tight-badge-bg: #1b2d70;
      --diag-tight-badge-text: #ffffff;
      --diag-tight-title: #ffffff;
      --diag-tight-box-bg: #0c1017;
      --diag-tight-box-border: #3e5199;
      --diag-tight-code: #5568ad;

      --diag-di-card-bg: #167e6c15;
      --diag-di-card-border: #167e6c;
      --diag-di-badge-bg: #167e6c;
      --diag-di-badge-text: #ffffff;
      --diag-di-title: #ffffff;
      --diag-di-box-bg: #0c1017;
      --diag-di-box-border: #167e6c;
      --diag-di-code: #167e6c;

      --diag-ioc-bg: #3e5199;
      --diag-ioc-border: #3e5199;
      --diag-ioc-text: #ffffff;

      --diag-text-main: #ffffff;
      --diag-text-sub: #cbd5e1;
      --diag-text-meta: #5568ad;
    }

    /* Standalone SVG Viewer */
    @media (prefers-color-scheme: dark) {
      :root:not(html) {
        --diag-canvas: #12161e;
        --diag-header-tag: #3e5199;
        --diag-header-sub: #5568ad;

        --diag-tight-card-bg: #111a4a15;
        --diag-tight-card-border: #1b2d70;
        --diag-tight-badge-bg: #1b2d70;
        --diag-tight-badge-text: #ffffff;
        --diag-tight-title: #ffffff;
        --diag-tight-box-bg: #0c1017;
        --diag-tight-box-border: #3e5199;
        --diag-tight-code: #5568ad;

        --diag-di-card-bg: #167e6c15;
        --diag-di-card-border: #167e6c;
        --diag-di-badge-bg: #167e6c;
        --diag-di-badge-text: #ffffff;
        --diag-di-title: #ffffff;
        --diag-di-box-bg: #0c1017;
        --diag-di-box-border: #167e6c;
        --diag-di-code: #167e6c;

        --diag-ioc-bg: #3e5199;
        --diag-ioc-border: #3e5199;
        --diag-ioc-text: #ffffff;

        --diag-text-main: #ffffff;
        --diag-text-sub: #cbd5e1;
        --diag-text-meta: #5568ad;
      }
    }

    .header-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: var(--diag-header-tag); letter-spacing: 1.5px; text-transform: uppercase; }
    .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: var(--diag-header-sub); }
    .card-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; font-weight: 700; }
    .badge-pill { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
    .code-line { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
    .bullet-point { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: var(--diag-text-sub); }
    .node-box-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; font-weight: 700; fill: var(--diag-text-main); text-anchor: middle; }
    .node-box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: var(--diag-text-meta); text-anchor: middle; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="960" height="480" fill="var(--diag-canvas)" />

  <!-- Diagram Title Header -->
  <text x="35" y="32" class="header-tag">SOFTWARE ARCHITECTURAL PARADIGM</text>
  <text x="35" y="48" class="header-sub">Tight Coupling (Hardcoded Instantiation) vs. Inversion of Control &amp; Dependency Injection</text>

  <!-- ========================================================================= -->
  <!-- LEFT: TIGHT COUPLING (HARDCODED 'new') -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 72)" filter="url(#shadow)">
    <rect width="430" height="380" rx="10" fill="var(--diag-tight-card-bg)" stroke="var(--diag-tight-card-border)" stroke-width="1.5" />

    <!-- Badge & Header -->
    <rect x="20" y="16" width="165" height="22" rx="4" fill="var(--diag-tight-badge-bg)" stroke="var(--diag-tight-card-border)" stroke-width="1" />
    <text x="102" y="31" text-anchor="middle" class="badge-pill" fill="var(--diag-tight-badge-text)">TIGHTLY COUPLED</text>
    <text x="20" y="62" class="card-title" fill="var(--diag-tight-title)">Direct Instantiation (Anti-Pattern)</text>

    <!-- Caller Class: OrderService -->
    <g transform="translate(20, 80)">
      <rect width="390" height="80" rx="6" fill="var(--diag-tight-box-bg)" stroke="var(--diag-tight-box-border)" stroke-width="1" />
      <text x="195" y="24" class="node-box-title">OrderService (Consumer)</text>
      <text x="15" y="48" class="code-line" fill="var(--diag-tight-code)">this.repo = new PostgresOrderRepository();</text>
      <text x="15" y="68" class="code-line" fill="var(--diag-tight-code)">this.gateway = new StripePaymentGateway();</text>
    </g>

    <!-- Downward Arrows with 'Instantiates' tag -->
    <path d="M 120 162 L 120 200" stroke="#1b2d70" stroke-width="1.8" marker-end="url(#arrowNavy)" />
    <path d="M 310 162 L 310 200" stroke="#1b2d70" stroke-width="1.8" marker-end="url(#arrowNavy)" />

    <!-- Hardcoded Callee Dependencies -->
    <g transform="translate(20, 202)">
      <!-- Left concrete -->
      <rect x="0" y="0" width="185" height="52" rx="6" fill="var(--diag-tight-box-bg)" stroke="var(--diag-tight-box-border)" stroke-width="1" />
      <text x="92" y="24" class="node-box-title">PostgresOrderRepo</text>
      <text x="92" y="42" class="node-box-sub">Needs Live DB Port :5432</text>

      <!-- Right concrete -->
      <rect x="205" y="0" width="185" height="52" rx="6" fill="var(--diag-tight-box-bg)" stroke="var(--diag-tight-box-border)" stroke-width="1" />
      <text x="297" y="24" class="node-box-title">StripePaymentGateway</text>
      <text x="297" y="42" class="node-box-sub">Needs Real API Secret Key</text>
    </g>

    <!-- Flaws Checklist -->
    <g transform="translate(20, 276)">
      <rect width="390" height="86" rx="6" fill="var(--diag-tight-box-bg)" stroke="var(--diag-tight-box-border)" stroke-width="0.8" />
      <text x="14" y="22" class="bullet-point">• <tspan font-weight="700" fill="#111a4a">Untestable:</tspan> Unit tests hit live DB &amp; external billing APIs.</text>
      <text x="14" y="42" class="bullet-point">• <tspan font-weight="700" fill="#111a4a">Rigid:</tspan> Cannot switch to PayPal without editing OrderService.java.</text>
      <text x="14" y="62" class="bullet-point">• <tspan font-weight="700" fill="#111a4a">DIP Violation:</tspan> High-level logic depends directly on low-level SQL.</text>
      <text x="14" y="78" class="bullet-point">• <tspan font-weight="700" fill="#111a4a">SRP Violation:</tspan> Manages business logic AND object lifecycle.</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: DEPENDENCY INJECTION & IOC -->
  <!-- ========================================================================= -->
  <g transform="translate(495, 72)" filter="url(#shadow)">
    <rect width="430" height="380" rx="10" fill="var(--diag-di-card-bg)" stroke="var(--diag-di-card-border)" stroke-width="1.5" />

    <!-- Badge & Header -->
    <rect x="20" y="16" width="165" height="22" rx="4" fill="var(--diag-di-badge-bg)" stroke="var(--diag-di-card-border)" stroke-width="1" />
    <text x="102" y="31" text-anchor="middle" class="badge-pill" fill="var(--diag-di-badge-text)">INVERSION OF CONTROL</text>
    <text x="20" y="62" class="card-title" fill="var(--diag-di-title)">Dependency Injection &amp; Inversion</text>

    <!-- Caller Class: OrderService (Decoupled) -->
    <g transform="translate(20, 80)">
      <rect width="390" height="80" rx="6" fill="var(--diag-di-box-bg)" stroke="var(--diag-di-box-border)" stroke-width="1" />
      <text x="195" y="24" class="node-box-title">OrderService (Decoupled)</text>
      <text x="15" y="48" class="code-line" fill="var(--diag-di-code)">public OrderService(OrderRepository repo,</text>
      <text x="142" y="68" class="code-line" fill="var(--diag-di-code)">PaymentGateway gateway) { ... }</text>
    </g>

    <!-- IoC Container Injection Banner -->
    <g transform="translate(20, 172)">
      <rect width="390" height="28" rx="14" fill="var(--diag-ioc-bg)" stroke="var(--diag-ioc-border)" stroke-width="1" />
      <text x="195" y="18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="var(--diag-ioc-text)">SPRING IOC CONTAINER / INJECTOR</text>
    </g>

    <!-- Injected Polymorphic Implementations -->
    <g transform="translate(20, 212)">
      <!-- Left Interface & Impl -->
      <rect x="0" y="0" width="185" height="52" rx="6" fill="var(--diag-di-box-bg)" stroke="var(--diag-di-box-border)" stroke-width="1" />
      <text x="92" y="22" class="node-box-title">&lt;&lt;interface&gt;&gt;</text>
      <text x="92" y="40" class="node-box-sub" font-weight="600" fill="var(--diag-text-main)">OrderRepository</text>

      <!-- Right Interface & Impl -->
      <rect x="205" y="0" width="185" height="52" rx="6" fill="var(--diag-di-box-bg)" stroke="var(--diag-di-box-border)" stroke-width="1" />
      <text x="297" y="22" class="node-box-title">&lt;&lt;interface&gt;&gt;</text>
      <text x="297" y="40" class="node-box-sub" font-weight="600" fill="var(--diag-text-main)">PaymentGateway</text>
    </g>

    <!-- Benefits Checklist -->
    <g transform="translate(20, 276)">
      <rect width="390" height="86" rx="6" fill="var(--diag-di-box-bg)" stroke="var(--diag-di-box-border)" stroke-width="0.8" />
      <text x="14" y="22" class="bullet-point">• <tspan font-weight="700" fill="#167e6c">100% Testable:</tspan> Pass Mockito mocks in 5ms unit tests.</text>
      <text x="14" y="42" class="bullet-point">• <tspan font-weight="700" fill="#167e6c">Decoupled:</tspan> Swap Stripe with PayPal or Fake via configuration.</text>
      <text x="14" y="62" class="bullet-point">• <tspan font-weight="700" fill="#167e6c">DIP Compliant:</tspan> High-level &amp; low-level depend on abstractions.</text>
      <text x="14" y="78" class="bullet-point">• <tspan font-weight="700" fill="#167e6c">SRP Clean:</tspan> OrderService only executes business rules.</text>
    </g>
  </g>
</svg>