<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1b2d70" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#167e6c" />
    </marker>
  </defs>

  <style>
    /* Default: Light Mode (Clean White Canvas) */
    :root {
      --diag-canvas: #ffffff;
      --diag-header-tag: #111a4a;
      --diag-header-sub: #1b2d70;

      --diag-prod-bg: #f8fafc;
      --diag-prod-border: #1b2d70;
      --diag-prod-badge-bg: #1b2d70;
      --diag-prod-badge-text: #ffffff;
      --diag-prod-title: #111a4a;
      --diag-prod-box: #ffffff;
      --diag-prod-box-border: #3e5199;
      --diag-prod-arrow: #1b2d70;

      --diag-test-bg: #f8fafc;
      --diag-test-border: #167e6c;
      --diag-test-badge-bg: #167e6c;
      --diag-test-badge-text: #ffffff;
      --diag-test-title: #111a4a;
      --diag-test-box: #ffffff;
      --diag-test-box-border: #167e6c;
      --diag-test-arrow: #167e6c;

      --diag-text-main: #111a4a;
      --diag-text-sub: #1b2d70;
      --diag-text-code: #3e5199;
      --diag-text-mock: #167e6c;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #12161e;
      --diag-header-tag: #3e5199;
      --diag-header-sub: #5568ad;

      --diag-prod-bg: #111a4a15;
      --diag-prod-border: #1b2d70;
      --diag-prod-badge-bg: #1b2d70;
      --diag-prod-badge-text: #ffffff;
      --diag-prod-title: #ffffff;
      --diag-prod-box: #0c1017;
      --diag-prod-box-border: #3e5199;
      --diag-prod-arrow: #3e5199;

      --diag-test-bg: #167e6c15;
      --diag-test-border: #167e6c;
      --diag-test-badge-bg: #167e6c;
      --diag-test-badge-text: #ffffff;
      --diag-test-title: #ffffff;
      --diag-test-box: #0c1017;
      --diag-test-box-border: #167e6c;
      --diag-test-arrow: #167e6c;

      --diag-text-main: #ffffff;
      --diag-text-sub: #cbd5e1;
      --diag-text-code: #5568ad;
      --diag-text-mock: #167e6c;
    }

    /* Standalone SVG Viewer */
    @media (prefers-color-scheme: dark) {
      :root:not(html) {
        --diag-canvas: #12161e;
        --diag-header-tag: #3e5199;
        --diag-header-sub: #5568ad;

        --diag-prod-bg: #111a4a15;
        --diag-prod-border: #1b2d70;
        --diag-prod-badge-bg: #1b2d70;
        --diag-prod-badge-text: #ffffff;
        --diag-prod-title: #ffffff;
        --diag-prod-box: #0c1017;
        --diag-prod-box-border: #3e5199;
        --diag-prod-arrow: #3e5199;

        --diag-test-bg: #167e6c15;
        --diag-test-border: #167e6c;
        --diag-test-badge-bg: #167e6c;
        --diag-test-badge-text: #ffffff;
        --diag-test-title: #ffffff;
        --diag-test-box: #0c1017;
        --diag-test-box-border: #167e6c;
        --diag-test-arrow: #167e6c;

        --diag-text-main: #ffffff;
        --diag-text-sub: #cbd5e1;
        --diag-text-code: #5568ad;
        --diag-text-mock: #167e6c;
      }
    }

    .header-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: var(--diag-header-tag); letter-spacing: 1.5px; text-transform: uppercase; }
    .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: var(--diag-header-sub); }
    .section-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; font-weight: 700; }
    .badge-pill { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
    .node-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; fill: var(--diag-text-main); text-anchor: middle; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: var(--diag-text-sub); text-anchor: middle; }
    .timing-badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="960" height="490" fill="var(--diag-canvas)" />

  <!-- Diagram Title Header -->
  <text x="35" y="32" class="header-tag">TESTABILITY THROUGH DEPENDENCY INJECTION</text>
  <text x="35" y="48" class="header-sub">Production Infrastructure Wiring vs. Sub-Millisecond Isolated Unit Testing via Mockito Test Doubles</text>

  <!-- ========================================================================= -->
  <!-- TOP CARD: PRODUCTION WIRING -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 70)" filter="url(#shadow)">
    <rect width="890" height="185" rx="8" fill="var(--diag-prod-bg)" stroke="var(--diag-prod-border)" stroke-width="1.5" />

    <!-- Badge & Header -->
    <rect x="20" y="16" width="180" height="22" rx="4" fill="var(--diag-prod-badge-bg)" stroke="var(--diag-prod-border)" stroke-width="1" />
    <text x="110" y="31" text-anchor="middle" class="badge-pill" fill="var(--diag-prod-badge-text)">1. PRODUCTION RUNTIME</text>

    <text x="215" y="31" class="section-title" fill="var(--diag-prod-title)">Real External Dependencies &amp; Network I/O</text>

    <!-- Timing Indicator -->
    <rect x="735" y="14" width="135" height="24" rx="4" fill="var(--diag-prod-badge-bg)" stroke="var(--diag-prod-border)" />
    <text x="802" y="30" text-anchor="middle" class="timing-badge" fill="var(--diag-prod-badge-text)">LATENCY: ~2,500ms</text>

    <!-- Core Service -->
    <g transform="translate(20, 60)">
      <rect width="210" height="95" rx="6" fill="var(--diag-prod-box)" stroke="var(--diag-prod-box-border)" stroke-width="1" />
      <text x="105" y="28" class="node-title">OrderService</text>
      <text x="105" y="48" class="node-sub">Injected via Spring Context</text>
      <text x="105" y="66" class="node-sub" fill="#1b2d70">Coordinates Order Flow</text>
      <text x="105" y="84" class="node-sub">Real Transactional Boundary</text>
    </g>

    <!-- Arrow to Postgres -->
    <path d="M 230 90 L 320 90" stroke="var(--diag-prod-arrow)" stroke-width="1.8" marker-end="url(#arrowNavy)" />
    <text x="275" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1b2d70">JDBC</text>

    <!-- Postgres Repo Box -->
    <g transform="translate(325, 60)">
      <rect width="230" height="95" rx="6" fill="var(--diag-prod-box)" stroke="var(--diag-prod-box-border)" stroke-width="1" />
      <text x="115" y="28" class="node-title">PostgresOrderRepository</text>
      <text x="115" y="48" class="node-sub">HikariCP Pool / Socket :5432</text>
      <text x="115" y="66" class="node-sub">Disk Heap Page Read / Write</text>
      <text x="115" y="84" class="node-sub">Subject to DB Outage</text>
    </g>

    <!-- Arrow to Stripe -->
    <path d="M 555 90 L 645 90" stroke="var(--diag-prod-arrow)" stroke-width="1.8" marker-end="url(#arrowNavy)" />
    <text x="600" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1b2d70">HTTPS</text>

    <!-- Stripe Gateway Box -->
    <g transform="translate(650, 60)">
      <rect width="220" height="95" rx="6" fill="var(--diag-prod-box)" stroke="var(--diag-prod-box-border)" stroke-width="1" />
      <text x="110" y="28" class="node-title">StripePaymentGateway</text>
      <text x="110" y="48" class="node-sub">Public Cloud REST API</text>
      <text x="110" y="66" class="node-sub">Real TLS Handshake &amp; Auth</text>
      <text x="110" y="84" class="node-sub">External Rate Limiting</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM CARD: UNIT TESTING WITH MOCKS -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 275)" filter="url(#shadow)">
    <rect width="890" height="185" rx="8" fill="var(--diag-test-bg)" stroke="var(--diag-test-border)" stroke-width="1.5" />

    <!-- Badge & Header -->
    <rect x="20" y="16" width="180" height="22" rx="4" fill="var(--diag-test-badge-bg)" stroke="var(--diag-test-border)" stroke-width="1" />
    <text x="110" y="31" text-anchor="middle" class="badge-pill" fill="var(--diag-test-badge-text)">2. ISOLATED UNIT TEST</text>

    <text x="215" y="31" class="section-title" fill="var(--diag-test-title)">Pure In-Memory Mocks &amp; Deterministic Test Doubles</text>

    <!-- Timing Indicator -->
    <rect x="735" y="14" width="135" height="24" rx="4" fill="var(--diag-test-badge-bg)" stroke="var(--diag-test-border)" />
    <text x="802" y="30" text-anchor="middle" class="timing-badge" fill="var(--diag-test-badge-text)">SPEED: ~4ms (100% OFFLINE)</text>

    <!-- Core Service Under Test -->
    <g transform="translate(20, 60)">
      <rect width="210" height="95" rx="6" fill="var(--diag-test-box)" stroke="var(--diag-test-box-border)" stroke-width="1" />
      <text x="105" y="28" class="node-title">OrderService</text>
      <text x="105" y="48" class="node-sub">Under Test (Pure Java Object)</text>
      <text x="105" y="66" class="node-sub" fill="#167e6c">Instantiated via: new OrderService(..)</text>
      <text x="105" y="84" class="node-sub">Zero Spring Container Overhead</text>
    </g>

    <!-- Arrow to Mock Repo -->
    <path d="M 230 90 L 320 90" stroke="var(--diag-test-arrow)" stroke-width="1.8" marker-end="url(#arrowGreen)" />
    <text x="275" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#167e6c">STUB</text>

    <!-- Mock Repo Box -->
    <g transform="translate(325, 60)">
      <rect width="230" height="95" rx="6" fill="var(--diag-test-box)" stroke="var(--diag-test-box-border)" stroke-width="1" />
      <text x="115" y="26" class="node-title" fill="#167e6c">mock(OrderRepository.class)</text>
      <text x="115" y="48" class="node-sub">Mockito In-Memory Double</text>
      <text x="115" y="66" class="node-sub">verify(repo).save(expectedOrder)</text>
      <text x="115" y="84" class="node-sub">Zero DB I/O: 0.1ms RAM lookup</text>
    </g>

    <!-- Arrow to Mock Gateway -->
    <path d="M 555 90 L 645 90" stroke="var(--diag-test-arrow)" stroke-width="1.8" marker-end="url(#arrowGreen)" />
    <text x="600" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#167e6c">MOCK</text>

    <!-- Mock Stripe Box -->
    <g transform="translate(650, 60)">
      <rect width="220" height="95" rx="6" fill="var(--diag-test-box)" stroke="var(--diag-test-box-border)" stroke-width="1" />
      <text x="110" y="26" class="node-title" fill="#167e6c">mock(PaymentGateway.class)</text>
      <text x="110" y="48" class="node-sub">Simulate Edge Cases:</text>
      <text x="110" y="66" class="node-sub">when(..charge()).thenThrow(CardDeclined)</text>
      <text x="110" y="84" class="node-sub">Zero dollars spent; zero rate limits</text>
    </g>
  </g>
</svg>