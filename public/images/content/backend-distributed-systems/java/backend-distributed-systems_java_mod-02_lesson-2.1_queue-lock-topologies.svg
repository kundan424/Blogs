<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1b2d70" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#167e6c" />
    </marker>
  </defs>

  <style>
    /* Default: Light Mode */
    :root {
      --diag-canvas: #ffffff;
      --diag-header-main: #111a4a;
      --diag-header-sub: #1b2d70;
      --diag-panel-bg: #f8fafc;
      --diag-panel-border: #3e5199;
      --diag-panel-name: #111a4a;

      --diag-thread-bg: #ffffff;
      --diag-thread-border: #3e5199;
      --diag-box-title: #111a4a;
      --diag-box-sub: #1b2d70;

      --diag-single-lock-bg: #f8fafc;
      --diag-single-lock-border: #1b2d70;
      --diag-single-lock-text: #111a4a;
      --diag-single-inner: #ffffff;
      --diag-single-inner-border: #3e5199;

      --diag-dual-lock-bg: #f8fafc;
      --diag-dual-lock-border: #167e6c;
      --diag-dual-lock-text: #167e6c;
      --diag-dual-inner: #ffffff;
      --diag-dual-inner-border: #167e6c;

      --diag-atomic-bg: #f8fafc;
      --diag-atomic-border: #3e5199;
      --diag-atomic-text: #111a4a;

      --diag-badge-warn-bg: #1b2d70;
      --diag-badge-warn-border: #1b2d70;
      --diag-badge-warn-text: #ffffff;

      --diag-badge-pass-bg: #167e6c;
      --diag-badge-pass-border: #167e6c;
      --diag-badge-pass-text: #ffffff;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #12161e;
      --diag-header-main: #3e5199;
      --diag-header-sub: #5568ad;
      --diag-panel-bg: #111a4a15;
      --diag-panel-border: #3e5199;
      --diag-panel-name: #ffffff;

      --diag-thread-bg: #0c1017;
      --diag-thread-border: #3e5199;
      --diag-box-title: #ffffff;
      --diag-box-sub: #cbd5e1;

      --diag-single-lock-bg: #111a4a15;
      --diag-single-lock-border: #1b2d70;
      --diag-single-lock-text: #5568ad;
      --diag-single-inner: #0c1017;
      --diag-single-inner-border: #3e5199;

      --diag-dual-lock-bg: #167e6c15;
      --diag-dual-lock-border: #167e6c;
      --diag-dual-lock-text: #167e6c;
      --diag-dual-inner: #0c1017;
      --diag-dual-inner-border: #167e6c;

      --diag-atomic-bg: #0c1017;
      --diag-atomic-border: #3e5199;
      --diag-atomic-text: #ffffff;

      --diag-badge-warn-bg: #1b2d70;
      --diag-badge-warn-border: #1b2d70;
      --diag-badge-warn-text: #ffffff;

      --diag-badge-pass-bg: #167e6c;
      --diag-badge-pass-border: #167e6c;
      --diag-badge-pass-text: #ffffff;
    }

    /* Standalone SVG Viewer */
    @media (prefers-color-scheme: dark) {
      :root:not(html) {
        --diag-canvas: #12161e;
        --diag-header-main: #3e5199;
        --diag-header-sub: #5568ad;
        --diag-panel-bg: #111a4a15;
        --diag-panel-border: #3e5199;
        --diag-panel-name: #ffffff;

        --diag-thread-bg: #0c1017;
        --diag-thread-border: #3e5199;
        --diag-box-title: #ffffff;
        --diag-box-sub: #cbd5e1;

        --diag-single-lock-bg: #111a4a15;
        --diag-single-lock-border: #1b2d70;
        --diag-single-lock-text: #5568ad;
        --diag-single-inner: #0c1017;
        --diag-single-inner-border: #3e5199;

        --diag-dual-lock-bg: #167e6c15;
        --diag-dual-lock-border: #167e6c;
        --diag-dual-lock-text: #167e6c;
        --diag-dual-inner: #0c1017;
        --diag-dual-inner-border: #167e6c;

        --diag-atomic-bg: #0c1017;
        --diag-atomic-border: #3e5199;
        --diag-atomic-text: #ffffff;

        --diag-badge-warn-bg: #1b2d70;
        --diag-badge-warn-border: #1b2d70;
        --diag-badge-warn-text: #ffffff;

        --diag-badge-pass-bg: #167e6c;
        --diag-badge-pass-border: #167e6c;
        --diag-badge-pass-text: #ffffff;
      }
    }

    .header-main { font-family: ui-monospace, SFMono-Regular, "IBM Plex Mono", Menlo, monospace; font-size: 11px; font-weight: 700; fill: var(--diag-header-main); letter-spacing: 1.5px; text-transform: uppercase; }
    .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: var(--diag-header-sub); }
    .panel-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; fill: var(--diag-panel-name); }
    .badge-warn { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; font-weight: 700; fill: var(--diag-badge-warn-text); letter-spacing: 0.5px; }
    .badge-pass { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; font-weight: 700; fill: var(--diag-badge-pass-text); letter-spacing: 0.5px; }
    .box-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; font-weight: 600; fill: var(--diag-box-title); }
    .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: var(--diag-box-sub); }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: var(--diag-header-sub); }
  </style>

  <!-- Background Base Canvas -->
  <rect width="960" height="520" fill="var(--diag-canvas)" />

  <!-- Diagram Title Header -->
  <text x="35" y="34" class="header-main">BLOCKINGQUEUE CONCURRENCY LOCK TOPOLOGIES</text>
  <text x="35" y="52" class="header-sub">Lock Contention Analysis: ArrayBlockingQueue Single Lock vs. LinkedBlockingQueue Dual Lock Architecture</text>

  <!-- ========================================================================= -->
  <!-- TOP PANEL: ARRAYBLOCKINGQUEUE (SINGLE REENTRANTLOCK) -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 75)" filter="url(#shadow)">
    <rect width="890" height="190" rx="10" fill="var(--diag-panel-bg)" stroke="var(--diag-panel-border)" stroke-width="1.5" />
    
    <!-- Header -->
    <text x="20" y="28" class="panel-name">ArrayBlockingQueue: Single Shared ReentrantLock</text>
    <rect x="650" y="14" width="220" height="22" rx="4" fill="var(--diag-badge-warn-bg)" stroke="var(--diag-badge-warn-border)" stroke-width="1" />
    <text x="760" y="29" text-anchor="middle" class="badge-warn">PRODUCERS BLOCK CONSUMERS</text>

    <!-- Producer Threads Box -->
    <g transform="translate(30, 52)">
      <rect width="180" height="74" rx="7" fill="var(--diag-thread-bg)" stroke="var(--diag-thread-border)" stroke-width="1.2" />
      <text x="14" y="22" class="box-title">Producer Threads</text>
      <text x="14" y="40" class="box-sub">put(E) / offer(E, timeout)</text>
      <text x="14" y="58" class="box-sub" fill="#1b2d70">Waits on: <tspan font-family="monospace">notFull</tspan></text>
    </g>

    <!-- Contention Lock Box in Center -->
    <g transform="translate(325, 42)">
      <rect width="240" height="94" rx="8" fill="var(--diag-single-lock-bg)" stroke="var(--diag-single-lock-border)" stroke-width="1.8" />
      <text x="120" y="24" text-anchor="middle" class="box-title" fill="var(--diag-single-lock-text)" font-size="12.5px">Single ReentrantLock</text>
      <text x="120" y="42" text-anchor="middle" class="box-sub" fill="var(--diag-single-lock-text)">Mutual Exclusion (Puts vs. Takes)</text>
      <rect x="20" y="52" width="200" height="28" rx="4" fill="var(--diag-single-inner)" stroke="var(--diag-single-inner-border)" />
      <text x="120" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="var(--diag-single-lock-text)">
        Condition: notEmpty | notFull
      </text>
    </g>

    <!-- Consumer Threads Box -->
    <g transform="translate(680, 52)">
      <rect width="180" height="74" rx="7" fill="var(--diag-thread-bg)" stroke="var(--diag-thread-border)" stroke-width="1.2" />
      <text x="14" y="22" class="box-title">Consumer Threads</text>
      <text x="14" y="40" class="box-sub">take() / poll(timeout)</text>
      <text x="14" y="58" class="box-sub" fill="#1b2d70">Waits on: <tspan font-family="monospace">notEmpty</tspan></text>
    </g>

    <!-- Contention Arrows pointing to the same single lock -->
    <path d="M 210 89 L 325 89" stroke="#1b2d70" stroke-width="2" fill="none" marker-end="url(#arrowNavy)" />
    <path d="M 680 89 L 565 89" stroke="#1b2d70" stroke-width="2" fill="none" marker-end="url(#arrowNavy)" />

    <!-- Explanatory footer -->
    <text x="20" y="165" class="desc-text">
      <tspan fill="#111a4a" font-weight="600">Bottleneck:</tspan> Both producers and consumers must acquire the same lock. An ongoing take() holds the lock, stalling concurrent put() calls even when the array has abundant spare capacity.
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM PANEL: LINKEDBLOCKINGQUEUE (TWO INDEPENDENT LOCKS) -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 285)" filter="url(#shadow)">
    <rect width="890" height="210" rx="10" fill="var(--diag-panel-bg)" stroke="var(--diag-panel-border)" stroke-width="1.5" />
    
    <!-- Header -->
    <text x="20" y="28" class="panel-name">LinkedBlockingQueue: Two Independent Locks (High Throughput)</text>
    <rect x="650" y="14" width="220" height="22" rx="4" fill="var(--diag-badge-pass-bg)" stroke="var(--diag-badge-pass-border)" stroke-width="1" />
    <text x="760" y="29" text-anchor="middle" class="badge-pass">ZERO CONTENTION (PUT || TAKE)</text>

    <!-- Producer Side -->
    <g transform="translate(30, 50)">
      <rect width="160" height="68" rx="6" fill="var(--diag-thread-bg)" stroke="var(--diag-thread-border)" />
      <text x="12" y="22" class="box-title">Producer Threads</text>
      <text x="12" y="38" class="box-sub">put(E) / offer(E)</text>
      <text x="12" y="54" class="box-sub" fill="#167e6c">Signal: notEmpty</text>
    </g>

    <!-- Dedicated putLock -->
    <path d="M 190 84 L 225 84" stroke="#167e6c" stroke-width="2" fill="none" marker-end="url(#arrowGreen)" />
    <g transform="translate(225, 46)">
      <rect width="165" height="76" rx="7" fill="var(--diag-dual-lock-bg)" stroke="var(--diag-dual-lock-border)" stroke-width="1.5" />
      <text x="82" y="24" text-anchor="middle" class="box-title" fill="var(--diag-dual-lock-text)">putLock</text>
      <text x="82" y="42" text-anchor="middle" class="box-sub" fill="var(--diag-dual-lock-text)">Protects: tail node (last)</text>
      <rect x="15" y="48" width="135" height="20" rx="3" fill="var(--diag-dual-inner)" stroke="var(--diag-dual-inner-border)" />
      <text x="82" y="62" text-anchor="middle" font-family="monospace" font-size="9" fill="#167e6c" font-weight="600">Condition: notFull</text>
    </g>

    <!-- Center Queue & Atomic Counter -->
    <g transform="translate(420, 46)">
      <rect width="120" height="76" rx="6" fill="var(--diag-atomic-bg)" stroke="var(--diag-atomic-border)" stroke-width="1.2" />
      <text x="60" y="22" text-anchor="middle" class="box-title" font-size="10.5px">AtomicInteger</text>
      <text x="60" y="38" text-anchor="middle" class="box-title" fill="var(--diag-atomic-text)" font-size="13px">count</text>
      <text x="60" y="56" text-anchor="middle" class="box-sub" font-size="9.5px">Bridges Lock</text>
      <text x="60" y="68" text-anchor="middle" class="box-sub" font-size="9.5px">Signaling</text>
    </g>

    <!-- Dedicated takeLock -->
    <g transform="translate(570, 46)">
      <rect width="165" height="76" rx="7" fill="var(--diag-dual-lock-bg)" stroke="var(--diag-dual-lock-border)" stroke-width="1.5" />
      <text x="82" y="24" text-anchor="middle" class="box-title" fill="var(--diag-dual-lock-text)">takeLock</text>
      <text x="82" y="42" text-anchor="middle" class="box-sub" fill="var(--diag-dual-lock-text)">Protects: head node (first)</text>
      <rect x="15" y="48" width="135" height="20" rx="3" fill="var(--diag-dual-inner)" stroke="var(--diag-dual-inner-border)" />
      <text x="82" y="62" text-anchor="middle" font-family="monospace" font-size="9" fill="#167e6c" font-weight="600">Condition: notEmpty</text>
    </g>
    <path d="M 735 84 L 770 84" stroke="#167e6c" stroke-width="2" fill="none" marker-end="url(#arrowGreen)" />

    <!-- Consumer Side -->
    <g transform="translate(770, 50)">
      <rect width="160" height="68" rx="6" fill="var(--diag-thread-bg)" stroke="var(--diag-thread-border)" />
      <text x="12" y="22" class="box-title">Consumer Threads</text>
      <text x="12" y="38" class="box-sub">take() / poll()</text>
      <text x="12" y="54" class="box-sub" fill="#167e6c">Signal: notFull</text>
    </g>

    <!-- Arrows linking locks to atomic counter -->
    <path d="M 390 84 L 420 84" stroke="#3e5199" stroke-dasharray="3,3" stroke-width="1.2" fill="none" />
    <path d="M 570 84 L 540 84" stroke="#3e5199" stroke-dasharray="3,3" stroke-width="1.2" fill="none" />

    <!-- Explanatory footer -->
    <text x="20" y="165" class="desc-text">
      <tspan fill="#167e6c" font-weight="600">Dual-Lock Invariant:</tspan> Producers manipulate <tspan font-family="monospace">last.next</tspan> under <tspan font-family="monospace">putLock</tspan>, while consumers decouple <tspan font-family="monospace">head.next</tspan> under <tspan font-family="monospace">takeLock</tspan>.
    </text>
    <text x="20" y="185" class="desc-text">
      Both streams operate concurrently with zero contention unless the queue hits total saturation (full) or complete starvation (empty).
    </text>
  </g>
</svg>