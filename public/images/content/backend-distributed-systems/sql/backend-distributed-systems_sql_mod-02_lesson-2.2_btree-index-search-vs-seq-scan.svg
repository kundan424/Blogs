<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#167e6c" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3e5199" />
    </marker>
  </defs>

  <style>
    /* Default: Light Mode */
    :root {
      --diag-canvas: #ffffff;
      --diag-header-tag: #111a4a;
      --diag-header-title: #111a4a;
      --diag-header-sub: #1b2d70;

      --diag-seq-card-bg: #f8fafc;
      --diag-seq-card-border: #3e5199;
      --diag-seq-badge-bg: #1b2d70;
      --diag-seq-badge-text: #ffffff;
      --diag-seq-title: #111a4a;
      --diag-seq-meta: #1b2d70;
      --diag-seq-query-bg: #ffffff;
      --diag-seq-query-border: #3e5199;
      --diag-seq-box-bg: #ffffff;
      --diag-seq-box-border: #3e5199;
      --diag-seq-box-text: #111a4a;
      --diag-seq-box-sub: #3e5199;
      --diag-seq-hit-bg: #e8f5f1;
      --diag-seq-hit-border: #167e6c;
      --diag-seq-hit-text: #167e6c;
      --diag-seq-arrow: #3e5199;
      --diag-seq-explain-bg: #ffffff;
      --diag-seq-explain-border: #3e5199;
      --diag-seq-explain-text: #1b2d70;

      --diag-btree-card-bg: #f8fafc;
      --diag-btree-card-border: #1b2d70;
      --diag-btree-badge-bg: #111a4a;
      --diag-btree-badge-text: #ffffff;
      --diag-btree-title: #111a4a;
      --diag-btree-node-bg: #ffffff;
      --diag-btree-node-border: #3e5199;
      --diag-btree-node-text: #1b2d70;
      --diag-btree-node-sub: #3e5199;
      --diag-btree-hi-bg: #e8f5f1;
      --diag-btree-hi-border: #167e6c;
      --diag-btree-hi-text: #167e6c;
      --diag-btree-link: #3e5199;
      --diag-btree-link-active: #167e6c;
      --diag-btree-heap-bg: #e8f5f1;
      --diag-btree-heap-border: #167e6c;
      --diag-btree-heap-title: #167e6c;
      --diag-btree-heap-sub: #111a4a;
      --diag-btree-explain-bg: #ffffff;
      --diag-btree-explain-border: #167e6c;
      --diag-btree-explain-text: #167e6c;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #12161e;
      --diag-header-tag: #3e5199;
      --diag-header-title: #ffffff;
      --diag-header-sub: #5568ad;

      --diag-seq-card-bg: #111a4a15;
      --diag-seq-card-border: #3e5199;
      --diag-seq-badge-bg: #1b2d70;
      --diag-seq-badge-text: #ffffff;
      --diag-seq-title: #ffffff;
      --diag-seq-meta: #5568ad;
      --diag-seq-query-bg: #0c1017;
      --diag-seq-query-border: #3e5199;
      --diag-seq-box-bg: #0c1017;
      --diag-seq-box-border: #3e5199;
      --diag-seq-box-text: #ffffff;
      --diag-seq-box-sub: #5568ad;
      --diag-seq-hit-bg: #167e6c22;
      --diag-seq-hit-border: #167e6c;
      --diag-seq-hit-text: #167e6c;
      --diag-seq-arrow: #3e5199;
      --diag-seq-explain-bg: #0c1017;
      --diag-seq-explain-border: #3e5199;
      --diag-seq-explain-text: #5568ad;

      --diag-btree-card-bg: #111a4a15;
      --diag-btree-card-border: #1b2d70;
      --diag-btree-badge-bg: #111a4a;
      --diag-btree-badge-text: #ffffff;
      --diag-btree-title: #ffffff;
      --diag-btree-node-bg: #0c1017;
      --diag-btree-node-border: #3e5199;
      --diag-btree-node-text: #ffffff;
      --diag-btree-node-sub: #5568ad;
      --diag-btree-hi-bg: #167e6c22;
      --diag-btree-hi-border: #167e6c;
      --diag-btree-hi-text: #167e6c;
      --diag-btree-link: #3e5199;
      --diag-btree-link-active: #167e6c;
      --diag-btree-heap-bg: #167e6c22;
      --diag-btree-heap-border: #167e6c;
      --diag-btree-heap-title: #167e6c;
      --diag-btree-heap-sub: #ffffff;
      --diag-btree-explain-bg: #0c1017;
      --diag-btree-explain-border: #167e6c;
      --diag-btree-explain-text: #167e6c;
    }

    /* Standalone SVG File Viewing */
    @media (prefers-color-scheme: dark) {
      :root:not(html) {
        --diag-canvas: #12161e;
        --diag-header-tag: #3e5199;
        --diag-header-title: #ffffff;
        --diag-header-sub: #5568ad;

        --diag-seq-card-bg: #111a4a15;
        --diag-seq-card-border: #3e5199;
        --diag-seq-badge-bg: #1b2d70;
        --diag-seq-badge-text: #ffffff;
        --diag-seq-title: #ffffff;
        --diag-seq-meta: #5568ad;
        --diag-seq-query-bg: #0c1017;
        --diag-seq-query-border: #3e5199;
        --diag-seq-box-bg: #0c1017;
        --diag-seq-box-border: #3e5199;
        --diag-seq-box-text: #ffffff;
        --diag-seq-box-sub: #5568ad;
        --diag-seq-hit-bg: #167e6c22;
        --diag-seq-hit-border: #167e6c;
        --diag-seq-hit-text: #167e6c;
        --diag-seq-arrow: #3e5199;
        --diag-seq-explain-bg: #0c1017;
        --diag-seq-explain-border: #3e5199;
        --diag-seq-explain-text: #5568ad;

        --diag-btree-card-bg: #111a4a15;
        --diag-btree-card-border: #1b2d70;
        --diag-btree-badge-bg: #111a4a;
        --diag-btree-badge-text: #ffffff;
        --diag-btree-title: #ffffff;
        --diag-btree-node-bg: #0c1017;
        --diag-btree-node-border: #3e5199;
        --diag-btree-node-text: #ffffff;
        --diag-btree-node-sub: #5568ad;
        --diag-btree-hi-bg: #167e6c22;
        --diag-btree-hi-border: #167e6c;
        --diag-btree-hi-text: #167e6c;
        --diag-btree-link: #3e5199;
        --diag-btree-link-active: #167e6c;
        --diag-btree-heap-bg: #167e6c22;
        --diag-btree-heap-border: #167e6c;
        --diag-btree-heap-title: #167e6c;
        --diag-btree-heap-sub: #ffffff;
        --diag-btree-explain-bg: #0c1017;
        --diag-btree-explain-border: #167e6c;
        --diag-btree-explain-text: #167e6c;
      }
    }

    .header-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: var(--diag-header-tag); letter-spacing: 1.5px; text-transform: uppercase; }
    .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: var(--diag-header-sub); }
    .card-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; font-weight: 700; fill: var(--diag-seq-title); }
    .card-meta { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: var(--diag-seq-meta); }
    .node-box { fill: var(--diag-btree-node-bg); stroke: var(--diag-btree-node-border); stroke-width: 1.2; rx: 5; }
    .node-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; fill: var(--diag-btree-node-text); text-anchor: middle; }
    .node-highlight { fill: var(--diag-btree-hi-bg); stroke: var(--diag-btree-hi-border); stroke-width: 1.5; rx: 5; }
    .node-text-hi { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: var(--diag-btree-hi-text); text-anchor: middle; }
    .seq-box { fill: var(--diag-seq-box-bg); stroke: var(--diag-seq-box-border); stroke-width: 1; rx: 4; }
    .tree-link { stroke: var(--diag-btree-link); stroke-width: 1.2; stroke-dasharray: 2 2; }
    .tree-link-active { stroke: var(--diag-btree-link-active); stroke-width: 2.2; }
  </style>

  <!-- Background Base Canvas (Pure White in Light mode, Dark Slate in Dark mode) -->
  <rect width="960" height="480" fill="var(--diag-canvas)" />

  <!-- Diagram Title Header -->
  <text x="35" y="32" class="header-tag">DATABASE ACCESS PATHS &amp; INDEX INTERNALS</text>
  <text x="35" y="48" class="header-sub">O(N) Sequential Heap Scan vs. O(log N) B-Tree Traversal &amp; Covering Index Resolution</text>

  <!-- ========================================================================= -->
  <!-- LEFT: SEQUENTIAL SCAN (HEAP SCAN) -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 75)" filter="url(#shadow)">
    <rect width="360" height="375" rx="8" fill="var(--diag-seq-card-bg)" stroke="var(--diag-seq-card-border)" stroke-width="1.5" />

    <!-- Badge -->
    <rect x="20" y="16" width="130" height="24" rx="4" fill="var(--diag-seq-badge-bg)" stroke="#1b2d70" stroke-width="1" />
    <text x="85" y="32" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="var(--diag-seq-badge-text)">SEQUENTIAL SCAN</text>
    <text x="20" y="65" class="card-title">Full Table Disk Read</text>
    <text x="20" y="82" class="card-meta">Exhaustive Heap Inspection: Complexity O(N)</text>

    <!-- Query -->
    <g transform="translate(20, 100)">
      <rect width="320" height="44" rx="5" fill="var(--diag-seq-query-bg)" stroke="var(--diag-seq-query-border)" />
      <text x="12" y="20" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#111a4a">SELECT * FROM orders</text>
      <text x="12" y="36" font-family="ui-monospace, monospace" font-size="11" fill="var(--diag-seq-meta)">WHERE customer_id = 8842;</text>
    </g>

    <!-- Sequential Page Flow -->
    <g transform="translate(20, 160)">
      <text x="0" y="15" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#111a4a">Reading All 8KB Disk Pages:</text>
      
      <!-- Page Blocks -->
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="70" height="50" class="seq-box" />
        <text x="35" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="var(--diag-seq-box-text)">Page 1</text>
        <text x="35" y="40" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="var(--diag-seq-box-sub)">Check...</text>

        <rect x="80" y="0" width="70" height="50" class="seq-box" />
        <text x="115" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="var(--diag-seq-box-text)">Page 2</text>
        <text x="115" y="40" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="var(--diag-seq-box-sub)">Check...</text>

        <rect x="160" y="0" width="70" height="50" class="seq-box" />
        <text x="195" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="var(--diag-seq-box-text)">Page ...</text>
        <text x="195" y="40" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="var(--diag-seq-box-sub)">Check...</text>

        <rect x="240" y="0" width="80" height="50" fill="var(--diag-seq-hit-bg)" stroke="var(--diag-seq-hit-border)" stroke-width="1.5" rx="4" />
        <text x="280" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="var(--diag-seq-hit-text)">Page 12,500</text>
        <text x="280" y="40" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="var(--diag-seq-hit-text)">Hit Target!</text>
      </g>

      <!-- Scan Arrow -->
      <path d="M 0 95 L 310 95" stroke="var(--diag-seq-arrow)" stroke-width="2" marker-end="url(#arrowBlue)" />
      <text x="155" y="115" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#1b2d70">12,500 Pages Read from Disk (~100 MB I/O)</text>
    </g>

    <g transform="translate(20, 315)">
      <rect width="320" height="42" rx="4" fill="var(--diag-seq-explain-bg)" stroke="var(--diag-seq-explain-border)" />
      <text x="10" y="18" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#111a4a">EXPLAIN ANALYZE Cost:</text>
      <text x="10" y="32" font-family="ui-monospace, monospace" font-size="10.5" fill="var(--diag-seq-meta)">Seq Scan on orders (cost=0.00..18452.00)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: B-TREE INDEX SCAN -->
  <!-- ========================================================================= -->
  <g transform="translate(420, 75)" filter="url(#shadow)">
    <rect width="505" height="375" rx="8" fill="var(--diag-btree-card-bg)" stroke="var(--diag-btree-card-border)" stroke-width="1.5" />

    <!-- Badge -->
    <rect x="20" y="16" width="140" height="24" rx="4" fill="var(--diag-btree-badge-bg)" stroke="#111a4a" stroke-width="1" />
    <text x="90" y="32" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="var(--diag-btree-badge-text)">B-TREE INDEX SCAN</text>
    <text x="175" y="32" class="card-title">Balanced Tree Search (log N)</text>

    <!-- B-Tree Hierarchy Tree -->
    <!-- Level 0: Root Page -->
    <g transform="translate(170, 60)">
      <rect x="0" y="0" width="160" height="34" class="node-box" />
      <text x="80" y="21" class="node-text">Root [1000 | 5000 | 9000]</text>
    </g>

    <!-- Connectors Level 0 -> Level 1 -->
    <line x1="210" y1="94" x2="130" y2="125" class="tree-link" />
    <line x1="250" y1="94" x2="250" y2="125" class="tree-link-active" />
    <line x1="290" y1="94" x2="370" y2="125" class="tree-link" />

    <!-- Level 1: Internal Branches -->
    <g transform="translate(35, 125)">
      <rect x="0" y="0" width="115" height="30" class="node-box" />
      <text x="57" y="19" class="node-text">Branch [1..999]</text>

      <!-- Active branch traversed -->
      <rect x="150" y="0" width="130" height="30" class="node-highlight" />
      <text x="215" y="19" class="node-text-hi">Branch [5000..8999]</text>

      <rect x="315" y="0" width="120" height="30" class="node-box" />
      <text x="375" y="19" class="node-text">Branch [9000+]</text>
    </g>

    <!-- Connectors Level 1 -> Level 2 -->
    <line x1="225" y1="155" x2="110" y2="185" class="tree-link" />
    <line x1="250" y1="155" x2="250" y2="185" class="tree-link-active" />
    <line x1="275" y1="155" x2="390" y2="185" class="tree-link" />

    <!-- Level 2: Leaf Pages (Sorted Keys + Tuple Pointers) -->
    <g transform="translate(20, 185)">
      <rect x="0" y="0" width="135" height="38" class="node-box" />
      <text x="67" y="18" class="node-text" font-size="9.5">Leaf [5000..5999]</text>
      <text x="67" y="30" font-family="-apple-system, sans-serif" font-size="9" fill="var(--diag-btree-node-sub)">Pointers: ctid (12, 1)</text>

      <!-- Active Leaf Block -->
      <rect x="155" y="0" width="155" height="38" class="node-highlight" />
      <text x="232" y="18" class="node-text-hi" font-size="10">Target Leaf: [8842]</text>
      <text x="232" y="31" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="var(--diag-btree-hi-text)" text-anchor="middle">Pointer: ctid (12500, 4)</text>

      <rect x="330" y="0" width="135" height="38" class="node-box" />
      <text x="397" y="18" class="node-text" font-size="9.5">Leaf [8843..8999]</text>
      <text x="397" y="30" font-family="-apple-system, sans-serif" font-size="9" fill="var(--diag-btree-node-sub)">Pointers: ctid (14, 2)</text>
    </g>

    <!-- Direct Leap to Heap Block -->
    <g transform="translate(20, 245)">
      <path d="M 232 -10 L 232 25" stroke="var(--diag-btree-link-active)" stroke-width="2.2" marker-end="url(#arrowGreen)" />
      
      <rect x="90" y="25" width="285" height="48" rx="6" fill="var(--diag-btree-heap-bg)" stroke="var(--diag-btree-heap-border)" stroke-width="1.5" />
      <text x="232" y="44" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="var(--diag-btree-heap-title)">Table Heap Page #12,500 (Row #4)</text>
      <text x="232" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="var(--diag-btree-heap-sub)">Direct random read: only 1 heap block retrieved!</text>
    </g>

    <!-- Bottom Metric -->
    <g transform="translate(20, 315)">
      <rect width="465" height="42" rx="4" fill="var(--diag-btree-explain-bg)" stroke="var(--diag-btree-explain-border)" />
      <text x="15" y="18" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="var(--diag-btree-explain-text)">EXPLAIN ANALYZE Performance:</text>
      <text x="15" y="32" font-family="ui-monospace, monospace" font-size="10.5" fill="var(--diag-header-sub)">Index Scan using idx_customer_id (cost=0.42..8.44) | Time: 0.18ms</text>
    </g>
  </g>
</svg>