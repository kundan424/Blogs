<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    /* Default: Light Mode (Clean White Canvas) */
    :root {
      --diag-canvas: #ffffff;
      --diag-header-tag: #111a4a;
      --diag-header-sub: #1b2d70;
      --diag-card-bg: #f8fafc;
      --diag-card-border: #3e5199;
      --diag-table-hdr-bg: #eef2ff;
      --diag-table-hdr-text: #111a4a;
      --diag-row-text: #111a4a;
      --diag-row-highlight: #3e5199;
      --diag-row-null: #1b2d70;
      --diag-status-matched: #167e6c;
      --diag-meta-sub: #1b2d70;

      --diag-inner-card-border: #111a4a;
      --diag-inner-badge-bg: #111a4a;
      --diag-inner-badge-text: #ffffff;

      --diag-left-card-border: #167e6c;
      --diag-left-badge-bg: #167e6c;
      --diag-left-badge-text: #ffffff;

      --diag-right-card-border: #3e5199;
      --diag-right-badge-bg: #3e5199;
      --diag-right-badge-text: #ffffff;

      --diag-full-card-border: #1b2d70;
      --diag-full-badge-bg: #1b2d70;
      --diag-full-badge-text: #ffffff;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #12161e;
      --diag-header-tag: #3e5199;
      --diag-header-sub: #5568ad;
      --diag-card-bg: #111a4a15;
      --diag-card-border: #3e5199;
      --diag-table-hdr-bg: #0c1017;
      --diag-table-hdr-text: #5568ad;
      --diag-row-text: #cbd5e1;
      --diag-row-highlight: #3e5199;
      --diag-row-null: #5568ad;
      --diag-status-matched: #167e6c;
      --diag-meta-sub: #cbd5e1;

      --diag-inner-card-border: #111a4a;
      --diag-inner-badge-bg: #111a4a;
      --diag-inner-badge-text: #ffffff;

      --diag-left-card-border: #167e6c;
      --diag-left-badge-bg: #167e6c;
      --diag-left-badge-text: #ffffff;

      --diag-right-card-border: #3e5199;
      --diag-right-badge-bg: #3e5199;
      --diag-right-badge-text: #ffffff;

      --diag-full-card-border: #1b2d70;
      --diag-full-badge-bg: #1b2d70;
      --diag-full-badge-text: #ffffff;
    }

    /* Standalone SVG Viewer */
    @media (prefers-color-scheme: dark) {
      :root:not(html) {
        --diag-canvas: #12161e;
        --diag-header-tag: #3e5199;
        --diag-header-sub: #5568ad;
        --diag-card-bg: #111a4a15;
        --diag-card-border: #3e5199;
        --diag-table-hdr-bg: #0c1017;
        --diag-table-hdr-text: #5568ad;
        --diag-row-text: #cbd5e1;
        --diag-row-highlight: #3e5199;
        --diag-row-null: #5568ad;
        --diag-status-matched: #167e6c;
        --diag-meta-sub: #cbd5e1;

        --diag-inner-card-border: #111a4a;
        --diag-inner-badge-bg: #111a4a;
        --diag-inner-badge-text: #ffffff;

        --diag-left-card-border: #167e6c;
        --diag-left-badge-bg: #167e6c;
        --diag-left-badge-text: #ffffff;

        --diag-right-card-border: #3e5199;
        --diag-right-badge-bg: #3e5199;
        --diag-right-badge-text: #ffffff;

        --diag-full-card-border: #1b2d70;
        --diag-full-badge-bg: #1b2d70;
        --diag-full-badge-text: #ffffff;
      }
    }

    .header-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: var(--diag-header-tag); letter-spacing: 1.5px; text-transform: uppercase; }
    .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: var(--diag-header-sub); }
    .card-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; font-weight: 700; fill: var(--diag-row-text); }
    .table-head { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: var(--diag-table-hdr-text); }
    .row-data { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--diag-row-text); }
    .row-null { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: var(--diag-row-null); }
    .meta-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: var(--diag-meta-sub); }
  </style>

  <!-- Background Base Canvas -->
  <rect width="960" height="520" fill="var(--diag-canvas)" />

  <!-- Diagram Title Header -->
  <text x="35" y="32" class="header-tag">SQL RELATIONAL JOINS TAXONOMY</text>
  <text x="35" y="48" class="header-sub">Predicate-Matched Set Intersection &amp; Outer Join Semantics Across Relational Tuples</text>

  <!-- ========================================================================= -->
  <!-- CARD 1: INNER JOIN -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 75)" filter="url(#shadow)">
    <rect width="430" height="200" rx="8" fill="var(--diag-card-bg)" stroke="var(--diag-inner-card-border)" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <rect x="15" y="14" width="115" height="22" rx="4" fill="var(--diag-inner-badge-bg)" stroke="var(--diag-inner-card-border)" stroke-width="1" />
    <text x="72" y="29" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="var(--diag-inner-badge-text)">INNER JOIN</text>
    <text x="140" y="29" class="card-title">Intersection Only</text>

    <!-- Mini Venn diagram -->
    <g transform="translate(330, 25)">
      <circle cx="25" cy="20" r="18" fill="none" stroke="#1b2d70" stroke-width="1.5" />
      <circle cx="45" cy="20" r="18" fill="none" stroke="#1b2d70" stroke-width="1.5" />
      <path d="M 35 7 A 18 18 0 0 1 35 33 A 18 18 0 0 1 35 7" fill="#167e6c" />
    </g>

    <!-- Table Header -->
    <g transform="translate(15, 55)">
      <rect width="400" height="22" rx="3" fill="var(--diag-table-hdr-bg)" />
      <text x="10" y="15" class="table-head">c.id</text>
      <text x="50" y="15" class="table-head">c.name</text>
      <text x="160" y="15" class="table-head">o.id</text>
      <text x="230" y="15" class="table-head">o.total</text>
      <text x="310" y="15" class="table-head">Match Status</text>
    </g>

    <!-- Rows -->
    <g transform="translate(15, 85)">
      <text x="10" y="15" class="row-data">1</text>
      <text x="50" y="15" class="row-data" fill="var(--diag-row-highlight)">Alice</text>
      <text x="160" y="15" class="row-data">101</text>
      <text x="230" y="15" class="row-data">$250.00</text>
      <text x="310" y="15" class="row-data" fill="var(--diag-status-matched)">✓ Exact Key</text>

      <text x="10" y="38" class="row-data">1</text>
      <text x="50" y="38" class="row-data" fill="var(--diag-row-highlight)">Alice</text>
      <text x="160" y="38" class="row-data">102</text>
      <text x="230" y="38" class="row-data">$40.00</text>
      <text x="310" y="38" class="row-data" fill="var(--diag-status-matched)">✓ Exact Key</text>

      <text x="10" y="61" class="row-data">2</text>
      <text x="50" y="61" class="row-data" fill="var(--diag-row-highlight)">Bob</text>
      <text x="160" y="61" class="row-data">103</text>
      <text x="230" y="61" class="row-data">$180.00</text>
      <text x="310" y="61" class="row-data" fill="var(--diag-status-matched)">✓ Exact Key</text>
    </g>

    <text x="20" y="185" class="meta-sub">Excludes Charlie (0 orders) and Order #104 (unmatched customer_id).</text>
  </g>

  <!-- ========================================================================= -->
  <!-- CARD 2: LEFT (OUTER) JOIN -->
  <!-- ========================================================================= -->
  <g transform="translate(495, 75)" filter="url(#shadow)">
    <rect width="430" height="200" rx="8" fill="var(--diag-card-bg)" stroke="var(--diag-left-card-border)" stroke-width="1.5" />

    <!-- Title Bar -->
    <rect x="15" y="14" width="115" height="22" rx="4" fill="var(--diag-left-badge-bg)" stroke="var(--diag-left-card-border)" stroke-width="1" />
    <text x="72" y="29" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="var(--diag-left-badge-text)">LEFT JOIN</text>
    <text x="140" y="29" class="card-title">All Left + Matched Right</text>

    <!-- Mini Venn diagram -->
    <g transform="translate(330, 25)">
      <circle cx="25" cy="20" r="18" fill="#167e6c33" stroke="#167e6c" stroke-width="1.5" />
      <circle cx="45" cy="20" r="18" fill="none" stroke="#1b2d70" stroke-width="1.5" />
    </g>

    <!-- Table Header -->
    <g transform="translate(15, 55)">
      <rect width="400" height="22" rx="3" fill="var(--diag-table-hdr-bg)" />
      <text x="10" y="15" class="table-head">c.id</text>
      <text x="50" y="15" class="table-head">c.name</text>
      <text x="160" y="15" class="table-head">o.id</text>
      <text x="230" y="15" class="table-head">o.total</text>
      <text x="310" y="15" class="table-head">Match Status</text>
    </g>

    <!-- Rows -->
    <g transform="translate(15, 85)">
      <text x="10" y="15" class="row-data">1</text>
      <text x="50" y="15" class="row-data" fill="var(--diag-row-highlight)">Alice</text>
      <text x="160" y="15" class="row-data">101, 102</text>
      <text x="230" y="15" class="row-data">$250, $40</text>
      <text x="310" y="15" class="row-data" fill="var(--diag-status-matched)">✓ Matched</text>

      <text x="10" y="38" class="row-data">2</text>
      <text x="50" y="38" class="row-data" fill="var(--diag-row-highlight)">Bob</text>
      <text x="160" y="38" class="row-data">103</text>
      <text x="230" y="38" class="row-data">$180.00</text>
      <text x="310" y="38" class="row-data" fill="var(--diag-status-matched)">✓ Matched</text>

      <text x="10" y="61" class="row-data">3</text>
      <text x="50" y="61" class="row-data" fill="var(--diag-row-highlight)">Charlie</text>
      <text x="160" y="61" class="row-null">NULL</text>
      <text x="230" y="61" class="row-null">NULL</text>
      <text x="310" y="61" class="row-null">⚠ Zero Orders</text>
    </g>

    <text x="20" y="185" class="meta-sub">Preserves Charlie! Indispensable for "Find all customers and their orders".</text>
  </g>

  <!-- ========================================================================= -->
  <!-- CARD 3: RIGHT (OUTER) JOIN -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 295)" filter="url(#shadow)">
    <rect width="430" height="200" rx="8" fill="var(--diag-card-bg)" stroke="var(--diag-right-card-border)" stroke-width="1.5" />

    <!-- Title Bar -->
    <rect x="15" y="14" width="115" height="22" rx="4" fill="var(--diag-right-badge-bg)" stroke="var(--diag-right-card-border)" stroke-width="1" />
    <text x="72" y="29" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="var(--diag-right-badge-text)">RIGHT JOIN</text>
    <text x="140" y="29" class="card-title">All Right + Matched Left</text>

    <!-- Mini Venn diagram -->
    <g transform="translate(330, 25)">
      <circle cx="25" cy="20" r="18" fill="none" stroke="#1b2d70" stroke-width="1.5" />
      <circle cx="45" cy="20" r="18" fill="#3e519933" stroke="#3e5199" stroke-width="1.5" />
    </g>

    <!-- Table Header -->
    <g transform="translate(15, 55)">
      <rect width="400" height="22" rx="3" fill="var(--diag-table-hdr-bg)" />
      <text x="10" y="15" class="table-head">c.id</text>
      <text x="50" y="15" class="table-head">c.name</text>
      <text x="160" y="15" class="table-head">o.id</text>
      <text x="230" y="15" class="table-head">o.total</text>
      <text x="310" y="15" class="table-head">Match Status</text>
    </g>

    <!-- Rows -->
    <g transform="translate(15, 85)">
      <text x="10" y="15" class="row-data">1</text>
      <text x="50" y="15" class="row-data">Alice</text>
      <text x="160" y="15" class="row-data">101, 102</text>
      <text x="230" y="15" class="row-data">$250, $40</text>
      <text x="310" y="15" class="row-data" fill="var(--diag-status-matched)">✓ Matched</text>

      <text x="10" y="38" class="row-data">2</text>
      <text x="50" y="38" class="row-data">Bob</text>
      <text x="160" y="38" class="row-data">103</text>
      <text x="230" y="38" class="row-data">$180.00</text>
      <text x="310" y="38" class="row-data" fill="var(--diag-status-matched)">✓ Matched</text>

      <text x="10" y="61" class="row-null">NULL</text>
      <text x="50" y="61" class="row-null">NULL</text>
      <text x="160" y="61" class="row-data">104</text>
      <text x="230" y="61" class="row-data">$75.00</text>
      <text x="310" y="61" class="row-null">⚠ Orphan Order</text>
    </g>

    <text x="20" y="185" class="meta-sub">Preserves Order #104. Symmetrical to LEFT JOIN; rarely used in clean DDL schemas.</text>
  </g>

  <!-- ========================================================================= -->
  <!-- CARD 4: FULL (OUTER) JOIN -->
  <!-- ========================================================================= -->
  <g transform="translate(495, 295)" filter="url(#shadow)">
    <rect width="430" height="200" rx="8" fill="var(--diag-card-bg)" stroke="var(--diag-full-card-border)" stroke-width="1.5" />

    <!-- Title Bar -->
    <rect x="15" y="14" width="115" height="22" rx="4" fill="var(--diag-full-badge-bg)" stroke="var(--diag-full-card-border)" stroke-width="1" />
    <text x="72" y="29" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="var(--diag-full-badge-text)">FULL JOIN</text>
    <text x="140" y="29" class="card-title">Union of All Rows</text>

    <!-- Mini Venn diagram -->
    <g transform="translate(330, 25)">
      <circle cx="25" cy="20" r="18" fill="#1b2d7022" stroke="#1b2d70" stroke-width="1.5" />
      <circle cx="45" cy="20" r="18" fill="#1b2d7022" stroke="#1b2d70" stroke-width="1.5" />
    </g>

    <!-- Table Header -->
    <g transform="translate(15, 55)">
      <rect width="400" height="22" rx="3" fill="var(--diag-table-hdr-bg)" />
      <text x="10" y="15" class="table-head">c.id</text>
      <text x="50" y="15" class="table-head">c.name</text>
      <text x="160" y="15" class="table-head">o.id</text>
      <text x="230" y="15" class="table-head">o.total</text>
      <text x="310" y="15" class="table-head">Match Status</text>
    </g>

    <!-- Rows -->
    <g transform="translate(15, 85)">
      <text x="10" y="15" class="row-data">1, 2</text>
      <text x="50" y="15" class="row-data">Alice, Bob</text>
      <text x="160" y="15" class="row-data">101, 102, 103</text>
      <text x="230" y="15" class="row-data">Matches</text>
      <text x="310" y="15" class="row-data" fill="var(--diag-status-matched)">✓ Full Matched</text>

      <text x="10" y="38" class="row-data">3</text>
      <text x="50" y="38" class="row-data">Charlie</text>
      <text x="160" y="38" class="row-null">NULL</text>
      <text x="230" y="38" class="row-null">NULL</text>
      <text x="310" y="38" class="row-null">⚠ Left Unmatched</text>

      <text x="10" y="61" class="row-null">NULL</text>
      <text x="50" y="61" class="row-null">NULL</text>
      <text x="160" y="61" class="row-data">104</text>
      <text x="230" y="61" class="row-data">$75.00</text>
      <text x="310" y="61" class="row-null">⚠ Right Unmatched</text>
    </g>

    <text x="20" y="185" class="meta-sub">Complete set union. Both missing left and missing right keys filled with NULLs.</text>
  </g>
</svg>