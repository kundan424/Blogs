<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%" height="100%">
  <style>
    /* Default: Light Mode */
    svg {
      --diag-canvas: #ffffff;
      --diag-stroke: #232730;
      --diag-title: #111a4a;
      --diag-label: #1b2d70;
      --diag-fill: #167e6c;
      --diag-fill-opacity: 0.35;
      --diag-fill-unselected: #ffffff;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #12161e;
      --diag-stroke: #4575cd;
      --diag-title: #5568ad;
      --diag-label: #4575cd;
      --diag-fill: #167e6c;
      --diag-fill-opacity: 0.6;
      --diag-fill-unselected: #12161e;
    }

    /* Standalone SVG Viewer */
    @media (prefers-color-scheme: dark) {
      svg:root {
        --diag-canvas: #12161e;
        --diag-stroke: #4575cd;
        --diag-title: #5568ad;
        --diag-label: #4575cd;
        --diag-fill: #167e6c;
        --diag-fill-opacity: 0.6;
        --diag-fill-unselected: #12161e;
      }
    }

    .join-title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 30px;
      font-weight: 700;
      fill: var(--diag-title);
      text-anchor: middle;
    }

    .table-label {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 24px;
      font-weight: 600;
      fill: var(--diag-label);
      text-anchor: middle;
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="700" height="350" fill="var(--diag-canvas)" />

  <!-- Top Title -->
  <text x="350" y="52" class="join-title">Left Join</text>

  <!-- Circle 2 (Table 2 - unselected base) -->
  <circle cx="425" cy="190" r="115" fill="var(--diag-fill-unselected)" stroke="none" />

  <!-- Circle 1 (Table 1 - filled including intersection) -->
  <circle cx="275" cy="190" r="115" fill="var(--diag-fill)" fill-opacity="var(--diag-fill-opacity)" stroke="var(--diag-stroke)" stroke-width="2.5" />

  <!-- Circle 2 Outline (Drawn over to show intersection arc) -->
  <circle cx="425" cy="190" r="115" fill="none" stroke="var(--diag-stroke)" stroke-width="2.5" />

  <!-- Labels -->
  <text x="215" y="198" class="table-label">table 1</text>
  <text x="485" y="198" class="table-label">table 2</text>
</svg>
