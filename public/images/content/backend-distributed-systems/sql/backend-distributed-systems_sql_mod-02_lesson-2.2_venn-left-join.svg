<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%" height="100%">
  <style>
    /* Default: Light Mode */
    svg {
      --diag-canvas: #ffffff;
      --diag-stroke: #18181b;
      --diag-text: #09090b;
      --diag-fill: #c5e8c7;
      --diag-fill-unselected: #ffffff;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #0c1017;
      --diag-stroke: #94a3b8;
      --diag-text: #f8fafc;
      --diag-fill: #065f46;
      --diag-fill-unselected: #0c1017;
    }

    /* Standalone SVG Viewer */
    @media (prefers-color-scheme: dark) {
      svg:root {
        --diag-canvas: #0c1017;
        --diag-stroke: #94a3b8;
        --diag-text: #f8fafc;
        --diag-fill: #065f46;
        --diag-fill-unselected: #0c1017;
      }
    }

    .join-title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 30px;
      font-weight: 700;
      fill: var(--diag-text);
      text-anchor: middle;
    }

    .table-label {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 24px;
      font-weight: 500;
      fill: var(--diag-text);
      text-anchor: middle;
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="700" height="350" fill="var(--diag-canvas)" />

  <!-- Top Title -->
  <text x="350" y="52" class="join-title">Left Join</text>

  <!-- Circle 2 (Table 2 - unselected base) -->
  <circle cx="425" cy="190" r="115" fill="var(--diag-fill-unselected)" stroke="none" />

  <!-- Circle 1 (Table 1 - filled including intersection) -->
  <circle cx="275" cy="190" r="115" fill="var(--diag-fill)" stroke="var(--diag-stroke)" stroke-width="2.5" />

  <!-- Circle 2 Outline (Drawn over to show the intersection curve) -->
  <circle cx="425" cy="190" r="115" fill="none" stroke="var(--diag-stroke)" stroke-width="2.5" />

  <!-- Labels -->
  <text x="215" y="198" class="table-label">table 1</text>
  <text x="485" y="198" class="table-label">table 2</text>
</svg>
