<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141210" />
      <stop offset="100%" stop-color="#0d0b09" />
    </linearGradient>
    <linearGradient id="vmCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241e1a" />
      <stop offset="100%" stop-color="#191512" />
    </linearGradient>
    <linearGradient id="containerCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192624" />
      <stop offset="100%" stop-color="#101918" />
    </linearGradient>
    <linearGradient id="appBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="guestOs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <linearGradient id="hypervisor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="dockerEngine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="kernelBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="infraBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; fill: #f3efe9; letter-spacing: 0.5px; }
    .header { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
    .text-sm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #d6d3d1; }
    .text-dim { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #a8a29e; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="960" height="460" rx="16" fill="url(#bgGrad)" stroke="#2e2823" stroke-width="1.5" />

  <!-- TOP HEADER -->
  <text x="480" y="36" text-anchor="middle" class="header" fill="#e07a5f">Hardware &amp; Kernel Isolation: Virtual Machines vs. Containers</text>

  <!-- ==================== LEFT: VIRTUAL MACHINES ==================== -->
  <g transform="translate(40, 55)">
    <!-- Container Box -->
    <rect width="420" height="375" rx="12" fill="url(#vmCard)" stroke="#443830" stroke-width="1" filter="url(#dropShadow)" />
    <text x="210" y="28" text-anchor="middle" class="title" fill="#f97316">TYPE 1 / 2 VIRTUAL MACHINES (HYPERVISOR)</text>
    <text x="210" y="44" text-anchor="middle" class="text-dim">Hardware Emulation + Full Guest OS Lifecycle Overhead</text>

    <!-- Apps Row -->
    <g transform="translate(20, 56)">
      <!-- VM 1 -->
      <g transform="translate(0, 0)">
        <rect width="115" height="48" rx="6" fill="url(#appBox)" stroke="#475569" stroke-width="1" />
        <text x="57" y="22" text-anchor="middle" class="title" fill="#38bdf8">App A</text>
        <text x="57" y="38" text-anchor="middle" class="text-dim">Bins / Libs A</text>
      </g>
      <!-- VM 2 -->
      <g transform="translate(132, 0)">
        <rect width="115" height="48" rx="6" fill="url(#appBox)" stroke="#475569" stroke-width="1" />
        <text x="57" y="22" text-anchor="middle" class="title" fill="#38bdf8">App B</text>
        <text x="57" y="38" text-anchor="middle" class="text-dim">Bins / Libs B</text>
      </g>
      <!-- VM 3 -->
      <g transform="translate(265, 0)">
        <rect width="115" height="48" rx="6" fill="url(#appBox)" stroke="#475569" stroke-width="1" />
        <text x="57" y="22" text-anchor="middle" class="title" fill="#38bdf8">App C</text>
        <text x="57" y="38" text-anchor="middle" class="text-dim">Bins / Libs C</text>
      </g>
    </g>

    <!-- Guest OS Row (Heavy Redundant Kernels) -->
    <g transform="translate(20, 112)">
      <g transform="translate(0, 0)">
        <rect width="115" height="46" rx="6" fill="url(#guestOs)" stroke="#ea580c" stroke-width="1" />
        <text x="57" y="20" text-anchor="middle" class="title" fill="#fed7aa">Guest OS</text>
        <text x="57" y="36" text-anchor="middle" class="text-dim">(Full Kernel + Init)</text>
      </g>
      <g transform="translate(132, 0)">
        <rect width="115" height="46" rx="6" fill="url(#guestOs)" stroke="#ea580c" stroke-width="1" />
        <text x="57" y="20" text-anchor="middle" class="title" fill="#fed7aa">Guest OS</text>
        <text x="57" y="36" text-anchor="middle" class="text-dim">(Full Kernel + Init)</text>
      </g>
      <g transform="translate(265, 0)">
        <rect width="115" height="46" rx="6" fill="url(#guestOs)" stroke="#ea580c" stroke-width="1" />
        <text x="57" y="20" text-anchor="middle" class="title" fill="#fed7aa">Guest OS</text>
        <text x="57" y="36" text-anchor="middle" class="text-dim">(Full Kernel + Init)</text>
      </g>
    </g>

    <!-- Hypervisor Layer -->
    <g transform="translate(20, 168)">
      <rect width="380" height="44" rx="6" fill="url(#hypervisor)" stroke="#8b5cf6" stroke-width="1" />
      <text x="190" y="20" text-anchor="middle" class="title" fill="#ddd6fe">HYPERVISOR (KVM / VMware ESXi / Xen / Hyper-V)</text>
      <text x="190" y="35" text-anchor="middle" class="text-dim">Hardware Emulation, Virtual CPU Scheduling, Memory Ballooning</text>
    </g>

    <!-- Host OS -->
    <g transform="translate(20, 222)">
      <rect width="380" height="42" rx="6" fill="url(#kernelBox)" stroke="#10b981" stroke-width="1" />
      <text x="190" y="20" text-anchor="middle" class="title" fill="#a7f3d0">HOST OPERATING SYSTEM (Linux / UNIX)</text>
      <text x="190" y="34" text-anchor="middle" class="text-dim">Host Kernel, Device Drivers, Virtual Switch</text>
    </g>

    <!-- Physical Hardware -->
    <g transform="translate(20, 274)">
      <rect width="380" height="42" rx="6" fill="url(#infraBox)" stroke="#57534e" stroke-width="1" />
      <text x="190" y="20" text-anchor="middle" class="title" fill="#e7e5e4">BARE METAL INFRASTRUCTURE</text>
      <text x="190" y="34" text-anchor="middle" class="text-dim">Physical CPU Cores, NUMA RAM, PCIe Bus, NIC, NVMe</text>
    </g>

    <!-- Footprint metrics -->
    <g transform="translate(20, 326)">
      <rect width="380" height="34" rx="6" fill="#1c1917" stroke="#443830" stroke-width="1" />
      <text x="190" y="21" text-anchor="middle" class="tag" fill="#f87171">STARTUP: ~30-120s  |  MEMORY: Gigabytes overhead  |  CPU: Hypercall trap</text>
    </g>
  </g>

  <!-- ==================== RIGHT: CONTAINERS ==================== -->
  <g transform="translate(500, 55)">
    <!-- Container Box -->
    <rect width="420" height="375" rx="12" fill="url(#containerCard)" stroke="#1e3a35" stroke-width="1" filter="url(#dropShadow)" />
    <text x="210" y="28" text-anchor="middle" class="title" fill="#38bdf8">LINUX CONTAINERS (DOCKER / RUNTIME)</text>
    <text x="210" y="44" text-anchor="middle" class="text-dim">Direct Process Isolation via Linux Namespaces &amp; cgroups</text>

    <!-- Apps Row -->
    <g transform="translate(20, 56)">
      <!-- Container 1 -->
      <g transform="translate(0, 0)">
        <rect width="115" height="65" rx="6" fill="url(#appBox)" stroke="#0284c7" stroke-width="1.5" />
        <text x="57" y="22" text-anchor="middle" class="title" fill="#38bdf8">Container 1</text>
        <text x="57" y="38" text-anchor="middle" class="text-sm">App A</text>
        <text x="57" y="52" text-anchor="middle" class="text-dim">Rootfs A (Libs)</text>
      </g>
      <!-- Container 2 -->
      <g transform="translate(132, 0)">
        <rect width="115" height="65" rx="6" fill="url(#appBox)" stroke="#0284c7" stroke-width="1.5" />
        <text x="57" y="22" text-anchor="middle" class="title" fill="#38bdf8">Container 2</text>
        <text x="57" y="38" text-anchor="middle" class="text-sm">App B</text>
        <text x="57" y="52" text-anchor="middle" class="text-dim">Rootfs B (Libs)</text>
      </g>
      <!-- Container 3 -->
      <g transform="translate(265, 0)">
        <rect width="115" height="65" rx="6" fill="url(#appBox)" stroke="#0284c7" stroke-width="1.5" />
        <text x="57" y="22" text-anchor="middle" class="title" fill="#38bdf8">Container 3</text>
        <text x="57" y="38" text-anchor="middle" class="text-sm">App C</text>
        <text x="57" y="52" text-anchor="middle" class="text-dim">Rootfs C (Libs)</text>
      </g>
    </g>

    <!-- Notice: NO Guest OS! Directly talks to Container Engine -->
    <!-- Docker Engine / Runtime Layer -->
    <g transform="translate(20, 131)">
      <rect width="380" height="52" rx="6" fill="url(#dockerEngine)" stroke="#38bdf8" stroke-width="1" />
      <text x="190" y="20" text-anchor="middle" class="title" fill="#e0f2fe">DOCKER ENGINE / OCI RUNTIME (dockerd, containerd, runc)</text>
      <text x="190" y="38" text-anchor="middle" class="text-dim">Configures clone() flags, cgroups limits, pivot_root, overlay2 mount</text>
    </g>

    <!-- Shared Host Linux Kernel -->
    <g transform="translate(20, 193)">
      <rect width="380" height="71" rx="6" fill="url(#kernelBox)" stroke="#34d399" stroke-width="1.5" />
      <text x="190" y="22" text-anchor="middle" class="title" fill="#a7f3d0">SHARED HOST LINUX KERNEL</text>
      <text x="190" y="42" text-anchor="middle" class="tag" fill="#6ee7b7">NAMESPACES (pid, net, mnt, ipc, uts, user)</text>
      <text x="190" y="58" text-anchor="middle" class="tag" fill="#6ee7b7">CONTROL GROUPS (cgroups v1/v2: cpu, memory, blkio, pids)</text>
    </g>

    <!-- Physical Hardware -->
    <g transform="translate(20, 274)">
      <rect width="380" height="42" rx="6" fill="url(#infraBox)" stroke="#57534e" stroke-width="1" />
      <text x="190" y="20" text-anchor="middle" class="title" fill="#e7e5e4">BARE METAL INFRASTRUCTURE</text>
      <text x="190" y="34" text-anchor="middle" class="text-dim">Physical CPU Cores, NUMA RAM, PCIe Bus, NIC, NVMe</text>
    </g>

    <!-- Footprint metrics -->
    <g transform="translate(20, 326)">
      <rect width="380" height="34" rx="6" fill="#101918" stroke="#1e3a35" stroke-width="1" />
      <text x="190" y="21" text-anchor="middle" class="tag" fill="#4ade80">STARTUP: &lt; 50ms  |  MEMORY: Megabytes (Zero OS Overhead)  |  CPU: Native speed</text>
    </g>
  </g>
</svg>
