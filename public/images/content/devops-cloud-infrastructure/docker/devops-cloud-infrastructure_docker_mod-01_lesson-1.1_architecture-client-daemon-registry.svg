<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3e5199" />
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#167e6c" />
    </marker>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1b2d70" />
    </marker>
  </defs>

  <style>
    /* Default: Light Mode (Clean White Canvas) */
    svg {
      --diag-canvas: #ffffff;
      --diag-header: #111a4a;
      --diag-card-bg: #f8fafc;
      --diag-card-sub: #ffffff;
      --diag-card-border: #cbd5e1;
      --diag-client-border: #3e5199;
      --diag-host-border: #167e6c;
      --diag-reg-border: #1b2d70;

      --diag-title-main: #111a4a;
      --diag-text-main: #1e293b;
      --diag-text-dim: #64748b;
      --diag-code: #1b2d70;

      --diag-daemon-bg: #111a4a;
      --diag-daemon-text: #ffffff;
      --diag-daemon-sub: #cbd5e1;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #12161e;
      --diag-header: #788cd4;
      --diag-card-bg: #171d2b;
      --diag-card-sub: #131b2a;
      --diag-card-border: #243049;
      --diag-client-border: #3e5199;
      --diag-host-border: #167e6c;
      --diag-reg-border: #1b2d70;

      --diag-title-main: #f8fafc;
      --diag-text-main: #cbd5e1;
      --diag-text-dim: #94a3b8;
      --diag-code: #788cd4;

      --diag-daemon-bg: #111a4a;
      --diag-daemon-text: #f8fafc;
      --diag-daemon-sub: #93a5e8;
    }

    /* Standalone SVG Viewer */
    @media (prefers-color-scheme: dark) {
      :root:not(html) {
        --diag-canvas: #12161e;
        --diag-header: #788cd4;
        --diag-card-bg: #171d2b;
        --diag-card-sub: #131b2a;
        --diag-card-border: #243049;
        --diag-client-border: #3e5199;
        --diag-host-border: #167e6c;
        --diag-reg-border: #1b2d70;

        --diag-title-main: #f8fafc;
        --diag-text-main: #cbd5e1;
        --diag-text-dim: #94a3b8;
        --diag-code: #788cd4;

        --diag-daemon-bg: #111a4a;
        --diag-daemon-text: #f8fafc;
        --diag-daemon-sub: #93a5e8;
      }
    }

    .title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; fill: var(--diag-title-main); letter-spacing: 0.5px; }
    .header { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; fill: var(--diag-header); }
    .text-sm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: var(--diag-text-main); }
    .text-dim { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: var(--diag-text-dim); }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--diag-code); }
  </style>

  <!-- Background Base Canvas -->
  <rect width="960" height="480" rx="12" fill="var(--diag-canvas)" />
  <text x="480" y="36" text-anchor="middle" class="header">The Docker Engine Architecture: Client, Host Daemon, and Registries</text>

  <!-- 1. DOCKER CLIENT -->
  <g transform="translate(30, 60)">
    <rect width="210" height="385" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-client-border)" stroke-width="1.5" filter="url(#shadow)" />
    <text x="105" y="30" text-anchor="middle" class="title" fill="#3e5199">DOCKER CLIENT</text>
    <text x="105" y="48" text-anchor="middle" class="text-dim">CLI / REST API Consumer</text>

    <g transform="translate(15, 75)">
      <rect width="180" height="48" rx="6" fill="var(--diag-card-sub)" stroke="var(--diag-card-border)" stroke-width="1" />
      <text x="18" y="22" class="code">docker build</text>
      <text x="18" y="38" class="text-dim">Sends context tarball</text>
    </g>
    <g transform="translate(15, 135)">
      <rect width="180" height="48" rx="6" fill="var(--diag-card-sub)" stroke="var(--diag-card-border)" stroke-width="1" />
      <text x="18" y="22" class="code">docker pull / push</text>
      <text x="18" y="38" class="text-dim">Syncs image manifests</text>
    </g>
    <g transform="translate(15, 195)">
      <rect width="180" height="48" rx="6" fill="var(--diag-card-sub)" stroke="var(--diag-card-border)" stroke-width="1" />
      <text x="18" y="22" class="code">docker run / exec</text>
      <text x="18" y="38" class="text-dim">Instantiates container</text>
    </g>
    <g transform="translate(15, 255)">
      <rect width="180" height="48" rx="6" fill="var(--diag-card-sub)" stroke="var(--diag-card-border)" stroke-width="1" />
      <text x="18" y="22" class="code">docker volume / ps</text>
      <text x="18" y="38" class="text-dim">Queries state &amp; storage</text>
    </g>

    <!-- Transport boundary info -->
    <g transform="translate(15, 320)">
      <rect width="180" height="48" rx="6" fill="var(--diag-card-sub)" stroke="var(--diag-client-border)" stroke-width="1" />
      <text x="90" y="20" text-anchor="middle" class="text-dim">IPC Transport Layer:</text>
      <text x="90" y="36" text-anchor="middle" class="code" font-weight="700">/var/run/docker.sock</text>
    </g>
  </g>

  <!-- ARROWS BETWEEN CLIENT & HOST -->
  <path d="M 242 165 L 290 165" stroke="#3e5199" stroke-width="2" marker-end="url(#arrowBlue)" />
  <path d="M 290 220 L 245 220" stroke="#3e5199" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowBlue)" />
  <text x="268" y="155" text-anchor="middle" class="code" font-weight="700" fill="#3e5199">REST</text>

  <!-- 2. DOCKER HOST (DAEMON) -->
  <g transform="translate(295, 60)">
    <rect width="380" height="385" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-host-border)" stroke-width="1.5" filter="url(#shadow)" />
    <text x="190" y="30" text-anchor="middle" class="title" fill="#167e6c">DOCKER HOST (DOCKERD ENGINE)</text>
    <text x="190" y="48" text-anchor="middle" class="text-dim">Manages Container Runtime, Storage, and Virtual Networking</text>

    <!-- Daemon Core -->
    <g transform="translate(20, 65)">
      <rect width="340" height="52" rx="6" fill="var(--diag-daemon-bg)" stroke="#1b2d70" stroke-width="1.5" />
      <text x="170" y="22" text-anchor="middle" class="title" fill="var(--diag-daemon-text)">Docker Daemon (dockerd)</text>
      <text x="170" y="40" text-anchor="middle" class="text-dim" fill="var(--diag-daemon-sub)">REST API Server + Image Builder (BuildKit) + GraphDriver</text>
    </g>

    <!-- containerd & runc layer -->
    <g transform="translate(20, 125)">
      <rect width="340" height="38" rx="6" fill="var(--diag-card-sub)" stroke="var(--diag-card-border)" stroke-width="1" />
      <text x="170" y="24" text-anchor="middle" class="code">containerd ──▶ containerd-shim ──▶ runc (OCI)</text>
    </g>

    <!-- Active Entities Grid -->
    <g transform="translate(20, 175)">
      <!-- Local Images Cache -->
      <g transform="translate(0, 0)">
        <rect width="162" height="110" rx="6" fill="var(--diag-card-sub)" stroke="#1b2d70" stroke-width="1.2" />
        <text x="81" y="22" text-anchor="middle" class="title" fill="#1b2d70">Images (Read-Only)</text>
        <text x="15" y="44" class="text-dim">• Layer 1 (base rootfs)</text>
        <text x="15" y="62" class="text-dim">• Layer 2 (apt dependencies)</text>
        <text x="15" y="80" class="text-dim">• Layer 3 (compiled binary)</text>
        <text x="15" y="98" class="code">sha256:7b1e8a9f...</text>
      </g>

      <!-- Running Containers -->
      <g transform="translate(178, 0)">
        <rect width="162" height="110" rx="6" fill="var(--diag-card-sub)" stroke="#167e6c" stroke-width="1.2" />
        <text x="81" y="22" text-anchor="middle" class="title" fill="#167e6c">Containers (Processes)</text>
        <text x="15" y="44" class="text-dim">• R/W Writable Layer</text>
        <text x="15" y="62" class="text-dim">• PID Namespace isolation</text>
        <text x="15" y="80" class="text-dim">• cgroups CPU/RAM limits</text>
        <text x="15" y="98" class="code" fill="#167e6c">nginx-web (Up 42m)</text>
      </g>
    </g>

    <!-- Volumes & Networks -->
    <g transform="translate(20, 298)">
      <rect width="162" height="68" rx="6" fill="var(--diag-card-sub)" stroke="#167e6c" stroke-width="1" />
      <text x="81" y="22" text-anchor="middle" class="title" fill="#167e6c">Volumes Storage</text>
      <text x="15" y="42" class="text-dim">/var/lib/docker/volumes/</text>
      <text x="15" y="58" class="text-dim">Host-Managed Persistence</text>
    </g>

    <g transform="translate(198, 298)">
      <rect width="162" height="68" rx="6" fill="var(--diag-card-sub)" stroke="#3e5199" stroke-width="1" />
      <text x="81" y="22" text-anchor="middle" class="title" fill="#3e5199">Networks (Bridge)</text>
      <text x="15" y="42" class="text-dim">docker0 (172.17.0.1)</text>
      <text x="15" y="58" class="text-dim">veth peer pairs + iptables</text>
    </g>
  </g>

  <!-- ARROWS BETWEEN HOST & REGISTRY -->
  <path d="M 677 165 L 725 165" stroke="#167e6c" stroke-width="2" marker-end="url(#arrowTeal)" />
  <path d="M 725 210 L 680 210" stroke="#1b2d70" stroke-width="2" marker-end="url(#arrowNavy)" />
  <text x="702" y="155" text-anchor="middle" class="code" font-weight="700" fill="#167e6c">PUSH</text>
  <text x="702" y="230" text-anchor="middle" class="code" font-weight="700" fill="#1b2d70">PULL</text>

  <!-- 3. REMOTE REGISTRY -->
  <g transform="translate(730, 60)">
    <rect width="200" height="385" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-reg-border)" stroke-width="1.5" filter="url(#shadow)" />
    <text x="100" y="30" text-anchor="middle" class="title" fill="#1b2d70">DOCKER REGISTRY</text>
    <text x="100" y="48" text-anchor="middle" class="text-dim">OCI Image Repositories</text>

    <g transform="translate(15, 75)">
      <rect width="170" height="70" rx="6" fill="var(--diag-card-sub)" stroke="#3e5199" stroke-width="1" />
      <text x="15" y="24" class="title" fill="#3e5199">Docker Hub</text>
      <text x="15" y="44" class="text-dim">Public Official Images:</text>
      <text x="15" y="60" class="code">nginx, redis, openjdk</text>
    </g>

    <g transform="translate(15, 160)">
      <rect width="170" height="70" rx="6" fill="var(--diag-card-sub)" stroke="#1b2d70" stroke-width="1" />
      <text x="15" y="24" class="title" fill="#1b2d70">Cloud Registries</text>
      <text x="15" y="44" class="text-dim">AWS ECR, GCP Artifact Reg,</text>
      <text x="15" y="60" class="code">Azure ACR, Harbor</text>
    </g>

    <g transform="translate(15, 245)">
      <rect width="170" height="120" rx="6" fill="var(--diag-card-sub)" stroke="var(--diag-card-border)" stroke-width="1" />
      <text x="15" y="24" class="title">OCI Manifests</text>
      <text x="15" y="44" class="text-dim">• Manifest List (Multi-arch)</text>
      <text x="15" y="62" class="text-dim">• Config JSON (Env/Entry)</text>
      <text x="15" y="80" class="text-dim">• Content Addressable Layers</text>
      <text x="15" y="100" class="code" fill="#167e6c">tars: sha256 gzip blobs</text>
    </g>
  </g>
</svg>
