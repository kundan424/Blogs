<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    /* Default: Light Mode (Clean White Canvas) */
    svg {
      --diag-canvas: #ffffff;
      --diag-header: #111a4a;
      --diag-card-bg: #f8fafc;
      --diag-card-sub: #ffffff;
      --diag-card-border: #cbd5e1;

      --diag-vm-border: #1b2d70;
      --diag-vm-title: #1b2d70;
      --diag-container-border: #167e6c;
      --diag-container-title: #167e6c;

      --diag-title-main: #111a4a;
      --diag-text-main: #1e293b;
      --diag-text-dim: #64748b;
      --diag-code: #1b2d70;

      --diag-engine-bg: #111a4a;
      --diag-hypervisor-bg: #1b2d70;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #12161e;
      --diag-header: #788cd4;
      --diag-card-bg: #171d2b;
      --diag-card-sub: #131b2a;
      --diag-card-border: #243049;

      --diag-vm-border: #1b2d70;
      --diag-vm-title: #93a5e8;
      --diag-container-border: #167e6c;
      --diag-container-title: #2dd4bf;

      --diag-title-main: #f8fafc;
      --diag-text-main: #cbd5e1;
      --diag-text-dim: #94a3b8;
      --diag-code: #788cd4;

      --diag-engine-bg: #111a4a;
      --diag-hypervisor-bg: #1b2d70;
    }

    /* Standalone SVG Viewer */
    @media (prefers-color-scheme: dark) {
      :root:not(html) {
        --diag-canvas: #12161e;
        --diag-header: #788cd4;
        --diag-card-bg: #171d2b;
        --diag-card-sub: #131b2a;
        --diag-card-border: #243049;

        --diag-vm-border: #1b2d70;
        --diag-vm-title: #93a5e8;
        --diag-container-border: #167e6c;
        --diag-container-title: #2dd4bf;

        --diag-title-main: #f8fafc;
        --diag-text-main: #cbd5e1;
        --diag-text-dim: #94a3b8;
        --diag-code: #788cd4;

        --diag-engine-bg: #111a4a;
        --diag-hypervisor-bg: #1b2d70;
      }
    }

    .title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; fill: var(--diag-title-main); letter-spacing: 0.5px; }
    .header { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; fill: var(--diag-header); }
    .text-sm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: var(--diag-text-main); }
    .text-dim { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: var(--diag-text-dim); }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 600; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="960" height="460" rx="12" fill="var(--diag-canvas)" />

  <!-- TOP HEADER -->
  <text x="480" y="36" text-anchor="middle" class="header">Hardware &amp; Kernel Isolation: Virtual Machines vs. Containers</text>

  <!-- ==================== LEFT: VIRTUAL MACHINES ==================== -->
  <g transform="translate(40, 55)">
    <!-- Container Box -->
    <rect width="420" height="375" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-vm-border)" stroke-width="1.5" filter="url(#dropShadow)" />
    <text x="210" y="28" text-anchor="middle" class="title" fill="var(--diag-vm-title)">TYPE 1 / 2 VIRTUAL MACHINES (HYPERVISOR)</text>
    <text x="210" y="44" text-anchor="middle" class="text-dim">Hardware Emulation + Full Guest OS Lifecycle Overhead</text>

    <!-- Apps Row -->
    <g transform="translate(20, 56)">
      <!-- VM 1 -->
      <g transform="translate(0, 0)">
        <rect width="115" height="48" rx="6" fill="var(--diag-card-sub)" stroke="var(--diag-card-border)" stroke-width="1" />
        <text x="57" y="22" text-anchor="middle" class="title" fill="#3e5199">App A</text>
        <text x="57" y="38" text-anchor="middle" class="text-dim">Bins / Libs A</text>
      </g>
      <!-- VM 2 -->
      <g transform="translate(132, 0)">
        <rect width="115" height="48" rx="6" fill="var(--diag-card-sub)" stroke="var(--diag-card-border)" stroke-width="1" />
        <text x="57" y="22" text-anchor="middle" class="title" fill="#3e5199">App B</text>
        <text x="57" y="38" text-anchor="middle" class="text-dim">Bins / Libs B</text>
      </g>
      <!-- VM 3 -->
      <g transform="translate(265, 0)">
        <rect width="115" height="48" rx="6" fill="var(--diag-card-sub)" stroke="var(--diag-card-border)" stroke-width="1" />
        <text x="57" y="22" text-anchor="middle" class="title" fill="#3e5199">App C</text>
        <text x="57" y="38" text-anchor="middle" class="text-dim">Bins / Libs C</text>
      </g>
    </g>

    <!-- Guest OS Row (Heavy Redundant Kernels) -->
    <g transform="translate(20, 112)">
      <g transform="translate(0, 0)">
        <rect width="115" height="46" rx="6" fill="var(--diag-card-sub)" stroke="#111a4a" stroke-width="1.2" />
        <text x="57" y="20" text-anchor="middle" class="title" fill="#111a4a">Guest OS</text>
        <text x="57" y="36" text-anchor="middle" class="text-dim">(Full Kernel + Init)</text>
      </g>
      <g transform="translate(132, 0)">
        <rect width="115" height="46" rx="6" fill="var(--diag-card-sub)" stroke="#111a4a" stroke-width="1.2" />
        <text x="57" y="20" text-anchor="middle" class="title" fill="#111a4a">Guest OS</text>
        <text x="57" y="36" text-anchor="middle" class="text-dim">(Full Kernel + Init)</text>
      </g>
      <g transform="translate(265, 0)">
        <rect width="115" height="46" rx="6" fill="var(--diag-card-sub)" stroke="#111a4a" stroke-width="1.2" />
        <text x="57" y="20" text-anchor="middle" class="title" fill="#111a4a">Guest OS</text>
        <text x="57" y="36" text-anchor="middle" class="text-dim">(Full Kernel + Init)</text>
      </g>
    </g>

    <!-- Hypervisor Layer -->
    <g transform="translate(20, 168)">
      <rect width="380" height="44" rx="6" fill="var(--diag-hypervisor-bg)" stroke="#111a4a" stroke-width="1.2" />
      <text x="190" y="20" text-anchor="middle" class="title" fill="#ffffff">HYPERVISOR (KVM / VMware ESXi / Xen / Hyper-V)</text>
      <text x="190" y="35" text-anchor="middle" class="text-dim" fill="#cbd5e1">Hardware Emulation, Virtual CPU Scheduling, Memory Ballooning</text>
    </g>

    <!-- Host OS -->
    <g transform="translate(20, 222)">
      <rect width="380" height="42" rx="6" fill="var(--diag-card-sub)" stroke="#3e5199" stroke-width="1.2" />
      <text x="190" y="20" text-anchor="middle" class="title" fill="#3e5199">HOST OPERATING SYSTEM (Linux / UNIX)</text>
      <text x="190" y="34" text-anchor="middle" class="text-dim">Host Kernel, Device Drivers, Virtual Switch</text>
    </g>

    <!-- Physical Hardware -->
    <g transform="translate(20, 274)">
      <rect width="380" height="42" rx="6" fill="var(--diag-card-sub)" stroke="var(--diag-card-border)" stroke-width="1" />
      <text x="190" y="20" text-anchor="middle" class="title">BARE METAL INFRASTRUCTURE</text>
      <text x="190" y="34" text-anchor="middle" class="text-dim">Physical CPU Cores, NUMA RAM, PCIe Bus, NIC, NVMe</text>
    </g>

    <!-- Footprint metrics -->
    <g transform="translate(20, 326)">
      <rect width="380" height="34" rx="6" fill="var(--diag-card-sub)" stroke="var(--diag-vm-border)" stroke-width="1" />
      <text x="190" y="21" text-anchor="middle" class="tag" fill="var(--diag-vm-title)">STARTUP: ~30-120s  |  MEMORY: Gigabytes overhead  |  CPU: Hypercall trap</text>
    </g>
  </g>

  <!-- ==================== RIGHT: CONTAINERS ==================== -->
  <g transform="translate(500, 55)">
    <!-- Container Box -->
    <rect width="420" height="375" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-container-border)" stroke-width="1.5" filter="url(#dropShadow)" />
    <text x="210" y="28" text-anchor="middle" class="title" fill="var(--diag-container-title)">LINUX CONTAINERS (DOCKER / RUNTIME)</text>
    <text x="210" y="44" text-anchor="middle" class="text-dim">Direct Process Isolation via Linux Namespaces &amp; cgroups</text>

    <!-- Apps Row -->
    <g transform="translate(20, 56)">
      <!-- Container 1 -->
      <g transform="translate(0, 0)">
        <rect width="115" height="65" rx="6" fill="var(--diag-card-sub)" stroke="#167e6c" stroke-width="1.2" />
        <text x="57" y="22" text-anchor="middle" class="title" fill="#167e6c">Container 1</text>
        <text x="57" y="38" text-anchor="middle" class="text-sm">App A</text>
        <text x="57" y="52" text-anchor="middle" class="text-dim">Rootfs A (Libs)</text>
      </g>
      <!-- Container 2 -->
      <g transform="translate(132, 0)">
        <rect width="115" height="65" rx="6" fill="var(--diag-card-sub)" stroke="#167e6c" stroke-width="1.2" />
        <text x="57" y="22" text-anchor="middle" class="title" fill="#167e6c">Container 2</text>
        <text x="57" y="38" text-anchor="middle" class="text-sm">App B</text>
        <text x="57" y="52" text-anchor="middle" class="text-dim">Rootfs B (Libs)</text>
      </g>
      <!-- Container 3 -->
      <g transform="translate(265, 0)">
        <rect width="115" height="65" rx="6" fill="var(--diag-card-sub)" stroke="#167e6c" stroke-width="1.2" />
        <text x="57" y="22" text-anchor="middle" class="title" fill="#167e6c">Container 3</text>
        <text x="57" y="38" text-anchor="middle" class="text-sm">App C</text>
        <text x="57" y="52" text-anchor="middle" class="text-dim">Rootfs C (Libs)</text>
      </g>
    </g>

    <!-- Docker Engine / Runtime Layer -->
    <g transform="translate(20, 131)">
      <rect width="380" height="52" rx="6" fill="var(--diag-engine-bg)" stroke="#1b2d70" stroke-width="1.2" />
      <text x="190" y="20" text-anchor="middle" class="title" fill="#ffffff">DOCKER ENGINE / OCI RUNTIME (dockerd, containerd, runc)</text>
      <text x="190" y="38" text-anchor="middle" class="text-dim" fill="#cbd5e1">Configures clone() flags, cgroups limits, pivot_root, overlay2 mount</text>
    </g>

    <!-- Shared Host Linux Kernel -->
    <g transform="translate(20, 193)">
      <rect width="380" height="71" rx="6" fill="var(--diag-card-sub)" stroke="#167e6c" stroke-width="1.5" />
      <text x="190" y="22" text-anchor="middle" class="title" fill="#167e6c">SHARED HOST LINUX KERNEL</text>
      <text x="190" y="42" text-anchor="middle" class="tag" fill="#167e6c">NAMESPACES (pid, net, mnt, ipc, uts, user)</text>
      <text x="190" y="58" text-anchor="middle" class="tag" fill="#167e6c">CONTROL GROUPS (cgroups v1/v2: cpu, memory, blkio, pids)</text>
    </g>

    <!-- Physical Hardware -->
    <g transform="translate(20, 274)">
      <rect width="380" height="42" rx="6" fill="var(--diag-card-sub)" stroke="var(--diag-card-border)" stroke-width="1" />
      <text x="190" y="20" text-anchor="middle" class="title">BARE METAL INFRASTRUCTURE</text>
      <text x="190" y="34" text-anchor="middle" class="text-dim">Physical CPU Cores, NUMA RAM, PCIe Bus, NIC, NVMe</text>
    </g>

    <!-- Footprint metrics -->
    <g transform="translate(20, 326)">
      <rect width="380" height="34" rx="6" fill="var(--diag-card-sub)" stroke="var(--diag-container-border)" stroke-width="1" />
      <text x="190" y="21" text-anchor="middle" class="tag" fill="var(--diag-container-title)">STARTUP: &lt; 50ms  |  MEMORY: Megabytes (Zero OS Overhead)  |  CPU: Native speed</text>
    </g>
  </g>
</svg>
