<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#167e6c" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3e5199" />
    </marker>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1b2d70" />
    </marker>
    <marker id="arrowMidnight" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111a4a" />
    </marker>
  </defs>

  <style>
    /* Default: Light Mode (Clean White Canvas) */
    svg {
      --diag-canvas: #ffffff;
      --diag-header-title: #111a4a;
      --diag-header-sub: #64748b;
      --diag-card-bg: #f8fafc;
      --diag-card-inner: #ffffff;
      --diag-card-border: #cbd5e1;

      --diag-col1-border: #167e6c;
      --diag-col1-header: #167e6c;
      --diag-col1-accent: #167e6c;

      --diag-col2-border: #3e5199;
      --diag-col2-header: #3e5199;
      --diag-col2-accent: #3e5199;

      --diag-col3-border: #1b2d70;
      --diag-col3-header: #1b2d70;
      --diag-col3-accent: #1b2d70;

      --diag-col4-border: #111a4a;
      --diag-col4-header: #111a4a;
      --diag-col4-accent: #111a4a;

      --diag-text-main: #111a4a;
      --diag-text-dim: #64748b;
      --diag-bottom-bg: #f1f5f9;
      --diag-bottom-border: #cbd5e1;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #12161e;
      --diag-header-title: #788cd4;
      --diag-header-sub: #94a3b8;
      --diag-card-bg: #171d2b;
      --diag-card-inner: #131b2a;
      --diag-card-border: #243049;

      --diag-col1-border: #167e6c;
      --diag-col1-header: #167e6c;
      --diag-col1-accent: #2dd4bf;

      --diag-col2-border: #3e5199;
      --diag-col2-header: #3e5199;
      --diag-col2-accent: #788cd4;

      --diag-col3-border: #1b2d70;
      --diag-col3-header: #1b2d70;
      --diag-col3-accent: #93a5e8;

      --diag-col4-border: #3e5199;
      --diag-col4-header: #111a4a;
      --diag-col4-accent: #cbd5e1;

      --diag-text-main: #f8fafc;
      --diag-text-dim: #94a3b8;
      --diag-bottom-bg: #131b2a;
      --diag-bottom-border: #243049;
    }

    /* Standalone SVG Viewer */
    @media (prefers-color-scheme: dark) {
      :root:not(html) {
        --diag-canvas: #12161e;
        --diag-header-title: #788cd4;
        --diag-header-sub: #94a3b8;
        --diag-card-bg: #171d2b;
        --diag-card-inner: #131b2a;
        --diag-card-border: #243049;

        --diag-col1-border: #167e6c;
        --diag-col1-header: #167e6c;
        --diag-col1-accent: #2dd4bf;

        --diag-col2-border: #3e5199;
        --diag-col2-header: #3e5199;
        --diag-col2-accent: #788cd4;

        --diag-col3-border: #1b2d70;
        --diag-col3-header: #1b2d70;
        --diag-col3-accent: #93a5e8;

        --diag-col4-border: #3e5199;
        --diag-col4-header: #111a4a;
        --diag-col4-accent: #cbd5e1;

        --diag-text-main: #f8fafc;
        --diag-text-dim: #94a3b8;
        --diag-bottom-bg: #131b2a;
        --diag-bottom-border: #243049;
      }
    }

    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Canvas Frame -->
  <rect width="1040" height="600" rx="12" fill="var(--diag-canvas)" />

  <!-- HEADER TITLE -->
  <g transform="translate(40, 24)">
    <text x="480" y="20" text-anchor="middle" class="font-mono" font-size="14" font-weight="700" fill="var(--diag-header-title)" letter-spacing="1.2">OVERLAY2 UNION FILESYSTEM: THE 4 LIFECYCLE OPERATIONS</text>
    <text x="480" y="38" text-anchor="middle" class="font-sans" font-size="12" fill="var(--diag-header-sub)">How OverlayFS resolves Reads, New Writes, Copy-on-Write (CoW), and Deletions without criss-crossing storage</text>
  </g>

  <!-- ==================== COLUMN 1: READ OPERATION ==================== -->
  <g transform="translate(40, 75)">
    <rect width="228" height="425" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-col1-border)" stroke-width="1.5" filter="url(#boxShadow)" />
    
    <!-- Column Header -->
    <rect x="0" y="0" width="228" height="38" rx="10" fill="var(--diag-col1-header)" />
    <path d="M 0 28 L 0 38 L 228 38 L 228 28 Z" fill="var(--diag-col1-header)" />
    <text x="114" y="24" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#ffffff">1. READ (UNMODIFIED)</text>

    <!-- Step 1: Merged View -->
    <g transform="translate(14, 52)">
      <rect width="200" height="64" rx="8" fill="var(--diag-card-inner)" stroke="var(--diag-col1-border)" stroke-width="1" />
      <text x="12" y="20" class="font-sans" font-size="10" font-weight="600" fill="var(--diag-col1-accent)">CONTAINER SEES (merged):</text>
      <text x="12" y="38" class="font-mono" font-size="11.5" font-weight="700" fill="var(--diag-text-main)">/app/app.jar</text>
      <text x="12" y="52" class="font-sans" font-size="10" fill="var(--diag-text-dim)">Normal read request</text>
    </g>

    <!-- Straight Down Arrow 1 -->
    <g transform="translate(114, 126)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#167e6c" stroke-width="2.5" marker-end="url(#arrowGreen)" />
      <rect x="-48" y="10" width="96" height="20" rx="4" fill="var(--diag-card-inner)" stroke="#167e6c" stroke-width="1" />
      <text x="0" y="24" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#167e6c">PASSTHROUGH</text>
    </g>

    <!-- Step 2: Writable Layer Status -->
    <g transform="translate(14, 176)">
      <rect width="200" height="52" rx="8" fill="var(--diag-card-inner)" stroke="var(--diag-card-border)" stroke-width="1" stroke-dasharray="3,3" />
      <text x="12" y="18" class="font-sans" font-size="10" font-weight="600" fill="var(--diag-text-dim)">WRITABLE LAYER (upperdir):</text>
      <text x="12" y="36" class="font-mono" font-size="11" fill="var(--diag-text-dim)">(Not present / Empty)</text>
    </g>

    <!-- Straight Down Arrow 2 -->
    <g transform="translate(114, 238)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#167e6c" stroke-width="2.5" marker-end="url(#arrowGreen)" />
      <rect x="-42" y="10" width="84" height="20" rx="4" fill="var(--diag-card-inner)" stroke="#167e6c" stroke-width="1" />
      <text x="0" y="24" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#167e6c">FETCH LOWER</text>
    </g>

    <!-- Step 3: Lowerdir Layer -->
    <g transform="translate(14, 288)">
      <rect width="200" height="88" rx="8" fill="var(--diag-card-inner)" stroke="var(--diag-col1-border)" stroke-width="1.2" />
      <text x="12" y="18" class="font-sans" font-size="10" font-weight="600" fill="var(--diag-col1-accent)">IMAGE LAYER (lowerdir):</text>
      <text x="12" y="38" class="font-mono" font-size="11.5" font-weight="700" fill="var(--diag-text-main)">Layer 3: App Code</text>
      <text x="12" y="56" class="font-mono" font-size="10.5" fill="#167e6c">└── app.jar</text>
      <text x="12" y="74" class="font-sans" font-size="9.5" fill="var(--diag-text-dim)">✓ Read directly from disk</text>
    </g>

    <text x="114" y="405" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="var(--diag-col1-accent)">0 MB disk copied (Free)</text>
  </g>

  <!-- ==================== COLUMN 2: NEW WRITE ==================== -->
  <g transform="translate(284, 75)">
    <rect width="228" height="425" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-col2-border)" stroke-width="1.5" filter="url(#boxShadow)" />
    
    <!-- Column Header -->
    <rect x="0" y="0" width="228" height="38" rx="10" fill="var(--diag-col2-header)" />
    <path d="M 0 28 L 0 38 L 228 38 L 228 28 Z" fill="var(--diag-col2-header)" />
    <text x="114" y="24" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#ffffff">2. WRITE (NEW FILE)</text>

    <!-- Step 1: Merged View -->
    <g transform="translate(14, 52)">
      <rect width="200" height="64" rx="8" fill="var(--diag-card-inner)" stroke="var(--diag-col2-border)" stroke-width="1" />
      <text x="12" y="20" class="font-sans" font-size="10" font-weight="600" fill="var(--diag-col2-accent)">CONTAINER SEES (merged):</text>
      <text x="12" y="38" class="font-mono" font-size="11.5" font-weight="700" fill="var(--diag-text-main)">/tmp/session.log</text>
      <text x="12" y="52" class="font-sans" font-size="10" fill="var(--diag-text-dim)">Created at runtime</text>
    </g>

    <!-- Straight Down Arrow 1 -->
    <g transform="translate(114, 126)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#3e5199" stroke-width="2.5" marker-end="url(#arrowBlue)" />
      <rect x="-48" y="10" width="96" height="20" rx="4" fill="var(--diag-card-inner)" stroke="#3e5199" stroke-width="1" />
      <text x="0" y="24" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#3e5199">DIRECT WRITE</text>
    </g>

    <!-- Step 2: Writable Layer Status -->
    <g transform="translate(14, 176)">
      <rect width="200" height="74" rx="8" fill="var(--diag-card-inner)" stroke="var(--diag-col2-border)" stroke-width="1.2" />
      <text x="12" y="18" class="font-sans" font-size="10" font-weight="600" fill="var(--diag-col2-accent)">WRITABLE LAYER (upperdir):</text>
      <text x="12" y="38" class="font-mono" font-size="11.5" font-weight="700" fill="var(--diag-text-main)">+ session.log</text>
      <text x="12" y="56" class="font-sans" font-size="10" fill="var(--diag-text-dim)">Stored in container's private diff/</text>
    </g>

    <g transform="translate(114, 260)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="var(--diag-card-border)" stroke-width="1.5" stroke-dasharray="3,3" />
    </g>

    <!-- Step 3: Lowerdir Layer (Untouched) -->
    <g transform="translate(14, 288)">
      <rect width="200" height="88" rx="8" fill="var(--diag-card-inner)" stroke="var(--diag-card-border)" stroke-width="1" stroke-dasharray="3,3" />
      <text x="12" y="18" class="font-sans" font-size="10" font-weight="600" fill="var(--diag-text-dim)">IMAGE LAYER (lowerdir):</text>
      <text x="12" y="44" class="font-mono" font-size="11" fill="var(--diag-text-dim)">(Untouched on Host)</text>
      <text x="12" y="64" class="font-sans" font-size="9.5" fill="var(--diag-text-dim)">No lower layer touched</text>
    </g>

    <text x="114" y="405" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="var(--diag-col2-accent)">Saved in ephemeral upperdir</text>
  </g>

  <!-- ==================== COLUMN 3: COPY-ON-WRITE ==================== -->
  <g transform="translate(528, 75)">
    <rect width="228" height="425" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-col3-border)" stroke-width="1.5" filter="url(#boxShadow)" />
    
    <!-- Column Header -->
    <rect x="0" y="0" width="228" height="38" rx="10" fill="var(--diag-col3-header)" />
    <path d="M 0 28 L 0 38 L 228 38 L 228 28 Z" fill="var(--diag-col3-header)" />
    <text x="114" y="24" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#ffffff">3. COPY-ON-WRITE (CoW)</text>

    <!-- Step 1: Merged View -->
    <g transform="translate(14, 52)">
      <rect width="200" height="64" rx="8" fill="var(--diag-card-inner)" stroke="var(--diag-col3-border)" stroke-width="1" />
      <text x="12" y="20" class="font-sans" font-size="10" font-weight="600" fill="var(--diag-col3-accent)">CONTAINER SEES (merged):</text>
      <text x="12" y="38" class="font-mono" font-size="11.5" font-weight="700" fill="var(--diag-text-main)">/app/config.json</text>
      <text x="12" y="52" class="font-sans" font-size="10" fill="var(--diag-text-dim)">Modified values active</text>
    </g>

    <!-- UPWARD CoW ARROW from Lower to Upper -->
    <g transform="translate(114, 126)">
      <line x1="0" y1="40" x2="0" y2="0" stroke="#1b2d70" stroke-width="2.5" marker-end="url(#arrowNavy)" />
      <rect x="-42" y="10" width="84" height="20" rx="4" fill="var(--diag-card-inner)" stroke="#1b2d70" stroke-width="1" />
      <text x="0" y="24" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#1b2d70">1. COPY UP ↑</text>
    </g>

    <!-- Step 2: Writable Layer -->
    <g transform="translate(14, 176)">
      <rect width="200" height="74" rx="8" fill="var(--diag-card-inner)" stroke="var(--diag-col3-border)" stroke-width="1.2" />
      <text x="12" y="18" class="font-sans" font-size="10" font-weight="600" fill="var(--diag-col3-accent)">WRITABLE LAYER (upperdir):</text>
      <text x="12" y="38" class="font-mono" font-size="11.5" font-weight="700" fill="var(--diag-text-main)">⟳ config.json (MODIFIED)</text>
      <text x="12" y="56" class="font-sans" font-size="10" fill="var(--diag-text-dim)">2. Writes applied here</text>
    </g>

    <g transform="translate(114, 260)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#1b2d70" stroke-width="1.5" stroke-dasharray="3,3" />
    </g>

    <!-- Step 3: Lowerdir Layer -->
    <g transform="translate(14, 288)">
      <rect width="200" height="88" rx="8" fill="var(--diag-card-inner)" stroke="var(--diag-col3-border)" stroke-width="1.2" />
      <text x="12" y="18" class="font-sans" font-size="10" font-weight="600" fill="var(--diag-col3-accent)">IMAGE LAYER (lowerdir):</text>
      <text x="12" y="38" class="font-mono" font-size="11.5" font-weight="700" fill="var(--diag-text-main)">Layer 3: App Code</text>
      <text x="12" y="56" class="font-mono" font-size="10.5" fill="#1b2d70">└── config.json (Original)</text>
      <text x="12" y="74" class="font-sans" font-size="9.5" fill="var(--diag-text-dim)">✓ Original untouched on disk</text>
    </g>

    <text x="114" y="405" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="var(--diag-col3-accent)">Original Image Never Mutates</text>
  </g>

  <!-- ==================== COLUMN 4: WHITEOUT DELETION ==================== -->
  <g transform="translate(772, 75)">
    <rect width="228" height="425" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-col4-border)" stroke-width="1.5" filter="url(#boxShadow)" />
    
    <!-- Column Header -->
    <rect x="0" y="0" width="228" height="38" rx="10" fill="var(--diag-col4-header)" />
    <path d="M 0 28 L 0 38 L 228 38 L 228 28 Z" fill="var(--diag-col4-header)" />
    <text x="114" y="24" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#ffffff">4. DELETE (WHITEOUT)</text>

    <!-- Step 1: Merged View -->
    <g transform="translate(14, 52)">
      <rect width="200" height="64" rx="8" fill="var(--diag-card-inner)" stroke="var(--diag-col4-border)" stroke-width="1" />
      <text x="12" y="20" class="font-sans" font-size="10" font-weight="600" fill="var(--diag-col4-accent)">CONTAINER SEES (merged):</text>
      <text x="12" y="38" class="font-mono" font-size="11.5" font-weight="700" fill="var(--diag-text-main)" text-decoration="line-through">/etc/nginx.conf</text>
      <text x="12" y="52" class="font-sans" font-size="10" fill="var(--diag-text-dim)">File deleted / Hidden (ENOENT)</text>
    </g>

    <!-- Straight Down Arrow 1 -->
    <g transform="translate(114, 126)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#111a4a" stroke-width="2.5" marker-end="url(#arrowMidnight)" />
      <rect x="-48" y="10" width="96" height="20" rx="4" fill="var(--diag-card-inner)" stroke="#111a4a" stroke-width="1" />
      <text x="0" y="24" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#111a4a">CREATE MASK</text>
    </g>

    <!-- Step 2: Writable Layer (Holds Whiteout Marker) -->
    <g transform="translate(14, 176)">
      <rect width="200" height="74" rx="8" fill="var(--diag-card-inner)" stroke="var(--diag-col4-border)" stroke-width="1.2" />
      <text x="12" y="18" class="font-sans" font-size="10" font-weight="600" fill="var(--diag-col4-accent)">WRITABLE LAYER (upperdir):</text>
      <text x="12" y="38" class="font-mono" font-size="11.5" font-weight="700" fill="var(--diag-text-main)">✕ .wh.nginx.conf</text>
      <text x="12" y="56" class="font-sans" font-size="10" fill="var(--diag-text-dim)">Character device (0,0) masks lower</text>
    </g>

    <g transform="translate(114, 260)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="var(--diag-card-border)" stroke-width="1.5" stroke-dasharray="3,3" />
    </g>

    <!-- Step 3: Lowerdir Layer (Masked, still exists) -->
    <g transform="translate(14, 288)">
      <rect width="200" height="88" rx="8" fill="var(--diag-card-inner)" stroke="var(--diag-col4-border)" stroke-width="1.2" />
      <text x="12" y="18" class="font-sans" font-size="10" font-weight="600" fill="var(--diag-col4-accent)">IMAGE LAYER (lowerdir):</text>
      <text x="12" y="38" class="font-mono" font-size="11.5" font-weight="700" fill="var(--diag-text-main)">Layer 2: Nginx Package</text>
      <text x="12" y="56" class="font-mono" font-size="10.5" fill="#111a4a">└── nginx.conf (Masked)</text>
      <text x="12" y="74" class="font-sans" font-size="9.5" fill="var(--diag-text-dim)">Still exists, but invisible in merged</text>
    </g>

    <text x="114" y="405" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="var(--diag-col4-accent)">Lower Read-Only File Protected</text>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM ARCHITECTURAL TAKEAWAY BAR                                         -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 520)">
    <rect width="960" height="58" rx="10" fill="var(--diag-bottom-bg)" stroke="var(--diag-bottom-border)" stroke-width="1.2" />
    <circle cx="24" cy="29" r="6" fill="#167e6c" />
    <text x="40" y="25" class="font-mono" font-size="11" font-weight="700" fill="var(--diag-text-main)">SYSTEM INVARIANT: CONTENT-ADDRESSABLE IMMUTABILITY</text>
    <text x="40" y="44" class="font-sans" font-size="11" fill="var(--diag-text-dim)">Lower layers never mutate. 1,000 running containers using the same base image share the identical lowerdir on disk with zero duplication overhead.</text>
  </g>
</svg>
