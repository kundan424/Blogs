<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgCanvas5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="badCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="goodCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" rx="14" fill="url(#bgCanvas5)" stroke="#334155" stroke-width="1.5" />

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" fill="#f8fafc" font-size="16.5" font-weight="700" letter-spacing="0.5">
    LAYER CACHE INVALIDATION: WHY INSTRUCTION ORDER DETERMINES BUILD SPEED
  </text>
  <line x1="50" y1="48" x2="910" y2="48" stroke="#334155" stroke-width="1" />

  <!-- ========================================================= -->
  <!-- LEFT COLUMN: BAD (NAIVE) ORDERING                         -->
  <!-- ========================================================= -->
  <g transform="translate(36, 66)">
    <rect width="425" height="295" rx="10" fill="url(#badCardGrad)" stroke="#ef4444" stroke-width="1.5" />

    <!-- Badge -->
    <rect x="14" y="12" width="220" height="24" rx="4" fill="#991b1b" />
    <text x="124" y="28" text-anchor="middle" fill="#fecaca" font-size="11" font-weight="700">
      BAD: NAIVE COPY-ALL ORDERING
    </text>

    <!-- Step 1 -->
    <rect x="14" y="46" width="397" height="34" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="24" y="67" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">CACHED [1/4]</text>
    <text x="120" y="67" fill="#cbd5e1" font-family="monospace" font-size="10.5">FROM eclipse-temurin:21-jdk</text>

    <!-- Step 2 -->
    <rect x="14" y="86" width="397" height="34" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="24" y="107" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">CACHED [2/4]</text>
    <text x="120" y="107" fill="#cbd5e1" font-family="monospace" font-size="10.5">WORKDIR /app</text>

    <!-- Step 3: THE BUSTED STEP -->
    <rect x="14" y="126" width="397" height="42" rx="4" fill="#450a0a" stroke="#f87171" stroke-width="1.5" />
    <text x="24" y="145" fill="#f87171" font-family="monospace" font-size="10" font-weight="700">CACHE BUST! [3/4]</text>
    <text x="140" y="145" fill="#fecaca" font-family="monospace" font-size="10.5" font-weight="700">COPY . . (Copies whole repo)</text>
    <text x="24" y="160" fill="#fca5a5" font-size="10">Editing 1 line of Java invalidates checksum of entire directory!</text>

    <!-- Step 4: REBUILD -->
    <rect x="14" y="174" width="397" height="42" rx="4" fill="#2d1515" stroke="#ef4444" stroke-dasharray="4,3" />
    <text x="24" y="193" fill="#f87171" font-family="monospace" font-size="10" font-weight="700">FORCED RUN [4/4]</text>
    <text x="140" y="193" fill="#fecaca" font-family="monospace" font-size="10.5">RUN ./mvnw clean package</text>
    <text x="24" y="208" fill="#fca5a5" font-size="10">Must redownload 400 MB of Maven plugins every build!</text>

    <!-- Metric Card -->
    <rect x="14" y="226" width="397" height="55" rx="6" fill="#1c1917" stroke="#dc2626" />
    <text x="28" y="248" fill="#fca5a5" font-size="11.5" font-weight="600">Rebuild Time per Code Edit:</text>
    <text x="28" y="271" fill="#f87171" font-family="monospace" font-size="18" font-weight="700">3m 42s</text>
    <text x="115" y="271" fill="#fca5a5" font-size="11">(Slow, network-bound, wasteful)</text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT COLUMN: GOOD (CACHED) ORDERING                      -->
  <!-- ========================================================= -->
  <g transform="translate(499, 66)">
    <rect width="425" height="295" rx="10" fill="url(#goodCardGrad)" stroke="#10b981" stroke-width="1.5" />

    <!-- Badge -->
    <rect x="14" y="12" width="240" height="24" rx="4" fill="#065f46" />
    <text x="134" y="28" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="700">
      GOOD: DEPENDENCY ISOLATION ORDER
    </text>

    <!-- Step 1-2 (Combined compact) -->
    <rect x="14" y="46" width="397" height="30" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="24" y="65" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">CACHED</text>
    <text x="80" y="65" fill="#cbd5e1" font-family="monospace" font-size="10">FROM temurin:21-jdk-alpine &amp; WORKDIR /build</text>

    <!-- Step 3: Copy POM -->
    <rect x="14" y="82" width="397" height="30" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="24" y="101" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">CACHED</text>
    <text x="80" y="101" fill="#cbd5e1" font-family="monospace" font-size="10">COPY pom.xml mvnw .mvn/ .</text>
    <text x="270" y="101" fill="#94a3b8" font-size="9.5">(pom.xml rarely changes)</text>

    <!-- Step 4: Go Offline -->
    <rect x="14" y="118" width="397" height="32" rx="4" fill="#064e3b" stroke="#34d399" />
    <text x="24" y="137" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">CACHED (0.0s!)</text>
    <text x="130" y="137" fill="#ecfdf5" font-family="monospace" font-size="10">RUN ./mvnw dependency:go-offline</text>

    <!-- Step 5: Copy SRC -->
    <rect x="14" y="156" width="397" height="30" rx="4" fill="#0f172a" stroke="#38bdf8" />
    <text x="24" y="175" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">REBUILD</text>
    <text x="85" y="175" fill="#e0f2fe" font-family="monospace" font-size="10">COPY src ./src (Only changes when Java code edits)</text>

    <!-- Step 6: Compile -->
    <rect x="14" y="192" width="397" height="30" rx="4" fill="#0f172a" stroke="#38bdf8" />
    <text x="24" y="211" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">COMPILE</text>
    <text x="85" y="211" fill="#e0f2fe" font-family="monospace" font-size="10">RUN ./mvnw clean package -DskipTests</text>

    <!-- Metric Card -->
    <rect x="14" y="228" width="397" height="53" rx="6" fill="#064e3b" stroke="#10b981" />
    <text x="28" y="249" fill="#a7f3d0" font-size="11.5" font-weight="600">Rebuild Time per Code Edit:</text>
    <text x="28" y="271" fill="#34d399" font-family="monospace" font-size="18" font-weight="700">2.8s</text>
    <text x="75" y="271" fill="#a7f3d0" font-size="11">(Local compiler only, zero internet downloads!)</text>
  </g>

  <!-- Bottom Explanatory Strip -->
  <rect x="36" y="372" width="888" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="480" y="395" text-anchor="middle" fill="#e2e8f0" font-size="11.5">
    <tspan fill="#fbbf24" font-weight="700">The Golden Rule of Docker Caching:</tspan> Order instructions from <tspan fill="#34d399" font-weight="700">least volatile</tspan> (dependencies) to <tspan fill="#f87171" font-weight="700">most volatile</tspan> (application source code)!
  </text>
</svg>