<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    /* Default: Light Mode (Clean White Canvas) */
    svg {
      --diag-canvas: #ffffff;
      --diag-header-title: #111a4a;
      --diag-divider: #cbd5e1;

      --diag-card-bg: #f8fafc;
      --diag-card-inner: #ffffff;
      --diag-card-border: #cbd5e1;

      --diag-bad-border: #111a4a;
      --diag-bad-header: #111a4a;
      --diag-bad-accent: #111a4a;

      --diag-good-border: #167e6c;
      --diag-good-header: #167e6c;
      --diag-good-accent: #167e6c;

      --diag-text-main: #111a4a;
      --diag-text-dim: #64748b;
      --diag-bottom-bg: #f1f5f9;
      --diag-bottom-border: #cbd5e1;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #12161e;
      --diag-header-title: #788cd4;
      --diag-divider: #243049;

      --diag-card-bg: #171d2b;
      --diag-card-inner: #131b2a;
      --diag-card-border: #243049;

      --diag-bad-border: #3e5199;
      --diag-bad-header: #111a4a;
      --diag-bad-accent: #cbd5e1;

      --diag-good-border: #167e6c;
      --diag-good-header: #167e6c;
      --diag-good-accent: #2dd4bf;

      --diag-text-main: #f8fafc;
      --diag-text-dim: #94a3b8;
      --diag-bottom-bg: #131b2a;
      --diag-bottom-border: #243049;
    }

    /* Standalone SVG Viewer */
    @media (prefers-color-scheme: dark) {
      :root:not(html) {
        --diag-canvas: #12161e;
        --diag-header-title: #788cd4;
        --diag-divider: #243049;

        --diag-card-bg: #171d2b;
        --diag-card-inner: #131b2a;
        --diag-card-border: #243049;

        --diag-bad-border: #3e5199;
        --diag-bad-header: #111a4a;
        --diag-bad-accent: #cbd5e1;

        --diag-good-border: #167e6c;
        --diag-good-header: #167e6c;
        --diag-good-accent: #2dd4bf;

        --diag-text-main: #f8fafc;
        --diag-text-dim: #94a3b8;
        --diag-bottom-bg: #131b2a;
        --diag-bottom-border: #243049;
      }
    }
  </style>

  <!-- Background -->
  <rect width="960" height="420" rx="12" fill="var(--diag-canvas)" />

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" fill="var(--diag-header-title)" font-size="15" font-weight="700" letter-spacing="0.5">
    LAYER CACHE INVALIDATION: WHY INSTRUCTION ORDER DETERMINES BUILD SPEED
  </text>
  <line x1="50" y1="48" x2="910" y2="48" stroke="var(--diag-divider)" stroke-width="1" />

  <!-- ========================================================= -->
  <!-- LEFT COLUMN: BAD (NAIVE) ORDERING                         -->
  <!-- ========================================================= -->
  <g transform="translate(36, 66)">
    <rect width="425" height="295" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-bad-border)" stroke-width="1.5" filter="url(#shadow)" />

    <!-- Badge -->
    <rect x="14" y="12" width="220" height="24" rx="4" fill="var(--diag-bad-header)" />
    <text x="124" y="28" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">
      BAD: NAIVE COPY-ALL ORDERING
    </text>

    <!-- Step 1 -->
    <rect x="14" y="46" width="397" height="34" rx="4" fill="var(--diag-card-inner)" stroke="var(--diag-card-border)" />
    <text x="24" y="67" fill="#167e6c" font-family="monospace" font-size="10" font-weight="700">CACHED [1/4]</text>
    <text x="120" y="67" fill="var(--diag-text-main)" font-family="monospace" font-size="10.5">FROM eclipse-temurin:21-jdk</text>

    <!-- Step 2 -->
    <rect x="14" y="86" width="397" height="34" rx="4" fill="var(--diag-card-inner)" stroke="var(--diag-card-border)" />
    <text x="24" y="107" fill="#167e6c" font-family="monospace" font-size="10" font-weight="700">CACHED [2/4]</text>
    <text x="120" y="107" fill="var(--diag-text-main)" font-family="monospace" font-size="10.5">WORKDIR /app</text>

    <!-- Step 3: THE BUSTED STEP -->
    <rect x="14" y="126" width="397" height="42" rx="4" fill="var(--diag-card-inner)" stroke="#111a4a" stroke-width="1.5" />
    <text x="24" y="145" fill="#111a4a" font-family="monospace" font-size="10" font-weight="700">CACHE BUST! [3/4]</text>
    <text x="140" y="145" fill="#111a4a" font-family="monospace" font-size="10.5" font-weight="700">COPY . . (Copies whole repo)</text>
    <text x="24" y="160" fill="var(--diag-text-dim)" font-size="10">Editing 1 line of Java invalidates checksum of entire directory!</text>

    <!-- Step 4: REBUILD -->
    <rect x="14" y="174" width="397" height="42" rx="4" fill="var(--diag-card-inner)" stroke="#1b2d70" stroke-dasharray="4,3" />
    <text x="24" y="193" fill="#1b2d70" font-family="monospace" font-size="10" font-weight="700">FORCED RUN [4/4]</text>
    <text x="140" y="193" fill="#1b2d70" font-family="monospace" font-size="10.5">RUN ./mvnw clean package</text>
    <text x="24" y="208" fill="var(--diag-text-dim)" font-size="10">Must redownload 400 MB of Maven plugins every build!</text>

    <!-- Metric Card -->
    <rect x="14" y="226" width="397" height="55" rx="6" fill="var(--diag-card-inner)" stroke="#111a4a" />
    <text x="28" y="248" fill="var(--diag-text-dim)" font-size="11.5" font-weight="600">Rebuild Time per Code Edit:</text>
    <text x="28" y="271" fill="#111a4a" font-family="monospace" font-size="18" font-weight="700">3m 42s</text>
    <text x="115" y="271" fill="var(--diag-text-dim)" font-size="11">(Slow, network-bound, wasteful)</text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT COLUMN: GOOD (CACHED) ORDERING                      -->
  <!-- ========================================================= -->
  <g transform="translate(499, 66)">
    <rect width="425" height="295" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-good-border)" stroke-width="1.5" filter="url(#shadow)" />

    <!-- Badge -->
    <rect x="14" y="12" width="240" height="24" rx="4" fill="var(--diag-good-header)" />
    <text x="134" y="28" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">
      GOOD: DEPENDENCY ISOLATION ORDER
    </text>

    <!-- Step 1-2 -->
    <rect x="14" y="46" width="397" height="30" rx="4" fill="var(--diag-card-inner)" stroke="var(--diag-card-border)" />
    <text x="24" y="65" fill="#167e6c" font-family="monospace" font-size="10" font-weight="700">CACHED</text>
    <text x="80" y="65" fill="var(--diag-text-main)" font-family="monospace" font-size="10">FROM temurin:21-jdk-alpine &amp; WORKDIR /build</text>

    <!-- Step 3: Copy POM -->
    <rect x="14" y="82" width="397" height="30" rx="4" fill="var(--diag-card-inner)" stroke="var(--diag-card-border)" />
    <text x="24" y="101" fill="#167e6c" font-family="monospace" font-size="10" font-weight="700">CACHED</text>
    <text x="80" y="101" fill="var(--diag-text-main)" font-family="monospace" font-size="10">COPY pom.xml mvnw .mvn/ .</text>
    <text x="270" y="101" fill="var(--diag-text-dim)" font-size="9.5">(pom.xml rarely changes)</text>

    <!-- Step 4: Go Offline -->
    <rect x="14" y="118" width="397" height="32" rx="4" fill="var(--diag-card-inner)" stroke="#167e6c" />
    <text x="24" y="137" fill="#167e6c" font-family="monospace" font-size="10" font-weight="700">CACHED (0.0s!)</text>
    <text x="130" y="137" fill="#167e6c" font-family="monospace" font-size="10">RUN ./mvnw dependency:go-offline</text>

    <!-- Step 5: Copy SRC -->
    <rect x="14" y="156" width="397" height="30" rx="4" fill="var(--diag-card-inner)" stroke="#3e5199" />
    <text x="24" y="175" fill="#3e5199" font-family="monospace" font-size="10" font-weight="700">REBUILD</text>
    <text x="85" y="175" fill="var(--diag-text-main)" font-family="monospace" font-size="10">COPY src ./src (Only changes when Java code edits)</text>

    <!-- Step 6: Compile -->
    <rect x="14" y="192" width="397" height="30" rx="4" fill="var(--diag-card-inner)" stroke="#3e5199" />
    <text x="24" y="211" fill="#3e5199" font-family="monospace" font-size="10" font-weight="700">COMPILE</text>
    <text x="85" y="211" fill="var(--diag-text-main)" font-family="monospace" font-size="10">RUN ./mvnw clean package -DskipTests</text>

    <!-- Metric Card -->
    <rect x="14" y="228" width="397" height="53" rx="6" fill="var(--diag-card-inner)" stroke="#167e6c" />
    <text x="28" y="249" fill="var(--diag-good-accent)" font-size="11.5" font-weight="600">Rebuild Time per Code Edit:</text>
    <text x="28" y="271" fill="#167e6c" font-family="monospace" font-size="18" font-weight="700">2.8s</text>
    <text x="75" y="271" fill="var(--diag-text-dim)" font-size="11">(Local compiler only, zero internet downloads!)</text>
  </g>

  <!-- Bottom Explanatory Strip -->
  <rect x="36" y="372" width="888" height="36" rx="6" fill="var(--diag-bottom-bg)" stroke="var(--diag-bottom-border)" stroke-width="1" />
  <text x="480" y="395" text-anchor="middle" fill="var(--diag-text-main)" font-size="11.5">
    <tspan fill="#111a4a" font-weight="700">The Golden Rule of Docker Caching:</tspan> Order instructions from <tspan fill="#167e6c" font-weight="700">least volatile</tspan> (dependencies) to <tspan fill="#3e5199" font-weight="700">most volatile</tspan> (application source code)!
  </text>
</svg>
