<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgCanvas2a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="greenBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Main Background -->
  <rect width="980" height="420" rx="14" fill="url(#bgCanvas2a)" stroke="#334155" stroke-width="1.5" />

  <!-- Title -->
  <text x="490" y="36" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700" letter-spacing="0.5">
    THE DOCKER LIFECYCLE: FROM BLUEPRINT TO RUNNING SPRING BOOT CONTAINERS
  </text>
  <line x1="50" y1="52" x2="930" y2="52" stroke="#334155" stroke-width="1" />

  <!-- ========================================================= -->
  <!-- STAGE 1: DOCKERFILE (THE BLUEPRINT)                       -->
  <!-- ========================================================= -->
  <g transform="translate(30, 75)">
    <rect width="240" height="310" rx="10" fill="url(#blueBox)" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Header Badge -->
    <rect x="16" y="14" width="208" height="26" rx="5" fill="#0284c7" />
    <text x="120" y="31" text-anchor="middle" fill="#f0f9ff" font-size="12" font-weight="700" letter-spacing="0.5">
      1. DOCKERFILE (BLUEPRINT)
    </text>

    <!-- OOP Analogy Pill -->
    <rect x="24" y="50" width="192" height="22" rx="4" fill="#1e293b" stroke="#475569" />
    <text x="120" y="65" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">
      OOP Analogy: .java Source File
    </text>

    <!-- Code Snippet Box -->
    <rect x="18" y="84" width="204" height="145" rx="6" fill="#090d16" stroke="#334155" />
    <text x="28" y="106" fill="#64748b" font-family="monospace" font-size="10.5"># Spring Boot Blueprint</text>
    <text x="28" y="126" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">FROM</text>
    <text x="64" y="126" fill="#e2e8f0" font-family="monospace" font-size="10.5">temurin:21-jre-alpine</text>
    <text x="28" y="146" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">WORKDIR</text>
    <text x="86" y="146" fill="#e2e8f0" font-family="monospace" font-size="10.5">/app</text>
    <text x="28" y="166" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">COPY</text>
    <text x="64" y="166" fill="#e2e8f0" font-family="monospace" font-size="10.5">target/api.jar app.jar</text>
    <text x="28" y="186" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">EXPOSE</text>
    <text x="78" y="186" fill="#fbbf24" font-family="monospace" font-size="10.5">8080</text>
    <text x="28" y="206" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">ENTRYPOINT</text>
    <text x="28" y="220" fill="#a7f3d0" font-family="monospace" font-size="10">["java","-jar","app.jar"]</text>

    <!-- Properties Footer -->
    <text x="120" y="254" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-weight="600">State: Editable Text File</text>
    <text x="120" y="274" text-anchor="middle" fill="#94a3b8" font-size="11">Lives in Git Repository</text>
    <text x="120" y="294" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10.5">Size: ~1 KB on disk</text>
  </g>

  <!-- ========================================================= -->
  <!-- TRANSITION 1: docker build                                -->
  <!-- ========================================================= -->
  <g>
    <line x1="275" y1="230" x2="355" y2="230" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)" />
    <rect x="278" y="192" width="76" height="24" rx="4" fill="#0c4a6e" stroke="#38bdf8" />
    <text x="316" y="208" text-anchor="middle" fill="#e0f2fe" font-family="monospace" font-size="10" font-weight="700">docker build</text>
    <text x="316" y="250" text-anchor="middle" fill="#94a3b8" font-size="10">Compiles</text>
    <text x="316" y="263" text-anchor="middle" fill="#94a3b8" font-size="10">Layers</text>
  </g>

  <!-- ========================================================= -->
  <!-- STAGE 2: DOCKER IMAGE (IMMUTABLE ARTIFACT)                -->
  <!-- ========================================================= -->
  <g transform="translate(365, 75)">
    <rect width="250" height="310" rx="10" fill="url(#purpleBox)" stroke="#a855f7" stroke-width="1.5" />

    <!-- Header Badge -->
    <rect x="16" y="14" width="218" height="26" rx="5" fill="#7e22ce" />
    <text x="125" y="31" text-anchor="middle" fill="#faf5ff" font-size="12" font-weight="700" letter-spacing="0.5">
      2. DOCKER IMAGE (ARTIFACT)
    </text>

    <!-- OOP Analogy Pill -->
    <rect x="20" y="50" width="210" height="22" rx="4" fill="#1e293b" stroke="#475569" />
    <text x="125" y="65" text-anchor="middle" fill="#d8b4fe" font-size="11" font-weight="600">
      OOP Analogy: Compiled Class / Bytecode
    </text>

    <!-- Layered Stack Visual -->
    <g transform="translate(20, 84)">
      <rect x="0" y="0" width="210" height="34" rx="5" fill="#3b0764" stroke="#c084fc" stroke-width="1.2" />
      <text x="105" y="15" text-anchor="middle" fill="#f3e8ff" font-family="monospace" font-size="10.5" font-weight="700">Layer 3: app.jar (Spring Boot)</text>
      <text x="105" y="28" text-anchor="middle" fill="#d8b4fe" font-size="9.5">Read-Only Layer (42 MB)</text>

      <rect x="0" y="42" width="210" height="34" rx="5" fill="#2e1065" stroke="#a855f7" stroke-width="1.2" />
      <text x="105" y="57" text-anchor="middle" fill="#f3e8ff" font-family="monospace" font-size="10.5" font-weight="700">Layer 2: Eclipse Temurin JRE 21</text>
      <text x="105" y="70" text-anchor="middle" fill="#d8b4fe" font-size="9.5">Read-Only Layer (125 MB)</text>

      <rect x="0" y="84" width="210" height="34" rx="5" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
      <text x="105" y="99" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10.5" font-weight="700">Layer 1: Alpine Linux Base OS</text>
      <text x="105" y="112" text-anchor="middle" fill="#a5b4fc" font-size="9.5">Read-Only Layer (8 MB)</text>

      <rect x="0" y="124" width="210" height="22" rx="4" fill="#090d16" stroke="#475569" />
      <text x="105" y="139" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="10">sha256:9f86d081884c7d659a...</text>
    </g>

    <!-- Properties Footer -->
    <text x="125" y="254" text-anchor="middle" fill="#f3e8ff" font-size="11.5" font-weight="700">State: 100% Immutable (Read-Only)</text>
    <text x="125" y="274" text-anchor="middle" fill="#94a3b8" font-size="11">Stored in Registry (Docker Hub/ECR)</text>
    <text x="125" y="294" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="10.5">Tag: spring-api:1.0.0 (~175 MB)</text>
  </g>

  <!-- ========================================================= -->
  <!-- TRANSITION 2: docker run (1-to-Many Instantiation)        -->
  <!-- ========================================================= -->
  <g>
    <path d="M 620 200 L 660 200 L 660 140 L 695 140" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)" />
    <path d="M 620 230 L 695 230" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)" />
    <path d="M 620 260 L 660 260 L 660 320 L 695 320" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)" />
    
    <rect x="622" y="165" width="72" height="24" rx="4" fill="#064e3b" stroke="#34d399" />
    <text x="658" y="181" text-anchor="middle" fill="#d1fae5" font-family="monospace" font-size="10" font-weight="700">docker run</text>
  </g>

  <!-- ========================================================= -->
  <!-- STAGE 3: CONTAINERS (LIVE RUNNING INSTANCES)              -->
  <!-- ========================================================= -->
  <g transform="translate(705, 75)">
    <rect width="245" height="310" rx="10" fill="url(#greenBox)" stroke="#10b981" stroke-width="1.5" />

    <!-- Header Badge -->
    <rect x="16" y="14" width="213" height="26" rx="5" fill="#059669" />
    <text x="122" y="31" text-anchor="middle" fill="#ecfdf5" font-size="12" font-weight="700" letter-spacing="0.5">
      3. CONTAINERS (INSTANCES)
    </text>

    <!-- OOP Analogy Pill -->
    <rect x="20" y="50" width="205" height="22" rx="4" fill="#1e293b" stroke="#475569" />
    <text x="122" y="65" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">
      OOP Analogy: new SpringApp() in RAM
    </text>

    <!-- Container Instance 1 -->
    <rect x="18" y="82" width="209" height="62" rx="6" fill="#090d16" stroke="#34d399" stroke-width="1.2" />
    <circle cx="32" cy="98" r="4" fill="#34d399" />
    <text x="42" y="102" fill="#ecfdf5" font-family="monospace" font-size="11" font-weight="700">Container #1 (Port 8081)</text>
    <text x="30" y="119" fill="#6ee7b7" font-family="monospace" font-size="10">+ Thin R/W Layer + PID 1 (java)</text>
    <text x="30" y="134" fill="#94a3b8" font-size="9.5">Shares Read-Only Image Layers</text>

    <!-- Container Instance 2 -->
    <rect x="18" y="152" width="209" height="62" rx="6" fill="#090d16" stroke="#34d399" stroke-width="1.2" />
    <circle cx="32" cy="168" r="4" fill="#34d399" />
    <text x="42" y="172" fill="#ecfdf5" font-family="monospace" font-size="11" font-weight="700">Container #2 (Port 8082)</text>
    <text x="30" y="189" fill="#6ee7b7" font-family="monospace" font-size="10">+ Thin R/W Layer + PID 1 (java)</text>
    <text x="30" y="204" fill="#94a3b8" font-size="9.5">Shares Read-Only Image Layers</text>

    <!-- Container Instance 3 -->
    <rect x="18" y="222" width="209" height="62" rx="6" fill="#090d16" stroke="#34d399" stroke-width="1.2" />
    <circle cx="32" cy="238" r="4" fill="#34d399" />
    <text x="42" y="242" fill="#ecfdf5" font-family="monospace" font-size="11" font-weight="700">Container #3 (Port 8083)</text>
    <text x="30" y="259" fill="#6ee7b7" font-family="monospace" font-size="10">+ Thin R/W Layer + PID 1 (java)</text>
    <text x="30" y="274" fill="#94a3b8" font-size="9.5">Isolated Memory &amp; Network IP</text>

    <text x="122" y="300" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">State: Ephemeral Live Processes</text>
  </g>
</svg>