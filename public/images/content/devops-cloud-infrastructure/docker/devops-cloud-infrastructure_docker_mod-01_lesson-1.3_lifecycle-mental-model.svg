<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3e5199" />
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#167e6c" />
    </marker>
  </defs>

  <style>
    /* Default: Light Mode (Clean White Canvas) */
    svg {
      --diag-canvas: #ffffff;
      --diag-header-title: #111a4a;
      --diag-divider: #cbd5e1;

      --diag-card-bg: #f8fafc;
      --diag-card-inner: #ffffff;
      --diag-card-border: #cbd5e1;

      --diag-s1-border: #3e5199;
      --diag-s1-header: #3e5199;
      --diag-s2-border: #1b2d70;
      --diag-s2-header: #1b2d70;
      --diag-s3-border: #167e6c;
      --diag-s3-header: #167e6c;

      --diag-text-main: #111a4a;
      --diag-text-dim: #64748b;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #12161e;
      --diag-header-title: #788cd4;
      --diag-divider: #243049;

      --diag-card-bg: #171d2b;
      --diag-card-inner: #131b2a;
      --diag-card-border: #243049;

      --diag-s1-border: #3e5199;
      --diag-s1-header: #3e5199;
      --diag-s2-border: #1b2d70;
      --diag-s2-header: #111a4a;
      --diag-s3-border: #167e6c;
      --diag-s3-header: #167e6c;

      --diag-text-main: #f8fafc;
      --diag-text-dim: #94a3b8;
    }

    /* Standalone SVG Viewer */
    @media (prefers-color-scheme: dark) {
      :root:not(html) {
        --diag-canvas: #12161e;
        --diag-header-title: #788cd4;
        --diag-divider: #243049;

        --diag-card-bg: #171d2b;
        --diag-card-inner: #131b2a;
        --diag-card-border: #243049;

        --diag-s1-border: #3e5199;
        --diag-s1-header: #3e5199;
        --diag-s2-border: #1b2d70;
        --diag-s2-header: #111a4a;
        --diag-s3-border: #167e6c;
        --diag-s3-header: #167e6c;

        --diag-text-main: #f8fafc;
        --diag-text-dim: #94a3b8;
      }
    }
  </style>

  <!-- Main Background -->
  <rect width="980" height="420" rx="12" fill="var(--diag-canvas)" />

  <!-- Title -->
  <text x="490" y="36" text-anchor="middle" fill="var(--diag-header-title)" font-size="16" font-weight="700" letter-spacing="0.5">
    THE DOCKER LIFECYCLE: FROM BLUEPRINT TO RUNNING SPRING BOOT CONTAINERS
  </text>
  <line x1="50" y1="52" x2="930" y2="52" stroke="var(--diag-divider)" stroke-width="1" />

  <!-- ========================================================= -->
  <!-- STAGE 1: DOCKERFILE (THE BLUEPRINT)                       -->
  <!-- ========================================================= -->
  <g transform="translate(30, 75)">
    <rect width="240" height="310" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-s1-border)" stroke-width="1.5" filter="url(#shadow)" />
    
    <!-- Header Badge -->
    <rect x="16" y="14" width="208" height="26" rx="5" fill="var(--diag-s1-header)" />
    <text x="120" y="31" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700" letter-spacing="0.5">
      1. DOCKERFILE (BLUEPRINT)
    </text>

    <!-- OOP Analogy Pill -->
    <rect x="24" y="50" width="192" height="22" rx="4" fill="var(--diag-card-inner)" stroke="var(--diag-card-border)" />
    <text x="120" y="65" text-anchor="middle" fill="#3e5199" font-size="11" font-weight="600">
      OOP Analogy: .java Source File
    </text>

    <!-- Code Snippet Box -->
    <rect x="18" y="84" width="204" height="145" rx="6" fill="var(--diag-card-inner)" stroke="var(--diag-card-border)" />
    <text x="28" y="106" fill="var(--diag-text-dim)" font-family="monospace" font-size="10.5"># Spring Boot Blueprint</text>
    <text x="28" y="126" fill="#3e5199" font-family="monospace" font-size="11" font-weight="700">FROM</text>
    <text x="64" y="126" fill="var(--diag-text-main)" font-family="monospace" font-size="10.5"> temurin:21-jre</text>
    <text x="28" y="146" fill="#3e5199" font-family="monospace" font-size="11" font-weight="700">WORKDIR</text>
    <text x="86" y="146" fill="var(--diag-text-main)" font-family="monospace" font-size="10.5"> /app</text>
    <text x="28" y="166" fill="#3e5199" font-family="monospace" font-size="11" font-weight="700">COPY</text>
    <text x="64" y="166" fill="var(--diag-text-main)" font-family="monospace" font-size="10.5"> target/*.jar app.jar</text>
    <text x="28" y="186" fill="#1b2d70" font-family="monospace" font-size="11" font-weight="700">EXPOSE</text>
    <text x="78" y="186" fill="var(--diag-text-main)" font-family="monospace" font-size="10.5"> 8080</text>
    <text x="28" y="206" fill="#167e6c" font-family="monospace" font-size="11" font-weight="700">ENTRYPOINT</text>
    <text x="28" y="220" fill="var(--diag-text-dim)" font-family="monospace" font-size="9.5">["java","-jar","app.jar"]</text>

    <!-- Properties Footer -->
    <text x="120" y="254" text-anchor="middle" fill="var(--diag-text-main)" font-size="11.5" font-weight="600">State: Editable Text File</text>
    <text x="120" y="274" text-anchor="middle" fill="var(--diag-text-dim)" font-size="11">Lives in Git Repository</text>
    <text x="120" y="294" text-anchor="middle" fill="#3e5199" font-family="monospace" font-size="10.5">Size: ~1 KB on disk</text>
  </g>

  <!-- ========================================================= -->
  <!-- TRANSITION 1: docker build                                -->
  <!-- ========================================================= -->
  <g>
    <line x1="275" y1="230" x2="355" y2="230" stroke="#3e5199" stroke-width="2.5" marker-end="url(#arrowBlue)" />
    <rect x="278" y="192" width="76" height="24" rx="4" fill="var(--diag-card-inner)" stroke="#3e5199" />
    <text x="316" y="208" text-anchor="middle" fill="#3e5199" font-family="monospace" font-size="10" font-weight="700">docker build</text>
    <text x="316" y="250" text-anchor="middle" fill="var(--diag-text-dim)" font-size="10">Compiles</text>
    <text x="316" y="263" text-anchor="middle" fill="var(--diag-text-dim)" font-size="10">Layers</text>
  </g>

  <!-- ========================================================= -->
  <!-- STAGE 2: DOCKER IMAGE (IMMUTABLE ARTIFACT)                -->
  <!-- ========================================================= -->
  <g transform="translate(365, 75)">
    <rect width="250" height="310" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-s2-border)" stroke-width="1.5" filter="url(#shadow)" />

    <!-- Header Badge -->
    <rect x="16" y="14" width="218" height="26" rx="5" fill="var(--diag-s2-header)" />
    <text x="125" y="31" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700" letter-spacing="0.5">
      2. DOCKER IMAGE (ARTIFACT)
    </text>

    <!-- OOP Analogy Pill -->
    <rect x="20" y="50" width="210" height="22" rx="4" fill="var(--diag-card-inner)" stroke="var(--diag-card-border)" />
    <text x="125" y="65" text-anchor="middle" fill="#1b2d70" font-size="11" font-weight="600">
      OOP Analogy: Compiled Class / Bytecode
    </text>

    <!-- Layered Stack Visual -->
    <g transform="translate(20, 84)">
      <rect x="0" y="0" width="210" height="34" rx="5" fill="var(--diag-card-inner)" stroke="#1b2d70" stroke-width="1.2" />
      <text x="105" y="15" text-anchor="middle" fill="#1b2d70" font-family="monospace" font-size="10" font-weight="700">Layer 3: app.jar (Spring Boot)</text>
      <text x="105" y="28" text-anchor="middle" fill="var(--diag-text-dim)" font-size="9.5">Read-Only Layer (42 MB)</text>

      <rect x="0" y="42" width="210" height="34" rx="5" fill="var(--diag-card-inner)" stroke="#3e5199" stroke-width="1.2" />
      <text x="105" y="57" text-anchor="middle" fill="#3e5199" font-family="monospace" font-size="10" font-weight="700">Layer 2: Eclipse Temurin JRE 21</text>
      <text x="105" y="70" text-anchor="middle" fill="var(--diag-text-dim)" font-size="9.5">Read-Only Layer (125 MB)</text>

      <rect x="0" y="84" width="210" height="34" rx="5" fill="var(--diag-card-inner)" stroke="#111a4a" stroke-width="1.2" />
      <text x="105" y="99" text-anchor="middle" fill="#111a4a" font-family="monospace" font-size="10" font-weight="700">Layer 1: Alpine Linux Base OS</text>
      <text x="105" y="112" text-anchor="middle" fill="var(--diag-text-dim)" font-size="9.5">Read-Only Layer (8 MB)</text>

      <rect x="0" y="124" width="210" height="22" rx="4" fill="var(--diag-card-inner)" stroke="var(--diag-card-border)" />
      <text x="105" y="139" text-anchor="middle" fill="var(--diag-text-dim)" font-family="monospace" font-size="10">sha256:9f86d081884c7d659a...</text>
    </g>

    <!-- Properties Footer -->
    <text x="125" y="254" text-anchor="middle" fill="var(--diag-text-main)" font-size="11.5" font-weight="700">State: 100% Immutable (Read-Only)</text>
    <text x="125" y="274" text-anchor="middle" fill="var(--diag-text-dim)" font-size="11">Stored in Registry (Docker Hub/ECR)</text>
    <text x="125" y="294" text-anchor="middle" fill="#1b2d70" font-family="monospace" font-size="10.5">Tag: spring-api:1.0.0 (~175 MB)</text>
  </g>

  <!-- ========================================================= -->
  <!-- TRANSITION 2: docker run (1-to-Many Instantiation)        -->
  <!-- ========================================================= -->
  <g>
    <path d="M 620 200 L 660 200 L 660 140 L 695 140" fill="none" stroke="#167e6c" stroke-width="2" marker-end="url(#arrowTeal)" />
    <path d="M 620 230 L 695 230" fill="none" stroke="#167e6c" stroke-width="2" marker-end="url(#arrowTeal)" />
    <path d="M 620 260 L 660 260 L 660 320 L 695 320" fill="none" stroke="#167e6c" stroke-width="2" marker-end="url(#arrowTeal)" />
    
    <rect x="622" y="165" width="72" height="24" rx="4" fill="var(--diag-card-inner)" stroke="#167e6c" />
    <text x="658" y="181" text-anchor="middle" fill="#167e6c" font-family="monospace" font-size="10" font-weight="700">docker run</text>
  </g>

  <!-- ========================================================= -->
  <!-- STAGE 3: CONTAINERS (LIVE RUNNING INSTANCES)              -->
  <!-- ========================================================= -->
  <g transform="translate(705, 75)">
    <rect width="245" height="310" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-s3-border)" stroke-width="1.5" filter="url(#shadow)" />

    <!-- Header Badge -->
    <rect x="16" y="14" width="213" height="26" rx="5" fill="var(--diag-s3-header)" />
    <text x="122" y="31" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700" letter-spacing="0.5">
      3. CONTAINERS (INSTANCES)
    </text>

    <!-- OOP Analogy Pill -->
    <rect x="20" y="50" width="205" height="22" rx="4" fill="var(--diag-card-inner)" stroke="var(--diag-card-border)" />
    <text x="122" y="65" text-anchor="middle" fill="#167e6c" font-size="11" font-weight="600">
      OOP Analogy: new SpringApp() in RAM
    </text>

    <!-- Container Instance 1 -->
    <rect x="18" y="82" width="209" height="62" rx="6" fill="var(--diag-card-inner)" stroke="var(--diag-s3-border)" stroke-width="1.2" />
    <circle cx="32" cy="98" r="4" fill="#167e6c" />
    <text x="42" y="102" fill="var(--diag-text-main)" font-family="monospace" font-size="10.5" font-weight="700">Container #1 (Port 8081)</text>
    <text x="30" y="119" fill="#167e6c" font-family="monospace" font-size="9.5">+ Thin R/W Layer + PID 1 (java)</text>
    <text x="30" y="134" fill="var(--diag-text-dim)" font-size="9.5">Shares Read-Only Image Layers</text>

    <!-- Container Instance 2 -->
    <rect x="18" y="152" width="209" height="62" rx="6" fill="var(--diag-card-inner)" stroke="var(--diag-s3-border)" stroke-width="1.2" />
    <circle cx="32" cy="168" r="4" fill="#167e6c" />
    <text x="42" y="172" fill="var(--diag-text-main)" font-family="monospace" font-size="10.5" font-weight="700">Container #2 (Port 8082)</text>
    <text x="30" y="189" fill="#167e6c" font-family="monospace" font-size="9.5">+ Thin R/W Layer + PID 1 (java)</text>
    <text x="30" y="204" fill="var(--diag-text-dim)" font-size="9.5">Shares Read-Only Image Layers</text>

    <!-- Container Instance 3 -->
    <rect x="18" y="222" width="209" height="62" rx="6" fill="var(--diag-card-inner)" stroke="var(--diag-s3-border)" stroke-width="1.2" />
    <circle cx="32" cy="238" r="4" fill="#167e6c" />
    <text x="42" y="242" fill="var(--diag-text-main)" font-family="monospace" font-size="10.5" font-weight="700">Container #3 (Port 8083)</text>
    <text x="30" y="259" fill="#167e6c" font-family="monospace" font-size="9.5">+ Thin R/W Layer + PID 1 (java)</text>
    <text x="30" y="274" fill="var(--diag-text-dim)" font-size="9.5">Isolated Memory &amp; Network IP</text>

    <text x="122" y="300" text-anchor="middle" fill="#167e6c" font-size="11" font-weight="600">State: Ephemeral Live Processes</text>
  </g>
</svg>
