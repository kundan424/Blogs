<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    /* Default: Light Mode (Clean White Canvas) */
    svg {
      --diag-canvas: #ffffff;
      --diag-header-title: #111a4a;
      --diag-divider: #cbd5e1;

      --diag-card-bg: #f8fafc;
      --diag-card-inner: #ffffff;
      --diag-card-border: #cbd5e1;

      --diag-rw-border: #167e6c;
      --diag-rw-badge: #167e6c;
      --diag-rw-title: #167e6c;

      --diag-l4-border: #3e5199;
      --diag-l4-badge: #3e5199;

      --diag-l3-border: #1b2d70;
      --diag-l3-badge: #1b2d70;

      --diag-l2-border: #3e5199;
      --diag-l2-badge: #3e5199;

      --diag-l1-border: #111a4a;
      --diag-l1-badge: #111a4a;

      --diag-text-main: #111a4a;
      --diag-text-dim: #64748b;
      --diag-bottom-bg: #f1f5f9;
      --diag-bottom-border: #cbd5e1;
    }

    /* Dark Mode (Web Application) */
    html.dark svg, .dark svg {
      --diag-canvas: #12161e;
      --diag-header-title: #788cd4;
      --diag-divider: #243049;

      --diag-card-bg: #171d2b;
      --diag-card-inner: #131b2a;
      --diag-card-border: #243049;

      --diag-rw-border: #167e6c;
      --diag-rw-badge: #167e6c;
      --diag-rw-title: #2dd4bf;

      --diag-l4-border: #3e5199;
      --diag-l4-badge: #3e5199;

      --diag-l3-border: #1b2d70;
      --diag-l3-badge: #1b2d70;

      --diag-l2-border: #3e5199;
      --diag-l2-badge: #3e5199;

      --diag-l1-border: #3e5199;
      --diag-l1-badge: #111a4a;

      --diag-text-main: #f8fafc;
      --diag-text-dim: #94a3b8;
      --diag-bottom-bg: #131b2a;
      --diag-bottom-border: #243049;
    }

    /* Standalone SVG Viewer */
    @media (prefers-color-scheme: dark) {
      :root:not(html) {
        --diag-canvas: #12161e;
        --diag-header-title: #788cd4;
        --diag-divider: #243049;

        --diag-card-bg: #171d2b;
        --diag-card-inner: #131b2a;
        --diag-card-border: #243049;

        --diag-rw-border: #167e6c;
        --diag-rw-badge: #167e6c;
        --diag-rw-title: #2dd4bf;

        --diag-l4-border: #3e5199;
        --diag-l4-badge: #3e5199;

        --diag-l3-border: #1b2d70;
        --diag-l3-badge: #1b2d70;

        --diag-l2-border: #3e5199;
        --diag-l2-badge: #3e5199;

        --diag-l1-border: #3e5199;
        --diag-l1-badge: #111a4a;

        --diag-text-main: #f8fafc;
        --diag-text-dim: #94a3b8;
        --diag-bottom-bg: #131b2a;
        --diag-bottom-border: #243049;
      }
    }
  </style>

  <!-- Background -->
  <rect width="960" height="440" rx="12" fill="var(--diag-canvas)" />

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" fill="var(--diag-header-title)" font-size="16" font-weight="700" letter-spacing="0.5">
    DOCKER IMAGE LAYERS: UNION FILE SYSTEM (OverlayFS) ARCHITECTURE
  </text>
  <line x1="50" y1="48" x2="910" y2="48" stroke="var(--diag-divider)" stroke-width="1" />

  <!-- ========================================================= -->
  <!-- LEFT COLUMN: STACKED LAYERS VISUAL                        -->
  <!-- ========================================================= -->
  <g transform="translate(36, 68)">
    <!-- Container R/W Layer (Top) -->
    <rect x="0" y="0" width="540" height="58" rx="8" fill="var(--diag-card-bg)" stroke="var(--diag-rw-border)" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)" />
    <rect x="12" y="10" width="130" height="20" rx="4" fill="var(--diag-rw-badge)" />
    <text x="77" y="24" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">UPPERDIR (R/W)</text>
    <text x="152" y="24" fill="var(--diag-rw-title)" font-size="12.5" font-weight="700">Container Layer (Thin Read-Write)</text>
    <text x="14" y="46" fill="var(--diag-text-dim)" font-size="11">Ephemeral: modified /tmp files, local logs, deleted on container removal (0-5 MB)</text>

    <!-- Bracket Indicator for R/W -->
    <line x1="550" y1="8" x2="550" y2="50" stroke="#167e6c" stroke-width="2" />
    <text x="562" y="33" fill="#167e6c" font-size="11" font-weight="600">Writable per container</text>

    <!-- Layer 4: Application Code -->
    <rect x="0" y="68" width="540" height="52" rx="6" fill="var(--diag-card-inner)" stroke="var(--diag-l4-border)" stroke-width="1.2" />
    <rect x="12" y="78" width="60" height="18" rx="3" fill="var(--diag-l4-badge)" />
    <text x="42" y="91" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9.5" font-weight="700">LAYER 4</text>
    <text x="82" y="91" fill="var(--diag-text-main)" font-family="monospace" font-size="11" font-weight="600">COPY target/app.jar /app/app.jar</text>
    <text x="440" y="91" fill="#3e5199" font-family="monospace" font-size="10.5">~42 MB [diff]</text>
    <text x="14" y="110" fill="var(--diag-text-dim)" font-size="10">Content-addressable SHA-256 digest: sha256:7b1e8902c3fa...</text>

    <!-- Layer 3: System User / WorkingDir -->
    <rect x="0" y="128" width="540" height="52" rx="6" fill="var(--diag-card-inner)" stroke="var(--diag-l3-border)" stroke-width="1.2" />
    <rect x="12" y="138" width="60" height="18" rx="3" fill="var(--diag-l3-badge)" />
    <text x="42" y="151" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9.5" font-weight="700">LAYER 3</text>
    <text x="82" y="151" fill="var(--diag-text-main)" font-family="monospace" font-size="11" font-weight="600">RUN addgroup -S spring &amp;&amp; adduser -S spring</text>
    <text x="450" y="151" fill="#1b2d70" font-family="monospace" font-size="10.5">~12 KB [diff]</text>
    <text x="14" y="170" fill="var(--diag-text-dim)" font-size="10">System group /etc/group and /etc/passwd entries created</text>

    <!-- Layer 2: Java Runtime -->
    <rect x="0" y="188" width="540" height="52" rx="6" fill="var(--diag-card-inner)" stroke="var(--diag-l2-border)" stroke-width="1.2" />
    <rect x="12" y="198" width="60" height="18" rx="3" fill="var(--diag-l2-badge)" />
    <text x="42" y="211" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9.5" font-weight="700">LAYER 2</text>
    <text x="82" y="211" fill="var(--diag-text-main)" font-family="monospace" font-size="11" font-weight="600">Eclipse Temurin JRE 21 Runtime</text>
    <text x="440" y="211" fill="#3e5199" font-family="monospace" font-size="10.5">~125 MB [diff]</text>
    <text x="14" y="230" fill="var(--diag-text-dim)" font-size="10">JVM binaries, libjvm.so, core Java class libraries (shared across instances)</text>

    <!-- Layer 1: Base Alpine OS -->
    <rect x="0" y="248" width="540" height="52" rx="6" fill="var(--diag-card-inner)" stroke="var(--diag-l1-border)" stroke-width="1.2" />
    <rect x="12" y="258" width="60" height="18" rx="3" fill="var(--diag-l1-badge)" />
    <text x="42" y="271" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9.5" font-weight="700">LAYER 1</text>
    <text x="82" y="271" fill="var(--diag-text-main)" font-family="monospace" font-size="11" font-weight="600">FROM eclipse-temurin:21-jre-alpine (Alpine 3.19)</text>
    <text x="450" y="271" fill="#111a4a" font-family="monospace" font-size="10.5">~7.8 MB</text>
    <text x="14" y="290" fill="var(--diag-text-dim)" font-size="10">Minimal rootfs: /bin, /lib, /etc, BusyBox utilities (musl libc)</text>

    <!-- Bracket Indicator for Lowerdir -->
    <line x1="550" y1="74" x2="550" y2="294" stroke="#1b2d70" stroke-width="2" />
    <text x="562" y="180" fill="#1b2d70" font-size="11" font-weight="600">LOWERDIR: Read-Only Image Layers</text>
    <text x="562" y="196" fill="var(--diag-text-dim)" font-size="10">Immutable &amp; Shared by ALL containers</text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT COLUMN: MERGED VIEW & COPY-ON-WRITE BOX             -->
  <!-- ========================================================= -->
  <g transform="translate(670, 68)">
    <rect width="254" height="302" rx="10" fill="var(--diag-card-bg)" stroke="var(--diag-card-border)" stroke-width="1.5" filter="url(#shadow)" />

    <!-- Merged View Box -->
    <rect x="14" y="14" width="226" height="130" rx="8" fill="var(--diag-card-inner)" stroke="#3e5199" stroke-width="1.2" />
    <text x="127" y="36" text-anchor="middle" fill="#3e5199" font-size="12" font-weight="700">MERGED VIEW (Container)</text>
    <text x="127" y="54" text-anchor="middle" fill="var(--diag-text-dim)" font-size="10.5">Unified virtual directory seen by PID 1</text>
    <rect x="24" y="66" width="206" height="66" rx="4" fill="var(--diag-card-bg)" stroke="var(--diag-card-border)" stroke-width="0.8" />
    <text x="34" y="84" fill="var(--diag-text-main)" font-family="monospace" font-size="10">/app/app.jar</text>
    <text x="34" y="99" fill="var(--diag-text-main)" font-family="monospace" font-size="10">/opt/java/openjdk/</text>
    <text x="34" y="114" fill="var(--diag-text-main)" font-family="monospace" font-size="10">/bin/sh, /etc/passwd</text>
    <text x="34" y="126" fill="#167e6c" font-family="monospace" font-size="9.5">+ container temp files</text>

    <!-- Copy-on-Write (CoW) Principle -->
    <rect x="14" y="156" width="226" height="132" rx="8" fill="var(--diag-card-inner)" stroke="#167e6c" stroke-width="1.2" />
    <text x="127" y="178" text-anchor="middle" fill="#167e6c" font-size="12" font-weight="700">COPY-ON-WRITE (CoW)</text>
    <text x="24" y="198" fill="var(--diag-text-main)" font-size="10.5" font-weight="600">• Reading files:</text>
    <text x="30" y="213" fill="var(--diag-text-dim)" font-size="10">Directly accessed from read-only image layers.</text>
    <text x="24" y="233" fill="var(--diag-text-main)" font-size="10.5" font-weight="600">• Modifying an image file:</text>
    <text x="30" y="248" fill="var(--diag-text-dim)" font-size="10">File is copied UP into R/W layer before write occurs.</text>
    <text x="24" y="272" fill="#167e6c" font-size="10" font-weight="600">Result: Original image is NEVER mutated!</text>
  </g>

  <!-- Bottom Explanatory Strip -->
  <rect x="36" y="380" width="888" height="42" rx="8" fill="var(--diag-bottom-bg)" stroke="var(--diag-bottom-border)" stroke-width="1" />
  <text x="480" y="405" text-anchor="middle" fill="var(--diag-text-main)" font-size="11.5">
    <tspan fill="#3e5199" font-weight="700">Key Takeaway:</tspan> 10 Spring Boot containers running the same image consume <tspan fill="#167e6c" font-weight="700">175 MB total image disk space</tspan> + 10 tiny R/W layers, not 1,750 MB!
  </text>
</svg>
