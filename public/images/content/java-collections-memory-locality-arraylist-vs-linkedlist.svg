<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f131f" />
      <stop offset="100%" stop-color="#090c15" />
    </linearGradient>
    <linearGradient id="arrayBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142823" />
      <stop offset="100%" stop-color="#0d1b17" />
    </linearGradient>
    <linearGradient id="nodeBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1d1f" />
      <stop offset="100%" stop-color="#1d1112" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <style>
    .header-tag { font-family: ui-monospace, SFMono-Regular, "IBM Plex Mono", Menlo, monospace; font-size: 11px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
    .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .panel-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; font-weight: 600; fill: #f8fafc; }
    .badge-hit { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; fill: #34d399; }
    .badge-miss { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; fill: #f87171; }
    .mono-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #cbd5e1; }
    .mono-dim { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #64748b; }
    .arrow-line-green { stroke: #34d399; stroke-width: 1.5; fill: none; }
    .arrow-line-red { stroke: #f87171; stroke-width: 1.5; fill: none; }
    .cache-bracket { stroke: #38bdf8; stroke-width: 1.8; fill: none; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="960" height="480" rx="14" fill="url(#bgCanvas)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Diagram Title Header -->
  <text x="35" y="34" class="header-tag">HARDWARE MEMORY LAYOUT &amp; CPU CACHE TRAVERSAL</text>
  <text x="35" y="52" class="header-sub">ArrayList Contiguous Memory Locality vs. LinkedList Pointer Chasing</text>

  <!-- ========================================================================= -->
  <!-- PANEL A: ARRAYLIST (CONTIGUOUS 64-BYTE CACHE LINE) -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 75)">
    <rect width="890" height="165" rx="10" fill="#0d1424" stroke="#1e293b" />
    
    <!-- Header row -->
    <text x="20" y="28" class="panel-title">ArrayList: Contiguous Memory Buffer (Object[] elementData)</text>
    <rect x="670" y="14" width="200" height="22" rx="4" fill="#062e24" stroke="#059669" />
    <text x="770" y="29" text-anchor="middle" class="badge-hit">99% L1/L2 CACHE HIT RATE</text>

    <!-- Cache Line Bracket -->
    <path d="M 20 54 L 870 54" class="cache-bracket" stroke-dasharray="3,3" />
    <path d="M 20 48 L 20 60" class="cache-bracket" />
    <path d="M 870 48 L 870 60" class="cache-bracket" />
    <text x="445" y="48" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#38bdf8" font-weight="600">
      ◄─── Single 64-Byte CPU Cache Line (Prefetches multiple elements concurrently into L1 Cache) ───►
    </text>

    <!-- Contiguous Slots -->
    <g transform="translate(20, 70)">
      <!-- Slot 0 -->
      <g transform="translate(0, 0)">
        <rect width="160" height="54" rx="6" fill="url(#arrayBox)" stroke="#34d399" stroke-width="1.2" />
        <text x="12" y="22" class="mono-dim">Index [0] • 4B Ref</text>
        <text x="12" y="40" class="mono-code" font-weight="600">ObjRef_A ──►</text>
      </g>
      <!-- Slot 1 -->
      <g transform="translate(170, 0)">
        <rect width="160" height="54" rx="6" fill="url(#arrayBox)" stroke="#34d399" stroke-width="1.2" />
        <text x="12" y="22" class="mono-dim">Index [1] • 4B Ref</text>
        <text x="12" y="40" class="mono-code" font-weight="600">ObjRef_B ──►</text>
      </g>
      <!-- Slot 2 -->
      <g transform="translate(340, 0)">
        <rect width="160" height="54" rx="6" fill="url(#arrayBox)" stroke="#34d399" stroke-width="1.2" />
        <text x="12" y="22" class="mono-dim">Index [2] • 4B Ref</text>
        <text x="12" y="40" class="mono-code" font-weight="600">ObjRef_C ──►</text>
      </g>
      <!-- Slot 3 -->
      <g transform="translate(510, 0)">
        <rect width="160" height="54" rx="6" fill="url(#arrayBox)" stroke="#34d399" stroke-width="1.2" />
        <text x="12" y="22" class="mono-dim">Index [3] • 4B Ref</text>
        <text x="12" y="40" class="mono-code" font-weight="600">ObjRef_D ──►</text>
      </g>
      <!-- Slot 4 (Empty slot) -->
      <g transform="translate(680, 0)">
        <rect width="170" height="54" rx="6" fill="#111624" stroke="#334155" stroke-dasharray="4,4" />
        <text x="12" y="22" class="mono-dim">Index [4] • Unused</text>
        <text x="12" y="40" class="mono-dim">null (Amortized 1.5×)</text>
      </g>
    </g>

    <!-- Bottom summary line -->
    <text x="22" y="148" class="header-sub" font-size="11px">
      Sequential access cost: <tspan fill="#34d399" font-weight="600">O(1) direct pointer offset</tspan> [base + index × 4B]. Hardware prefetcher anticipates next stride with near zero latency.
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL B: LINKEDLIST (SCATTERED HEAP NODES & POINTER CHASING) -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 260)">
    <rect width="890" height="195" rx="10" fill="#0d1424" stroke="#1e293b" />
    
    <!-- Header row -->
    <text x="20" y="28" class="panel-title">LinkedList: Dispersed Heap Nodes (24 Bytes Metadata Overhead per Node)</text>
    <rect x="670" y="14" width="200" height="22" rx="4" fill="#3b1115" stroke="#ef4444" />
    <text x="770" y="29" text-anchor="middle" class="badge-miss">FREQUENT CPU CACHE MISSES</text>

    <!-- Node 1 -->
    <g transform="translate(30, 48)">
      <rect width="210" height="92" rx="7" fill="url(#nodeBox)" stroke="#f87171" stroke-width="1.2" />
      <text x="10" y="18" class="mono-dim">Node A @ Heap Address 0x1A40</text>
      <rect x="10" y="28" width="190" height="54" rx="4" fill="#140c0e" stroke="#381c20" />
      <text x="20" y="45" class="mono-code" font-size="11px">prev: <tspan fill="#64748b">null</tspan></text>
      <text x="20" y="60" class="mono-code" font-size="11px">item: <tspan fill="#fbbf24">ObjRef_A</tspan></text>
      <text x="20" y="74" class="mono-code" font-size="11px">next: <tspan fill="#38bdf8">0x8F20 (Node B)</tspan></text>
    </g>

    <!-- Forward & Backward Pointers Node 1 <-> Node 2 -->
    <path d="M 240 82 L 340 82" class="arrow-line-red" marker-end="url(#arrowRed)" />
    <text x="290" y="74" text-anchor="middle" font-family="monospace" font-size="9" fill="#f87171">next ──►</text>
    <path d="M 340 105 L 240 105" class="arrow-line-red" marker-end="url(#arrowRed)" />
    <text x="290" y="120" text-anchor="middle" font-family="monospace" font-size="9" fill="#f87171">◄── prev</text>

    <!-- Node 2 -->
    <g transform="translate(340, 48)">
      <rect width="210" height="92" rx="7" fill="url(#nodeBox)" stroke="#f87171" stroke-width="1.2" />
      <text x="10" y="18" class="mono-dim">Node B @ Heap Address 0x8F20</text>
      <rect x="10" y="28" width="190" height="54" rx="4" fill="#140c0e" stroke="#381c20" />
      <text x="20" y="45" class="mono-code" font-size="11px">prev: <tspan fill="#38bdf8">0x1A40 (Node A)</tspan></text>
      <text x="20" y="60" class="mono-code" font-size="11px">item: <tspan fill="#fbbf24">ObjRef_B</tspan></text>
      <text x="20" y="74" class="mono-code" font-size="11px">next: <tspan fill="#38bdf8">0x3C10 (Node C)</tspan></text>
    </g>

    <!-- Forward & Backward Pointers Node 2 <-> Node 3 -->
    <path d="M 550 82 L 650 82" class="arrow-line-red" marker-end="url(#arrowRed)" />
    <text x="600" y="74" text-anchor="middle" font-family="monospace" font-size="9" fill="#f87171">next ──►</text>
    <path d="M 650 105 L 550 105" class="arrow-line-red" marker-end="url(#arrowRed)" />
    <text x="600" y="120" text-anchor="middle" font-family="monospace" font-size="9" fill="#f87171">◄── prev</text>

    <!-- Node 3 -->
    <g transform="translate(650, 48)">
      <rect width="210" height="92" rx="7" fill="url(#nodeBox)" stroke="#f87171" stroke-width="1.2" />
      <text x="10" y="18" class="mono-dim">Node C @ Heap Address 0x3C10</text>
      <rect x="10" y="28" width="190" height="54" rx="4" fill="#140c0e" stroke="#381c20" />
      <text x="20" y="45" class="mono-code" font-size="11px">prev: <tspan fill="#38bdf8">0x8F20 (Node B)</tspan></text>
      <text x="20" y="60" class="mono-code" font-size="11px">item: <tspan fill="#fbbf24">ObjRef_C</tspan></text>
      <text x="20" y="74" class="mono-code" font-size="11px">next: <tspan fill="#64748b">null</tspan></text>
    </g>

    <!-- Bottom summary line -->
    <text x="22" y="174" class="header-sub" font-size="11px">
      Traversal penalty: Every step incurs pointer dereferencing across non-contiguous heap regions, stalling CPU execution on main memory fetches.
    </text>
  </g>
</svg>
