<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f131f" />
      <stop offset="100%" stop-color="#090c15" />
    </linearGradient>
    <linearGradient id="lockSingleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a1a" />
      <stop offset="100%" stop-color="#2a0d0d" />
    </linearGradient>
    <linearGradient id="lockDualGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142823" />
      <stop offset="100%" stop-color="#0d1b17" />
    </linearGradient>
    <linearGradient id="threadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <style>
    .header-main { font-family: ui-monospace, SFMono-Regular, "IBM Plex Mono", Menlo, monospace; font-size: 11px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
    .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .panel-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .badge-warn { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; font-weight: 700; fill: #f87171; letter-spacing: 0.5px; }
    .badge-pass { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; font-weight: 700; fill: #34d399; letter-spacing: 0.5px; }
    .box-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; font-weight: 600; fill: #f1f5f9; }
    .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #94a3b8; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="960" height="520" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Diagram Title Header -->
  <text x="35" y="34" class="header-main">BLOCKINGQUEUE CONCURRENCY LOCK TOPOLOGIES</text>
  <text x="35" y="52" class="header-sub">Lock Contention Analysis: ArrayBlockingQueue Single Lock vs. LinkedBlockingQueue Dual Lock Architecture</text>

  <!-- ========================================================================= -->
  <!-- TOP PANEL: ARRAYBLOCKINGQUEUE (SINGLE REENTRANTLOCK) -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 75)">
    <rect width="890" height="190" rx="10" fill="#0d1424" stroke="#1e293b" />
    
    <!-- Header -->
    <text x="20" y="28" class="panel-name">ArrayBlockingQueue: Single Shared ReentrantLock</text>
    <rect x="650" y="14" width="220" height="22" rx="4" fill="#3b1115" stroke="#ef4444" />
    <text x="760" y="29" text-anchor="middle" class="badge-warn">PRODUCERS BLOCK CONSUMERS</text>

    <!-- Producer Threads Box -->
    <g transform="translate(30, 52)">
      <rect width="180" height="74" rx="7" fill="url(#threadGrad)" stroke="#475569" stroke-width="1.2" />
      <text x="14" y="22" class="box-title">Producer Threads</text>
      <text x="14" y="40" class="box-sub">put(E) / offer(E, timeout)</text>
      <text x="14" y="58" class="box-sub" fill="#38bdf8">Waits on: <tspan font-family="monospace">notFull</tspan></text>
    </g>

    <!-- Contention Lock Box in Center -->
    <g transform="translate(325, 42)" filter="url(#shadow)">
      <rect width="240" height="94" rx="8" fill="url(#lockSingleGrad)" stroke="#ef4444" stroke-width="1.8" />
      <text x="120" y="24" text-anchor="middle" class="box-title" fill="#fca5a5" font-size="12.5px">Single ReentrantLock</text>
      <text x="120" y="42" text-anchor="middle" class="box-sub" fill="#fecaca">Mutual Exclusion (Puts vs. Takes)</text>
      <rect x="20" y="52" width="200" height="28" rx="4" fill="#1f0a0a" stroke="#7f1d1d" />
      <text x="120" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#f87171">
        Condition: notEmpty | notFull
      </text>
    </g>

    <!-- Consumer Threads Box -->
    <g transform="translate(680, 52)">
      <rect width="180" height="74" rx="7" fill="url(#threadGrad)" stroke="#475569" stroke-width="1.2" />
      <text x="14" y="22" class="box-title">Consumer Threads</text>
      <text x="14" y="40" class="box-sub">take() / poll(timeout)</text>
      <text x="14" y="58" class="box-sub" fill="#38bdf8">Waits on: <tspan font-family="monospace">notEmpty</tspan></text>
    </g>

    <!-- Contention Arrows pointing to the same single lock -->
    <path d="M 210 89 L 325 89" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowRed)" />
    <path d="M 680 89 L 565 89" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowRed)" />

    <!-- Explanatory footer -->
    <text x="20" y="165" class="desc-text">
      <tspan fill="#f87171" font-weight="600">Bottleneck:</tspan> Both producers and consumers must acquire the same lock. An ongoing take() holds the lock, stalling concurrent put() calls even when the array has abundant spare capacity.
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM PANEL: LINKEDBLOCKINGQUEUE (TWO INDEPENDENT LOCKS) -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 285)">
    <rect width="890" height="210" rx="10" fill="#0d1424" stroke="#1e293b" />
    
    <!-- Header -->
    <text x="20" y="28" class="panel-name">LinkedBlockingQueue: Two Independent Locks (High Throughput)</text>
    <rect x="650" y="14" width="220" height="22" rx="4" fill="#062e24" stroke="#059669" />
    <text x="760" y="29" text-anchor="middle" class="badge-pass">ZERO CONTENTION (PUT || TAKE)</text>

    <!-- Producer Side -->
    <g transform="translate(30, 50)">
      <rect width="160" height="68" rx="6" fill="url(#threadGrad)" stroke="#475569" />
      <text x="12" y="22" class="box-title">Producer Threads</text>
      <text x="12" y="38" class="box-sub">put(E) / offer(E)</text>
      <text x="12" y="54" class="box-sub" fill="#34d399">Signal: notEmpty</text>
    </g>

    <!-- Dedicated putLock -->
    <path d="M 190 84 L 225 84" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrowGreen)" />
    <g transform="translate(225, 46)" filter="url(#shadow)">
      <rect width="165" height="76" rx="7" fill="url(#lockDualGrad)" stroke="#34d399" stroke-width="1.5" />
      <text x="82" y="24" text-anchor="middle" class="box-title" fill="#a7f3d0">putLock</text>
      <text x="82" y="42" text-anchor="middle" class="box-sub" fill="#6ee7b7">Protects: tail node (last)</text>
      <rect x="15" y="48" width="135" height="20" rx="3" fill="#0c1f1b" stroke="#059669" />
      <text x="82" y="62" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">Condition: notFull</text>
    </g>

    <!-- Center Queue & Atomic Counter -->
    <g transform="translate(420, 46)">
      <rect width="120" height="76" rx="6" fill="#131b2e" stroke="#38bdf8" stroke-width="1.2" />
      <text x="60" y="22" text-anchor="middle" class="box-title" font-size="10.5px">AtomicInteger</text>
      <text x="60" y="38" text-anchor="middle" class="box-title" fill="#38bdf8" font-size="13px">count</text>
      <text x="60" y="56" text-anchor="middle" class="box-sub" font-size="9.5px">Bridges Lock</text>
      <text x="60" y="68" text-anchor="middle" class="box-sub" font-size="9.5px">Signaling</text>
    </g>

    <!-- Dedicated takeLock -->
    <g transform="translate(570, 46)" filter="url(#shadow)">
      <rect width="165" height="76" rx="7" fill="url(#lockDualGrad)" stroke="#34d399" stroke-width="1.5" />
      <text x="82" y="24" text-anchor="middle" class="box-title" fill="#a7f3d0">takeLock</text>
      <text x="82" y="42" text-anchor="middle" class="box-sub" fill="#6ee7b7">Protects: head node (first)</text>
      <rect x="15" y="48" width="135" height="20" rx="3" fill="#0c1f1b" stroke="#059669" />
      <text x="82" y="62" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">Condition: notEmpty</text>
    </g>
    <path d="M 735 84 L 770 84" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrowGreen)" />

    <!-- Consumer Side -->
    <g transform="translate(770, 50)">
      <rect width="160" height="68" rx="6" fill="url(#threadGrad)" stroke="#475569" />
      <text x="12" y="22" class="box-title">Consumer Threads</text>
      <text x="12" y="38" class="box-sub">take() / poll()</text>
      <text x="12" y="54" class="box-sub" fill="#34d399">Signal: notFull</text>
    </g>

    <!-- Arrows linking locks to atomic counter -->
    <path d="M 390 84 L 420 84" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="1.2" fill="none" />
    <path d="M 570 84 L 540 84" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="1.2" fill="none" />

    <!-- Explanatory footer -->
    <text x="20" y="165" class="desc-text">
      <tspan fill="#34d399" font-weight="600">Dual-Lock Invariant:</tspan> Producers manipulate <tspan font-family="monospace">last.next</tspan> under <tspan font-family="monospace">putLock</tspan>, while consumers decouple <tspan font-family="monospace">head.next</tspan> under <tspan font-family="monospace">takeLock</tspan>.
    </text>
    <text x="20" y="185" class="desc-text" fill="#94a3b8">
      Both streams operate concurrently with zero contention unless the queue hits total saturation (full) or complete starvation (empty).
    </text>
  </g>
</svg>
